<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Trắc nghiệm Hội nghị Trung ương 4 khóa XIV</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#B3171F">
<meta name="color-scheme" content="light dark">
<style>
:root{--bg:#F3F5F9;--card:#FFFFFF;--card2:#F4F6FA;--line:#DCE2EB;--ink:#15202E;--muted:#5B6B7E;
--red:#B3171F;--red-h:#8E1218;--red-bg:#FCEBEC;--gold:#F2B205;--gold-h:#D99F00;--gold-ink:#3A2A00;--gold-bg:#FFF3C9;--gold-tx:#6B4B00;
--ok:#157A47;--ok-bg:#E2F5EA;--bad:#C0281F;--bad-bg:#FDE9E7;--blue:#2F6FDE;--band:#7E0F15;--cream:#F6D5D7;--shadow:0 6px 24px rgba(21,32,46,.08)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D1420;--card:#162131;--card2:#1C2A3D;--line:#2B3B52;--ink:#EAF0F8;--muted:#9DB0C6;
--red:#E5484D;--red-h:#C93A40;--red-bg:#3A1D24;--gold:#F5C547;--gold-h:#E2B23A;--gold-ink:#2B1F00;--gold-bg:#3A3010;--gold-tx:#F5D77A;
--ok:#5FD39A;--ok-bg:#123626;--bad:#FF8A80;--bad-bg:#40191A;--blue:#6AA2FF;--band:#3B070C;--cream:#F1C9CC;--shadow:0 6px 24px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#0D1420;--card:#162131;--card2:#1C2A3D;--line:#2B3B52;--ink:#EAF0F8;--muted:#9DB0C6;
--red:#E5484D;--red-h:#C93A40;--red-bg:#3A1D24;--gold:#F5C547;--gold-h:#E2B23A;--gold-ink:#2B1F00;--gold-bg:#3A3010;--gold-tx:#F5D77A;
--ok:#5FD39A;--ok-bg:#123626;--bad:#FF8A80;--bad-bg:#40191A;--blue:#6AA2FF;--band:#3B070C;--cream:#F1C9CC;--shadow:0 6px 24px rgba(0,0,0,.4)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;line-height:1.5;font-size:16px}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
.banner{position:relative;background:var(--band)}
.banner img{display:block;width:100%;height:max(23.6vw,min(42vh,33.7vw));object-fit:cover;object-position:top}
.credit{background:var(--band);color:var(--cream);text-align:center;padding:10px max(16px,env(safe-area-inset-left));font-size:13px;line-height:1.45;letter-spacing:.02em;border-top:3px solid var(--gold)}
.credit b{color:#fff;font-weight:700}
.credit span{display:block}
@media(min-width:760px){.credit span{display:inline}.credit span+span:before{content:"  ·  "}}
.tbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:inline-flex;align-items:center;justify-content:center;font-size:18px;box-shadow:var(--shadow)}
.banner .tbtn{position:absolute;top:max(10px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));background:rgba(255,255,255,.85);color:#222;border-color:transparent}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:20px}
.hero{margin-top:-1px;padding:26px 0 8px}
h1{font-size:clamp(22px,4.6vw,34px);line-height:1.2;margin:0 0 6px;color:var(--red);letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 18px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:18px}
@media(min-width:700px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;border-left:4px solid var(--gold)}
.stat b{display:block;font-size:26px;line-height:1.1;color:var(--red)}
.stat small{color:var(--muted)}
.modes{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;margin-bottom:16px}
@media(min-width:700px){.modes{grid-template-columns:repeat(2,minmax(0,1fr))}}
.mode{text-align:left;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px 16px;display:block;width:100%}
.mode.on{border-color:var(--red);background:var(--red-bg)}
.mode h3{margin:0 0 4px;font-size:17px}
.mode p{margin:0;color:var(--muted);font-size:14px}
.go{display:block;width:100%;background:var(--gold);color:var(--gold-ink);border:0;border-radius:14px;padding:15px 20px;font-size:18px;font-weight:800;box-shadow:0 6px 0 var(--gold-h);transition:transform .08s,box-shadow .08s}
.go:hover{background:var(--gold-h)}
.go:active{transform:translateY(4px);box-shadow:0 2px 0 var(--gold-h)}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 16px;font-weight:600}
.btn:hover{border-color:var(--red);color:var(--red)}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff}
.btn.pri:hover{background:var(--red-h);color:#fff}
.btn[disabled]{opacity:.45;cursor:default}
.best{margin:12px 0 0;text-align:center;color:var(--muted);font-size:14px}
details{margin-top:16px}
summary{cursor:pointer;font-weight:700;padding:12px 16px;background:var(--card);border:1px solid var(--line);border-radius:12px}
.refs{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:8px}
.refs li{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:14px}
.refs b{color:var(--red)}
.ladder{margin:22px 0 40px}
.ladder h2,.sec-t{font-size:18px;margin:0 0 10px}
.lad{display:grid;gap:8px}
.lad div{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:14px}
.lad b{min-width:84px;color:var(--red)}
.lad em{font-style:normal;color:var(--muted)}
/* quiz */
.bar{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 0;padding-top:max(10px,env(safe-area-inset-top))}
.bar .wrap{display:flex;align-items:center;gap:10px}
.bar .mid{flex:1;min-width:0}
.bar .t1{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.prog{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:4px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--gold));border-radius:99px;transition:width .3s}
.qlay{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;padding:18px 0 24px}
@media(min-width:900px){.qlay{grid-template-columns:minmax(0,1fr) 280px;align-items:start}.side{position:sticky;top:76px}}
.qtags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tag{font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--card2);border:1px solid var(--line);color:var(--muted)}
.tag.red{background:var(--red-bg);color:var(--red);border-color:transparent}
.qtext{font-size:clamp(17px,2.4vw,20px);font-weight:700;line-height:1.4;margin:0 0 14px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 14px;transition:border-color .12s,background .12s}
.opt:hover:not([disabled]){border-color:var(--red)}
.opt .k{flex:none;width:30px;height:30px;border-radius:50%;background:var(--card2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.opt .tx{flex:1;min-width:0;overflow-wrap:anywhere}
.opt.sel{border-color:var(--red);background:var(--red-bg)}
.opt.sel .k{background:var(--red);color:#fff;border-color:var(--red)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.ok .k{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt.bad .k{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt[disabled]{cursor:default}
.exp{margin-top:14px;border-radius:14px;padding:14px 16px;border:1px solid var(--line);background:var(--card2);font-size:15px}
.exp.ok{background:var(--ok-bg);border-color:var(--ok)}
.exp.bad{background:var(--bad-bg);border-color:var(--bad)}
.exp h4{margin:0 0 6px;font-size:15px}
.exp.ok h4{color:var(--ok)}.exp.bad h4{color:var(--bad)}
.tip{margin-top:10px;background:var(--gold-bg);color:var(--gold-tx);border-left:5px solid var(--gold);border-radius:10px;padding:10px 14px;font-size:15px}
.tip b{letter-spacing:.06em;font-size:12px;display:block;margin-bottom:2px}
.nav{position:sticky;bottom:0;z-index:15;background:var(--bg);border-top:1px solid var(--line);padding:10px 0;padding-bottom:max(10px,env(safe-area-inset-bottom))}
.nav .wrap{display:flex;gap:10px}
.nav .btn{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.gn{height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:14px;padding:0;position:relative}
.gn.cur{outline:3px solid var(--gold)}
.gn.done{background:var(--red);border-color:var(--red);color:#fff}
.gn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.gn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.gn.fl:after{content:"⚑";position:absolute;top:-6px;right:-3px;font-size:13px;color:var(--gold)}
.legend{font-size:12px;color:var(--muted);margin-top:10px}
.flagb{font-size:13px;padding:6px 12px;border-radius:99px}
.flagb.on{background:var(--gold-bg);border-color:var(--gold);color:var(--gold-tx)}
/* modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.ov .card{max-width:420px;width:100%}
.ov h3{margin:0 0 8px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.row .btn{flex:1}
/* result */
.rtop{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;align-items:center;text-align:center}
@media(min-width:760px){.rtop{grid-template-columns:200px minmax(0,1fr);text-align:left}}
.ring{position:relative;width:180px;height:180px;margin:0 auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .tr{fill:none;stroke:var(--line);stroke-width:12}
.ring .fg{fill:none;stroke:var(--red);stroke-width:12;stroke-linecap:round;stroke-dasharray:326.7;stroke-dashoffset:326.7;transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)}
.ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .num b{font-size:40px;line-height:1;color:var(--red)}
.ring .num small{color:var(--muted)}
.gb{display:inline-block;background:var(--gold);color:var(--gold-ink);font-weight:800;border-radius:99px;padding:4px 16px;font-size:18px;margin-bottom:6px}
.rstats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:16px 0}
@media(min-width:700px){.rstats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.rs{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.rs b{display:block;font-size:24px}
.rs.ok b{color:var(--ok)}.rs.bad b{color:var(--bad)}
.rs small{color:var(--muted)}
.comments{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;margin:0 0 16px}
.comments p{margin:0;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:10px;padding:10px 14px;font-size:15px}
.meters{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.meter-top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:14px;margin-bottom:4px}
.meter-top span{color:var(--muted)}
.mbar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.mbar i{display:block;height:100%;border-radius:99px;width:0;transition:width .9s ease}
.l-hi i{background:var(--ok)}.l-mid i{background:var(--gold)}.l-lo i{background:var(--bad)}
.recall{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;margin:0;padding:0;list-style:none}
.recall li{background:var(--gold-bg);color:var(--gold-tx);border-left:5px solid var(--gold);border-radius:10px;padding:10px 14px;font-size:14px}
.sec{margin-top:22px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{border-radius:99px;padding:6px 14px;font-size:14px;border:1px solid var(--line);background:var(--card)}
.chip.on{background:var(--red);border-color:var(--red);color:#fff}
.rv{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.rv .card{padding:16px}
.rv .opt{cursor:default;padding:8px 12px}
.rv .opt:hover{border-color:var(--line)}
.rv .opt.ok:hover{border-color:var(--ok)}.rv .opt.bad:hover{border-color:var(--bad)}
.acts{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;margin:18px 0 40px}
@media(min-width:700px){.acts{grid-template-columns:repeat(3,minmax(0,1fr))}}
.btn.sm{padding:8px 14px;font-size:14px}
.privacy{margin:10px 0 0;text-align:center;color:var(--muted);font-size:13px}
.bigstat{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:14px 0}
@media(min-width:700px){.bigstat{grid-template-columns:repeat(3,minmax(0,1fr))}}
.hq{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.hq li{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:14px}
.hq b{color:var(--red)}
.hb{background:linear-gradient(135deg,#7E0F15,#B3171F 55%,#8E1218);padding:46px 16px 38px;text-align:center;color:#fff}.hbi small{display:block;letter-spacing:.08em;font-weight:700;color:#F5C547;font-size:13px}.hbi strong{display:block;font-size:clamp(28px,6vw,52px);font-weight:900;line-height:1.1;margin:10px 0}.hbi em{font-style:normal;color:#F6D5D7;font-size:15px}
.exp a,.refs a{color:var(--blue);font-weight:600}
.tag.lnk{text-decoration:none;cursor:pointer;border-color:var(--blue);color:var(--blue)}.tag.red.lnk{background:var(--red-bg);color:var(--red);border-color:transparent}.tag.lnk:hover{text-decoration:underline}
.note{padding:14px 16px;background:var(--gold-bg);color:var(--gold-tx);border-radius:12px;margin:20px 0;font-size:15px}
#boot{padding:24px;margin:24px auto;max-width:560px;background:var(--gold-bg);color:var(--gold-tx);border-radius:12px;font-size:15px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

ir","note":"Bạn nắm được phần lớn nội dung; nên đọc lại văn kiện của các câu làm sai."},{"min":5,"name":"Đạt","cls":"g-pass","note":"Đạt mức tối thiểu; nên học lại bằng chế độ học rồi làm lại."},{"min":0,"name":"Cần ôn lại","cls":"g-fail","note":"Nên đọc lại các văn kiện, học lại từng câu ở chế độ học rồi làm lại bài."}],"REF":[["NGHỊ QUYẾT SỐ 31-NQ/TW NGÀY 15/10/2026","Về tăng cường xây dựng, chỉnh đốn Đảng và hệ thống chính trị trong sạch, vững mạnh toàn diện, đáp ứng yêu cầu phát triển của đất nước trong kỷ nguyên mới","https://tulieuvankien.dangcongsan.vn/he-thong-van-ban/van-ban-cua-dang/nghi-quyet-so-31-nq-tw-ngay-15-10-2026-hoi-nghi-lan-thu-tu-ban-chap-hanh-trung-uong-dang-khoa-xiv-ve-tang-cuong-xay-dung.html"],["NGHỊ QUYẾT SỐ 29-NQ/TW NGÀY 15/10/2026","Về tiếp tục đổi mới, hoàn thiện phương thức lãnh đạo, cầm quyền của Đảng trong kỷ nguyên mới","https://tulieuvankien.dangcongsan.vn/he-thong-van-ban/van-ban-cua-dang/nghi-quyet-so-29-nq-tw-ngay-15-10-2026-hoi-nghi-lan-thu-tu-ban-chap-hanh-trung-uong-dang-khoa-xiv-ve-tiep-tuc-doi-moi-ho.html"],["NGHỊ QUYẾT SỐ 30-NQ/TW NGÀY 15/10/2026","Về tiếp tục xây dựng đội ngũ cán bộ các cấp và đổi mới căn bản, toàn diện công tác cán bộ đáp ứng yêu cầu phát triển đất nước trong kỷ nguyên mới","https://tulieuvankien.dangcongsan.vn/he-thong-van-ban/van-ban-cua-dang/nghi-quyet-so-30-nq-tw-ngay-15-101-2026-hoi-nghi-lan-thu-tu-ban-chap-hanh-trung-uong-dang-ve-tiep-tuc-xay-dung-doi-ngu-c.html?categoryId=102000092"],["QUY ĐỊNH SỐ 224-QĐ/TW NGÀY 14/10/2026","Của Ban Chấp hành Trung ương Đảng khóa XIV về đảng viên tham gia hoạt động đầu tư, kinh doanh","https://dangcongsan.vn/van-ban-cua-dang/quy-dinh-so-224-qd-tw-ngay-14-10-2026-cua-ban-chap-hanh-trung-uong-ve-dang-vien-tham-gia-hoat-dong-dau-tu-kinh-doanh.html"],["KẾT LUẬN SỐ 105-KL/TW NGÀY 15/10/2026","Của Ban Chấp hành Trung ương Đảng khóa XIV về thu hút và trọng dụng nhân tài trong các ngành, lĩnh vực mũi nhọn, phục vụ đất nước phát triển nhanh, bền vững","https://tulieuvankien.dangcongsan.vn/he-thong-van-ban/van-ban-cua-dang/ket-luan-so-105-kl-tw-ngay-15-10-2026-hoi-nghi-lan-thu-tu-ban-chap-hanh-trung-uong-dang-khoa-xiv-ve-thu-hut-va-trong-dun.html?categoryId=102000092"],["KẾT LUẬN SỐ 106-KL/TW NGÀY 15/10/2026","Của Ban Chấp hành Trung ương Đảng khóa XIV về tình hình phát triển kinh tế - xã hội, thực hiện ngân sách nhà nước năm 2026; kế hoạch năm 2027","https://tulieuvankien.dangcongsan.vn/he-thong-van-ban/van-ban-cua-dang/ket-luan-so-106-kl-tw-ngay-15-10-2026-hoi-nghi-lan-thu-tu-ban-chap-hanh-trung-uong-dang-khoa-xiv-ve-tinh-hinh-phat-trien.html?categoryId=102000092"]],"BANK":[{"s":"A","y":"NH","r":"NQ 31-NQ/TW","q":"Đặt trong yêu cầu phát triển đất nước ở kỷ nguyên mới, nhận thức nào phản ánh đầy đủ nhất vị trí và yêu cầu đối với công tác xây dựng, chỉnh đốn Đảng?","o":["Đây là nhiệm vụ then chốt, thường xuyên, quyết định thành công của sự nghiệp xây dựng và bảo vệ Tổ quốc trong kỷ nguyên mới.","Đây là nhiệm vụ trọng tâm trong giai đoạn kiện toàn tổ chức bộ máy; kết quả chủ yếu thể hiện ở sự hoàn chỉnh về tổ chức, quy chế và đội ngũ.","Đây là nhiệm vụ tập trung vào phát hiện, xử lý vi phạm và tăng cường kỷ luật, qua đó cũng cố sức chiến đấu và giữ vững sự ổn định của tổ chức đảng."],"e":"Đáp án đúng: Đây là nhiệm vụ then chốt, thường xuyên, quyết định thành công của sự nghiệp xây dựng và bảo vệ Tổ quốc trong kỷ nguyên mới.","t":""},{"s":"A","y":"NH","r":"NQ 31-NQ/TW","q":"Quan hệ giữa “kiên định” và “đổi mới” được thể hiện như thế nào trong tư duy chỉ đạo của Nghị quyết?","o":["Kiên định và vận dụng, phát triển sáng tạo chủ nghĩa Mác-Lênin, tư tưởng Hồ Chí Minh, lý luận về đường lối đổi mới, mục tiêu độc lập dân tộc và chủ nghĩa xã hội, các nguyên tắc tổ chức, hoạt động của Đảng. Trên nền tảng đó, không ngừng đổi mới tư duy, phát triển lý luận, tổng kết thực tiễn, nâng cao năng lực dự báo và kiến tạo tầm nhìn dài hạn.","Kiên định mục tiêu và nguyên tắc là nền tảng; đổi mới chỉ cần đặt ra ở cách tổ chức thực hiện, không nhất thiết phát triển nhận thức và lý luận.","Đổi mới phải đi trước để đáp ứng thực tiễn; khi yêu cầu phát triển thay đổi có thể chủ động điều chỉnh các nguyên tắc nền tảng."],"e":"Đáp án đúng: Kiên định và vận dụng, phát triển sáng tạo chủ nghĩa Mác-Lênin, tư tưởng Hồ Chí Minh, lý luận về đường lối đổi mới, mục tiêu độc lập dân tộc và chủ nghĩa xã hội, các nguyên tắc tổ chức, hoạt động của Đảng. Trên nền tảng đó, không ngừng đổi mới tư duy, phát triển lý luận, tổng kết thực tiễn, nâng cao năng lực dự báo và kiến tạo tầm nhìn dài hạn.","t":""},{"s":"A","y":"NH","r":"NQ 31-NQ/TW","q":"Điểm cốt lõi nào thể hiện hiệu quả xử lý vi phạm, không để vi phạm tương tự tái diễn?","o":["Chuyển mạnh từ phát hiện, xử lý khi vi phạm sang chủ động nhận diện, cảnh báo, phòng ngừa từ sớm, từ xa, từ gốc; kết hợp xử lý nghiêm vi phạm với loại bỏ nguyên nhân, điều kiện phát sinh và ngăn ngừa tái diễn.","Tiếp tục tăng mức xử lý kỷ luật đối với các trường hợp trực tiếp vi phạm, coi tính nghiêm minh của xử lý là kết quả khắc phục chủ yếu.","Tập trung giáo dục, nhắc nhở và hoàn thiện hồ sơ kiểm điểm; chuyển việc theo dõi các nguy cơ tái diễn sang các kỳ kiểm tra tiếp theo."],"e":"Đáp án đúng: Chuyển mạnh từ phát hiện, xử lý khi vi phạm sang chủ động nhận diện, cảnh báo, phòng ngừa từ sớm, từ xa, từ gốc; kết hợp xử lý nghiêm vi phạm với loại bỏ nguyên nhân, điều kiện phát sinh và ngăn ngừa tái diễn.","t":""},{"s":"A","y":"NH","r":"NQ 31-NQ/TW","q":"Đâu là điểm nâng tầm cốt lõi của yêu cầu “tự đổi mới, tự chỉnh đốn, tự hoàn thiện” đối với một đảng cầm quyền?","o":["Tạo chuyển biến sâu sắc về nhận thức và hành động trong toàn Đảng và hệ thống chính trị về xây dựng, chỉnh đốn Đảng là quy luật phát triển, nhu cầu tự thân, thường xuyên của Đảng.","Tăng tần suất kiểm điểm, đánh giá và sơ kết để các cấp ủy sớm nhận diện và khắc phục khuyết điểm.","Tăng cường sự giám sát từ cơ quan cấp trên và các chủ thể bên ngoài để kịp thời phát hiện sai phạm."],"e":"Đáp án đúng: Tạo chuyển biến sâu sắc về nhận thức và hành động trong toàn Đảng và hệ thống chính trị về xây dựng, chỉnh đốn Đảng là quy luật phát triển, nhu cầu tự thân, thường xuyên của Đảng.","t":""},{"s":"A","y":"NH","r":"NQ 31-NQ/TW","q":"Thước đo nào cho thấy rõ nhất công tác xây dựng, chỉnh đốn Đảng thực sự góp phần nâng cao năng lực lãnh đạo, cầm quyền?","o":["Chất lượng chủ trương, quyết sách, năng lực và hiệu quả tổ chức thực hiện, kết quả phát triển của đất nước.","Số lượng nghị quyết, chủ trương, chương trình, kế hoạch được ban hành và mức độ hoàn thành quy trình triển khai.","Kết quả tăng trưởng và các chỉ tiêu kinh tế - xã hội, không cần gắn riêng với chất lượng quyết sách, trách nhiệm và tiến độ tổ chức thực hiện."],"e":"Đáp án đúng: Chất lượng chủ trương, quyết sách, năng lực và hiệu quả tổ chức thực hiện, kết quả phát triển của đất nước.","t":""},{"s":"A","y":"NH","r":"NQ 31-NQ/TW","q":"Phương án nào thể hiện đúng nhất bước phát triển trong việc xây dựng Đảng “thật sự là đạo đức, là văn minh” theo Nghị quyết?","o":["Chuyển các giá trị vì nước, vì dân, cần, kiệm, liêm chính, chí công vô tư, trung thực, nêu gương từ yêu cầu tu dưỡng, rèn luyện thành chuẩn mực bắt buộc trong ứng xử, ra quyết định, sử dụng quyền lực và kỷ luật thực thi công vụ.","Đặt trọng tâm vào giáo dục, tự giác tu dưỡng và các phong trào nêu gương; các chuẩn mực về hành vi, quyết định và sử dụng quyền lực sẽ hình thành từ quá trình rèn luyện.","Xây dựng hệ thống văn hóa lãnh đạo, văn hóa cầm quyền, văn hóa quản lý và văn hóa liêm chính như bốn thành tố độc lập ngang nhau; đánh giá chủ yếu qua việc tuân thủ quy tắc ứng xử."],"e":"Đáp án đúng: Chuyển các giá trị vì nước, vì dân, cần, kiệm, liêm chính, chí công vô tư, trung thực, nêu gương từ yêu cầu tu dưỡng, rèn luyện thành chuẩn mực bắt buộc trong ứng xử, ra quyết định, sử dụng quyền lực và kỷ luật thực thi công vụ.","t":""},{"s":"A","y":"NH","r":"NQ 31-NQ/TW","q":"Theo Nghị quyết, khi phân cấp nhiệm vụ cho cấp sát việc, sát dân, phương án nào bảo đảm đồng bộ nhất giữa trao quyền và trách nhiệm?","o":["Trao đủ thẩm quyền, nguồn lực và trách nhiệm giải trình; cấp trên tập trung định hướng, tiêu chuẩn, kiểm tra, giám sát, cấp dưới chủ động quyết định và chịu trách nhiệm theo thẩm quyền. Kiểm soát quyền lực xuyên suốt từ giao quyền, thực hiện quyền đến kiểm tra, giám sát.","Giao rõ nhiệm vụ, tăng nguồn lực nhưng vẫn yêu cầu cấp dưới xin ý kiến cấp trên trước các quyết định thuộc thẩm quyền để giảm rủi ro.","Trao quyền quyết định và yêu cầu cấp dưới tự chịu trách nhiệm; hoạt động kiểm tra, giám sát chủ yếu tiến hành sau khi phát sinh khó khăn, sai phạm."],"e":"Đáp án đúng: Trao đủ thẩm quyền, nguồn lực và trách nhiệm giải trình; cấp trên tập trung định hướng, tiêu chuẩn, kiểm tra, giám sát, cấp dưới chủ động quyết định và chịu trách nhiệm theo thẩm quyền. Kiểm soát quyền lực xuyên suốt từ giao quyền, thực hiện quyền đến kiểm tra, giám sát.","t":""},{"s":"A","y":"NH","r":"NQ 31-NQ/TW","q":"Theo quan điểm “Dân là gốc”, đâu là cách hiểu đầy đủ nhất về cơ sở tạo dựng và kiểm chứng uy tín của Đảng?","o":["Xây dựng Đảng phải vì Nhân dân, dựa vào Nhân dân và chịu sự giám sát của Nhân dân. Lấy chất lượng cuộc sống, sự đồng thuận và niềm tin của Nhân dân làm thước đo.","Đề cao sự đồng thuận của Nhân dân trong quá trình góp ý chủ trương, quyết sách; kết quả được đánh giá chủ yếu qua mức độ tham gia và ủng hộ.","Lấy sự hài lòng của Nhân dân làm thước đo; việc góp ý, giám sát và giải quyết kiến nghị trước hết do các cơ quan chuyên trách đảm nhận."],"e":"Đáp án đúng: Xây dựng Đảng phải vì Nhân dân, dựa vào Nhân dân và chịu sự giám sát của Nhân dân. Lấy chất lượng cuộc sống, sự đồng thuận và niềm tin của Nhân dân làm thước đo.","t":""},{"s":"A","y":"NH","r":"NQ 31-NQ/TW","q":"Việc khuyến khích, bảo vệ cán bộ dám nghĩ, dám làm, dám chịu trách nhiệm vì lợi ích chung phải tuân theo nguyên tắc nào?","o":["Phân biệt sai phạm do vụ lợi, cố ý làm trái với rủi ro phát sinh trong đổi mới sáng tạo; việc bảo vệ phải căn cứ động cơ trong sáng, vì lợi ích chung, đúng thẩm quyền và có kiểm soát, không bao che hoặc miễn trừ trách nhiệm.","Ưu tiên bảo vệ người có sáng kiến và có động cơ tích cực; chỉ xem xét trách nhiệm khi chứng minh được mục đích vụ lợi.","Chỉ bảo vệ các quyết định sáng tạo đã đạt kết quả dự kiến; trường hợp chưa đạt kết quả phải xử lý trách nhiệm như các vi phạm thông thường."],"e":"Đáp án đúng: Phân biệt sai phạm do vụ lợi, cố ý làm trái với rủi ro phát sinh trong đổi mới sáng tạo; việc bảo vệ phải căn cứ động cơ trong sáng, vì lợi ích chung, đúng thẩm quyền và có kiểm soát, không bao che hoặc miễn trừ trách nhiệm.","t":""},{"s":"A","y":"NH","r":"NQ 31-NQ/TW","q":"Vai trò của công nghệ số, dữ liệu và trí tuệ nhân tạo trong xây dựng Đảng văn minh thể hiện như thế nào?","o":["Là thành tố quan trọng trong “tổ chức bộ máy khoa học, tinh gọn, vận hành thông suốt”.","Chuẩn hóa các chỉ số và tự động hóa việc chấm điểm để hạn chế tối đa phán đoán, trách nhiệm của các chủ thể có thẩm quyền.","Ưu tiên hoàn thiện hồ sơ, dữ liệu điện tử và báo cáo định lượng; sử dụng kết quả trên nền tảng số làm căn cứ quyết định cuối cùng."],"e":"Đáp án đúng: Là thành tố quan trọng trong “tổ chức bộ máy khoa học, tinh gọn, vận hành thông suốt”.","t":""},{"s":"A","y":"NH","r":"NQ 31-NQ/TW","q":"Khi nhìn lại các nghị quyết Trung ương 4 khóa XI, khóa XII, Kết luận Trung ương 4 khóa XIII và định hướng của nghị quyết Trung ương 4 khóa XIV, cách khái quát nào phản ánh đúng nhất mạch kế thừa và phát triển?","o":["Yêu cầu xây dựng, chỉnh đốn nghiêm minh, kết hợp ngày càng chặt chẽ “xây” và “chống”; giữa giáo dục, rèn luyện với giữ nghiêm kỷ luật, kỷ cương và kiểm soát quyền lực; chuyển mạnh từ xử lý vi phạm sang chủ động phòng ngừa, cảnh báo từ sớm, từ xa.","Tiếp tục coi kiểm điểm, xem xét, xử lý vi phạm là nội dung bao trùm; nâng hiệu quả xây dựng Đảng chủ yếu bằng tăng cường kỷ luật và chế tài.","Chuyển trọng tâm từ xây dựng tổ chức đảng, đảng viên sang đổi mới quản lý nhà nước, coi cải cách hành chính là nội dung thay thế cơ bản cho xây dựng Đảng."],"e":"Đáp án đúng: Yêu cầu xây dựng, chỉnh đốn nghiêm minh, kết hợp ngày càng chặt chẽ “xây” và “chống”; giữa giáo dục, rèn luyện với giữ nghiêm kỷ luật, kỷ cương và kiểm soát quyền lực; chuyển mạnh từ xử lý vi phạm sang chủ động phòng ngừa, cảnh báo từ sớm, từ xa.","t":""},{"s":"A","y":"NH","r":"NQ 31-NQ/TW","q":"Từ yêu cầu “cán bộ là nhân tố quyết định”, “công tác cán bộ là then chốt của then chốt”, trách nhiệm của người đứng đầu cần được hiểu thế nào?","o":["Chịu trách nhiệm cả về kết quả công tác và chất lượng tổ chức, đội ngũ, đoàn kết nội bộ và khả năng phát huy trí tuệ tập thể.","Tập trung chịu trách nhiệm về việc phân công, kiểm tra và hoàn thành nhiệm vụ; chất lượng đội ngũ và nguồn kế cận do cấp có thẩm quyền về công tác cán bộ quyết định.","Chịu trách nhiệm về chỉ tiêu của cơ quan, đơn vị; những quyết định đã được tập thể thông qua thì chỉ xem xét trách nhiệm chung của tập thể."],"e":"Đáp án đúng: Chịu trách nhiệm cả về kết quả công tác và chất lượng tổ chức, đội ngũ, đoàn kết nội bộ và khả năng phát huy trí tuệ tập thể.","t":""},{"s":"A","y":"NH","r":"NQ 31-NQ/TW","q":"Một chi bộ sinh hoạt đủ kỳ, có đông đảng viên phát biểu nhưng ít vấn đề được giải quyết và khuyết điểm thường lặp lại. Theo Nghị quyết, tiêu chí nào cần được coi trọng để tạo chuyển biến thực chất?","o":["Sinh hoạt phải thiết thực, dân chủ, có trọng tâm, bám sát nhiệm vụ chính trị; mọi vấn đề phải được thảo luận và đi đến kết luận, phân công, thời hạn và kiểm tra kết quả.","Bảo đảm đủ nội dung, thời lượng, tỉ lệ tham gia và chất lượng biên bản sinh hoạt, coi đó là điều kiện tiên quyết đánh giá chi bộ.","Tăng thời gian trao đổi, giáo dục chính trị, tư tưởng để nâng cao đồng thuận; các vấn đề khó tiếp tục nghiên cứu, chưa cần xác định trách nhiệm ngay."],"e":"Đáp án đúng: Sinh hoạt phải thiết thực, dân chủ, có trọng tâm, bám sát nhiệm vụ chính trị; mọi vấn đề phải được thảo luận và đi đến kết luận, phân công, thời hạn và kiểm tra kết quả.","t":""},{"s":"A","y":"NH","r":"NQ 31-NQ/TW","q":"Điểm mới cần nhận thức đầy đủ về chế độ trách nhiệm thực chất là gì?","o":["Phân định rõ trách nhiệm của tập thể, cá nhân, người đứng đầu, cơ quan tham mưu, người đề xuất, người quyết định, người tổ chức thực hiện và người kiểm tra, giám sát, theo nguyên tắc quyền hạn đến đâu, trách nhiệm đến đó.","Tăng số đợt kiểm tra của cấp trên, tập trung vào các hành vi lạm quyền, vụ lợi và sử dụng sai nguồn lực đã được phát hiện.","Để hạn chế rủi ro, cấp trên giữ quyền quyết định cuối cùng đối với phần lớn vấn đề mới, khó; cấp dưới tập trung tổ chức thực hiện."],"e":"Đáp án đúng: Phân định rõ trách nhiệm của tập thể, cá nhân, người đứng đầu, cơ quan tham mưu, người đề xuất, người quyết định, người tổ chức thực hiện và người kiểm tra, giám sát, theo nguyên tắc quyền hạn đến đâu, trách nhiệm đến đó.","t":""},{"s":"A","y":"NH","r":"NQ 31-NQ/TW","q":"Một chủ trương được đánh giá là đúng nhưng triển khai chậm, không tạo chuyển biến rõ. Theo tinh thần đổi mới của Nghị quyết, khâu nào phải được thay đổi căn bản?","o":["Quản trị xuyên suốt từ xác định vấn đề, chuẩn bị quyết sách, thể chế hóa đến giao người, thẩm quyền, nguồn lực, tổ chức thực hiện, kiểm tra, phản hồi, điều chỉnh; đo kết quả và quy trách nhiệm đến cùng.","Tăng cường quán triệt, tuyên truyền và ban hành văn bản hướng dẫn kịp thời, đồng thời giao cấp dưới chủ động lựa chọn biện pháp thực hiện.","Tổ chức thêm các đợt kiểm tra cuối kỳ, tổng hợp kết quả và rút kinh nghiệm để hoàn thiện việc ban hành nghị quyết ở nhiệm kỳ sau."],"e":"Đáp án đúng: Quản trị xuyên suốt từ xác định vấn đề, chuẩn bị quyết sách, thể chế hóa đến giao người, thẩm quyền, nguồn lực, tổ chức thực hiện, kiểm tra, phản hồi, điều chỉnh; đo kết quả và quy trách nhiệm đến cùng.","t":""},{"s":"B","y":"NH","r":"NQ 29-NQ/TW","q":"Theo Nghị quyết, Đảng thực hiện phương thức lãnh đạo chủ yếu bằng những phương thức nào?","o":["Bằng Cương lĩnh, đường lối, chủ trương, định hướng chiến lược; công tác tư tưởng, tuyên truyền, vận động; công tác tổ chức, cán bộ; kiểm tra, giám sát, kiểm soát quyền lực; vai trò tiên phong, gương mẫu của cán bộ, đảng viên.","Bằng hoạt động quản lý hành chính, điều hành trực tiếp và quyết định thay các cơ quan nhà nước.","Chủ yếu bằng việc phân bổ nguồn lực, ban hành pháp luật và trực tiếp tổ chức thực hiện mọi nhiệm vụ phát triển kinh tế - xã hội."],"e":"Đáp án đúng: Bằng Cương lĩnh, đường lối, chủ trương, định hướng chiến lược; công tác tư tưởng, tuyên truyền, vận động; công tác tổ chức, cán bộ; kiểm tra, giám sát, kiểm soát quyền lực; vai trò tiên phong, gương mẫu của cán bộ, đảng viên.","t":""},{"s":"B","y":"NH","r":"NQ 29-NQ/TW","q":"Quan điểm của Nghị quyết về mối quan hệ giữa quyền lãnh đạo và trách nhiệm chính trị được xác định như thế nào?","o":["Quyền lãnh đạo gắn với trách nhiệm chính trị; thẩm quyền đến đâu, trách nhiệm đến đó.","Quyền lãnh đạo thuộc về tập thể; cá nhân chỉ chịu trách nhiệm chính trị khi có vi phạm pháp luật.","Cấp trên chịu trách nhiệm thay cho cấp dưới đối với mọi nhiệm vụ đã phân cấp, phân quyền."],"e":"Đáp án đúng: Quyền lãnh đạo gắn với trách nhiệm chính trị; thẩm quyền đến đâu, trách nhiệm đến đó.","t":""},{"s":"B","y":"NH","r":"NQ 29-NQ/TW","q":"Nội dung nào sau đây được Nghị quyết xác định là thước đo hiệu quả lãnh đạo, cầm quyền?","o":["Chất lượng quyết sách, kết quả thực hiện, sự phát triển của đất nước và sự hài lòng của Nhân dân.","Số lượng văn bản, nghị quyết được ban hành và số cuộc họp được tổ chức trong từng năm.","Mức độ phân cấp, phân quyền và số lượng nhiệm vụ được giao cho cấp dưới."],"e":"Đáp án đúng: Chất lượng quyết sách, kết quả thực hiện, sự phát triển của đất nước và sự hài lòng của Nhân dân.","t":""},{"s":"B","y":"NH","r":"NQ 29-NQ/TW","q":"Mục tiêu tổng quát về đổi mới phương thức lãnh đạo, cầm quyền của Đảng được Nghị quyết xác định theo hướng nào?","o":["Khoa học, dân chủ, pháp quyền, hiện đại, vì lợi ích quốc gia - dân tộc và vì Nhân dân.","Tập trung thống nhất mọi hoạt động quản lý, điều hành vào cấp ủy để bảo đảm sự lãnh đạo toàn diện.","Ưu tiên hoàn thiện tổ chức bộ máy trước, việc đổi mới phương thức lãnh đạo được thực hiện sau khi bộ máy ổn định."],"e":"Đáp án đúng: Khoa học, dân chủ, pháp quyền, hiện đại, vì lợi ích quốc gia - dân tộc và vì Nhân dân.","t":""},{"s":"B","y":"NH","r":"NQ 29-NQ/TW","q":"Đến năm 2045, Nghị quyết đặt ra yêu cầu chủ yếu nào đối với phương thức lãnh đạo, cầm quyền của Đảng?","o":["Thực sự khoa học, dân chủ, pháp quyền, hiện đại, thích ứng cao, phù hợp với yêu cầu quản trị quốc gia hiện đại, gắn với mục tiêu trở thành nước phát triển, thu nhập cao theo định hướng xã hội chủ nghĩa.","Hoàn thành việc phân cấp toàn bộ thẩm quyền của Trung ương cho địa phương và cơ sở.","Tập trung chuẩn hóa quy trình nội bộ, lấy số lượng văn bản ban hành làm tiêu chí đánh giá chủ yếu."],"e":"Đáp án đúng: Thực sự khoa học, dân chủ, pháp quyền, hiện đại, thích ứng cao, phù hợp với yêu cầu quản trị quốc gia hiện đại, gắn với mục tiêu trở thành nước phát triển, thu nhập cao theo định hướng xã hội chủ nghĩa.","t":""},{"s":"B","y":"NH","r":"NQ 29-NQ/TW","q":"Việc vận hành thực chất cơ chế “Đảng lãnh đạo, Nhà nước quản lý, Nhân dân làm chủ” đòi hỏi điều gì?","o":["Đảng xác định đường lối, định hướng chiến lược, quyết định vấn đề lớn theo thẩm quyền; Nhà nước kịp thời thể chế hóa, quản lý, điều hành, kiến tạo phát triển; Nhân dân thực hiện quyền làm chủ, tham gia xây dựng Đảng, xây dựng Nhà nước, giám sát hoạt động của hệ thống chính trị và thụ hưởng thành quả phát triển.","Đảng trực tiếp thực hiện các công việc quản lý, điều hành; Nhà nước chủ yếu làm nhiệm vụ tham mưu và báo cáo.","Mặt trận Tổ quốc Việt Nam thay cơ quan nhà nước tổ chức thực hiện chính sách và giải quyết công việc hành chính cho Nhân dân."],"e":"Đáp án đúng: Đảng xác định đường lối, định hướng chiến lược, quyết định vấn đề lớn theo thẩm quyền; Nhà nước kịp thời thể chế hóa, quản lý, điều hành, kiến tạo phát triển; Nhân dân thực hiện quyền làm chủ, tham gia xây dựng Đảng, xây dựng Nhà nước, giám sát hoạt động của hệ thống chính trị và thụ hưởng thành quả phát triển.","t":""},{"s":"B","y":"NH","r":"NQ 29-NQ/TW","q":"Theo Nghị quyết, mỗi quyết sách phải xác định rõ những nội dung chủ yếu nào?","o":["Mục tiêu cuối cùng, chủ thể thực hiện, trách nhiệm, nguồn lực, thời hạn, sản phẩm.","Chủ yếu xác định cơ quan chủ trì và thời điểm báo cáo; các nội dung còn lại được bổ sung trong quá trình thực hiện.","Chỉ cần xác định mục tiêu và tiến độ; chủ thể thực hiện được lựa chọn sau khi quyết sách được ban hành."],"e":"Đáp án đúng: Mục tiêu cuối cùng, chủ thể thực hiện, trách nhiệm, nguồn lực, thời hạn, sản phẩm.","t":""},{"s":"B","y":"NH","r":"NQ 29-NQ/TW","q":"Nguyên tắc phân cấp, phân quyền được Nghị quyết xác định như thế nào?","o":["Phân cấp, phân quyền phải bảo đảm rõ ràng, thực chất, gắn với trách nhiệm, nguồn lực, hậu kiểm và kiểm soát quyền lực.","Phân cấp càng nhiều càng tốt, không cần gắn với điều kiện nguồn lực và cơ chế kiểm soát.","Cấp dưới thực hiện nhiệm vụ nhưng phải xin ý kiến cấp trên trước khi quyết định mọi vấn đề đã được phân cấp."],"e":"Đáp án đúng: Phân cấp, phân quyền phải bảo đảm rõ ràng, thực chất, gắn với trách nhiệm, nguồn lực, hậu kiểm và kiểm soát quyền lực.","t":""},{"s":"B","y":"NH","r":"NQ 29-NQ/TW","q":"Nghị quyết yêu cầu kiểm soát quyền lực được giao bằng những phương thức nào?","o":["Bằng thể chế, quy chế, quy trình, dữ liệu, công khai, minh bạch và trách nhiệm giải trình; kiểm soát cả hành vi lạm quyền, vượt quyền và tình trạng né, không tránh thực hiện đầy đủ thẩm quyền, trách nhiệm.","Chủ yếu bằng kiểm tra định kỳ sau khi nhiệm vụ đã kết thúc, hạn chế kiểm tra trong quá trình thực hiện.","Tập trung kiểm soát cán bộ cấp dưới, không đặt ra yêu cầu kiểm soát đối với cơ quan tham mưu và người đứng đầu."],"e":"Đáp án đúng: Bằng thể chế, quy chế, quy trình, dữ liệu, công khai, minh bạch và trách nhiệm giải trình; kiểm soát cả hành vi lạm quyền, vượt quyền và tình trạng né, không tránh thực hiện đầy đủ thẩm quyền, trách nhiệm.","t":""},{"s":"B","y":"NH","r":"NQ 29-NQ/TW","q":"Nghị quyết xác định vai trò của trí tuệ nhân tạo, công nghệ mới trong lãnh đạo, chỉ đạo như thế nào?","o":["Hỗ trợ tham mưu, phân tích, dự báo, theo dõi tiến độ; không thay thế thẩm quyền, trách nhiệm quyết định của tổ chức, cá nhân.","Có thể thay thế quyết định chính trị khi hệ thống dữ liệu đã đầy đủ và được liên thông.","Chỉ sử dụng trong công tác thống kê, lưu trữ; không áp dụng cho kiểm tra, giám sát và cảnh báo sớm."],"e":"Đáp án đúng: Hỗ trợ tham mưu, phân tích, dự báo, theo dõi tiến độ; không thay thế thẩm quyền, trách nhiệm quyết định của tổ chức, cá nhân.","t":""},{"s":"C","y":"NH","r":"NQ 30-NQ/TW","q":"Theo Nghị quyết, việc đổi mới nội dung đánh giá cán bộ phải bảo đảm nguyên tắc nào?","o":["Bảo đảm toàn diện, thực chất về phẩm chất chính trị, tư tưởng, đạo đức, liêm chính, kỷ luật; năng lực thực tiễn, sản phẩm, kết quả, hiệu quả, mức độ cống hiến, uy tín trong tổ chức và trước Nhân dân.","Phẩm chất chính trị, tư tưởng, đạo đức, liêm chính, kỷ luật.","Năng lực thực tiễn, sản phẩm, kết quả, hiệu quả, mức độ cống hiến."],"e":"Đáp án đúng: Bảo đảm toàn diện, thực chất về phẩm chất chính trị, tư tưởng, đạo đức, liêm chính, kỷ luật; năng lực thực tiễn, sản phẩm, kết quả, hiệu quả, mức độ cống hiến, uy tín trong tổ chức và trước Nhân dân.","t":""},{"s":"C","y":"NH","r":"NQ 30-NQ/TW","q":"Hai cán bộ cùng nhóm chức danh, cùng được giao một loại nhiệm vụ, nhưng một người công tác ở địa bàn thuận lợi, nguồn lực dồi dào; một người ở địa bàn khó khăn, nguồn lực hạn chế. Theo Nghị quyết, phương thức đánh giá phải:","o":["Đặt kết quả trong tương quan với thẩm quyền, nguồn lực, điều kiện, hoàn cảnh và độ khó của nhiệm vụ.","Áp dụng thống nhất một bộ tiêu chí và một thang điểm chung để bảo đảm công bằng, khách quan.","Lấy mức độ hoàn thành chỉ tiêu đã đăng ký từ đầu năm làm căn cứ chủ yếu."],"e":"Đáp án đúng: Đặt kết quả trong tương quan với thẩm quyền, nguồn lực, điều kiện, hoàn cảnh và độ khó của nhiệm vụ.","t":""},{"s":"C","y":"NH","r":"NQ 30-NQ/TW","q":"Về hoàn thiện đồng bộ chức danh, nhiệm vụ, vị trí việc làm, Nghị quyết yêu cầu phải bảo đảm đồng thời hai mặt nào?","o":["Cơ cấu chức danh và tiêu chuẩn cán bộ. Không vì cơ cấu mà hạ thấp tiêu chuẩn; không đặt ra tiêu chuẩn hình thức làm thu hẹp nguồn cán bộ.","Không hạ thấp tiêu chuẩn về bằng cấp, đồng thời nâng cao tiêu chuẩn về kinh nghiệm thực tiễn.","Bảo đảm tiêu chuẩn chung của Đảng, đồng thời cho phép mỗi cấp ủy quy định thêm tiêu chuẩn riêng phù hợp đặc thù."],"e":"Đáp án đúng: Cơ cấu chức danh và tiêu chuẩn cán bộ. Không vì cơ cấu mà hạ thấp tiêu chuẩn; không đặt ra tiêu chuẩn hình thức làm thu hẹp nguồn cán bộ.","t":""},{"s":"C","y":"NH","r":"NQ 30-NQ/TW","q":"Nghị quyết xác định quan hệ giữa tiêu chuẩn chức danh với năng lực thực tiễn, kết quả thực hiện nhiệm vụ trong việc đánh giá mức độ phù hợp của cán bộ với vị trí như thế nào?","o":["Tiêu chuẩn là điều kiện cần; năng lực thực tiễn, kết quả thực hiện nhiệm vụ, khả năng đáp ứng yêu cầu vị trí là căn cứ quan trọng để đánh giá mức độ phù hợp.","Tiêu chuẩn chức danh và năng lực thực tiễn là hai căn cứ ngang nhau, bổ sung cho nhau.","Năng lực thực tiễn là điều kiện cần; tiêu chuẩn chức danh là căn cứ quyết định khi lựa chọn nhân sự."],"e":"Đáp án đúng: Tiêu chuẩn là điều kiện cần; năng lực thực tiễn, kết quả thực hiện nhiệm vụ, khả năng đáp ứng yêu cầu vị trí là căn cứ quan trọng để đánh giá mức độ phù hợp.","t":""},{"s":"C","y":"NH","r":"NQ 30-NQ/TW","q":"Nghị quyết xác định chỉ tiêu đến năm 2030, việc xây dựng đội ngũ cán bộ cần đạt là gì?","o":["Bảo đảm cơ cấu cán bộ hợp lý; tiếp tục nâng tỷ lệ cán bộ trẻ, cán bộ nữ, cán bộ là người dân tộc thiểu số, chuyên gia, nhà khoa học, nhân tài phù hợp với mô hình tổ chức chính quyền địa phương 2 cấp.","Tỷ lệ cán bộ hoàn thành xuất sắc nhiệm vụ và tỷ lệ cán bộ đạt chuẩn chức danh.","Mức độ hoàn thành các chỉ tiêu về cơ cấu cán bộ trẻ, cán bộ nữ, cán bộ là người dân tộc thiểu số."],"e":"Đáp án đúng: Bảo đảm cơ cấu cán bộ hợp lý; tiếp tục nâng tỷ lệ cán bộ trẻ, cán bộ nữ, cán bộ là người dân tộc thiểu số, chuyên gia, nhà khoa học, nhân tài phù hợp với mô hình tổ chức chính quyền địa phương 2 cấp.","t":""},{"s":"C","y":"NH","r":"NQ 30-NQ/TW","q":"Điểm mới của Nghị quyết về phương thức huy động, sử dụng nhân tài là gì?","o":["Xuất phát từ yêu cầu nhiệm vụ, những vấn đề lớn, khó, chiến lược của đất nước; gắn việc sử dụng người tài với nhiệm vụ xứng tầm, thẩm quyền, nguồn lực, sản phẩm và giá trị cống hiến.","Cho phép tuyển dụng không qua thi tuyển đối với người có học vị tiến sĩ và chuyên gia đầu ngành.","Mở rộng chỉ tiêu biên chế cho các lĩnh vực khoa học, công nghệ, đổi mới sáng tạo và chuyển đổi số."],"e":"Đáp án đúng: Xuất phát từ yêu cầu nhiệm vụ, những vấn đề lớn, khó, chiến lược của đất nước; gắn việc sử dụng người tài với nhiệm vụ xứng tầm, thẩm quyền, nguồn lực, sản phẩm và giá trị cống hiến.","t":""},{"s":"C","y":"NH","r":"NQ 30-NQ/TW","q":"Việc bố trí cán bộ phải bảo đảm yêu cầu gì?","o":["Bảo đảm cơ cấu hợp lý, năng lực và sở trường, đúng người, đúng việc.","Căn cứ yêu cầu thực tế để xác định.","Thực hiện theo quy trình và báo cáo cấp có thẩm quyền."],"e":"Đáp án đúng: Bảo đảm cơ cấu hợp lý, năng lực và sở trường, đúng người, đúng việc.","t":""},{"s":"C","y":"NH","r":"NQ 30-NQ/TW","q":"Nghị quyết yêu cầu phân định rõ hai loại chính sách nào đối với cán bộ?","o":["Chính sách đãi ngộ theo kết quả, cống hiến với chính sách hỗ trợ do điều kiện công tác khó khăn, nguy hiểm, rủi ro.","Chính sách tiền lương theo ngạch, bậc với chính sách tiền thưởng theo kết quả công việc.","Chính sách đối với cán bộ lãnh đạo, quản lý với chính sách đối với chuyên gia, cán bộ chuyên môn sâu."],"e":"Đáp án đúng: Chính sách đãi ngộ theo kết quả, cống hiến với chính sách hỗ trợ do điều kiện công tác khó khăn, nguy hiểm, rủi ro.","t":""},{"s":"C","y":"NH","r":"NQ 30-NQ/TW","q":"Theo Nghị quyết, thước đo chất lượng tham mưu của cơ quan làm công tác tổ chức, cán bộ là gì?","o":["Chất lượng đội ngũ và chất lượng quyết định cán bộ.","Số lượng và tiến độ các đề án, văn bản được tham mưu ban hành đúng hạn.","Mức độ chặt chẽ, chính xác của hồ sơ và quy trình nhân sự do cơ quan thẩm định."],"e":"Đáp án đúng: Chất lượng đội ngũ và chất lượng quyết định cán bộ.","t":""},{"s":"C","y":"NH","r":"NQ 30-NQ/TW","q":"Sau khi đã phân cấp, phân quyền trong công tác cán bộ, trách nhiệm của cấp trên được Nghị quyết xác định là gì?","o":["Không làm thay việc đã phân cấp; tập trung kiểm tra, giám sát, hậu kiểm và cảnh báo rủi ro.","Thẩm định lại hồ sơ nhân sự trước khi cấp dưới ban hành quyết định.","Cho ý kiến bằng văn bản đối với những trường hợp nhân sự quan trọng thuộc thẩm quyền cấp dưới."],"e":"Đáp án đúng: Không làm thay việc đã phân cấp; tập trung kiểm tra, giám sát, hậu kiểm và cảnh báo rủi ro.","t":""},{"s":"C","y":"NH","r":"NQ 30-NQ/TW","q":"Đột phá về tạo nguồn của Nghị quyết chuyển công tác quy hoạch cán bộ theo hướng nào?","o":["Từ quy hoạch khép kín theo chức danh sang chủ động chuẩn bị đội ngũ cho các nhiệm vụ và năng lực chiến lược của tương lai.","Từ quy hoạch theo nhiệm kỳ sang quy hoạch dài hạn 10 năm cho từng chức danh lãnh đạo, quản lý.","Từ quy hoạch do tập thể cấp ủy quyết định sang quy hoạch do người đứng đầu giới thiệu và chịu trách nhiệm."],"e":"Đáp án đúng: Từ quy hoạch khép kín theo chức danh sang chủ động chuẩn bị đội ngũ cho các nhiệm vụ và năng lực chiến lược của tương lai.","t":""},{"s":"C","y":"NH","r":"NQ 30-NQ/TW","q":"Chỉ tiêu đến năm 2030 về nguồn kế cận đối với vị trí lãnh đạo, quản lý cấp chiến lược và người đứng đầu các cấp là gì?","o":["100% vị trí có nguồn kế cận được chuẩn bị nhiều lớp, có ít nhất 2 phương án gắn với kế hoạch phát hiện, đào tạo, bồi dưỡng, rèn luyện, thử thách và kiểm chứng qua thực tiễn.","100% vị trí có nguồn quy hoạch với hệ số từ 1,5 đến 2 lần số lượng cấp ủy viên đương nhiệm.","Ít nhất 80% vị trí có nguồn kế cận tại chỗ, 20% còn lại chuẩn bị nguồn từ nơi khác điều động đến."],"e":"Đáp án đúng: 100% vị trí có nguồn kế cận được chuẩn bị nhiều lớp, có ít nhất 2 phương án gắn với kế hoạch phát hiện, đào tạo, bồi dưỡng, rèn luyện, thử thách và kiểm chứng qua thực tiễn.","t":""},{"s":"D","y":"NH","r":"QĐ 224-QĐ/TW","q":"Nhận định nào dưới đây phản ánh đúng phạm vi điều chỉnh của Quy định số 224-QĐ/TW về đảng viên tham gia hoạt động đầu tư kinh doanh?","o":["Quy định về chủ trương, nguyên tắc, giới hạn, quyền, trách nhiệm và kiểm soát xung đột lợi ích đối với đảng viên tham gia hoạt động đầu tư kinh doanh.","Chỉ quy định quyền sở hữu tài sản của đảng viên ngoài khu vực công.","Chỉ quy định thủ tục kê khai và xin chấp thuận trước khi đảng viên đầu tư kinh doanh."],"e":"Đáp án đúng: Quy định về chủ trương, nguyên tắc, giới hạn, quyền, trách nhiệm và kiểm soát xung đột lợi ích đối với đảng viên tham gia hoạt động đầu tư kinh doanh.","t":""},{"s":"D","y":"NH","r":"QĐ 224-QĐ/TW","q":"Quy định số 224-QĐ/TW điều chỉnh việc tham gia hoạt động đầu tư kinh doanh đối với nhóm đảng viên nào?","o":["Đảng viên trong và ngoài khu vực công, với quyền và giới hạn tương ứng theo chức danh, vị trí, nhiệm vụ.","Chỉ đảng viên là viên chức.","Chỉ đảng viên ngoài khu vực công."],"e":"Đáp án đúng: Đảng viên trong và ngoài khu vực công, với quyền và giới hạn tương ứng theo chức danh, vị trí, nhiệm vụ.","t":""},{"s":"D","y":"NH","r":"QĐ 224-QĐ/TW","q":"Theo Quy định số 224-QĐ/TW, hoạt động đầu tư kinh doanh của đảng viên được phân thành những nhóm nào?","o":["Cả A và B.","Hoạt động chuyên môn và khai thác tài sản tạo thu nhập; đầu tư kinh doanh nhưng không đầu tư thành lập tổ chức kinh tế và không chi phối, quản lý, điều hành.","Đầu tư kinh doanh có đầu tư thành lập tổ chức kinh tế hoặc có chi phối nhưng không quản lý, điều hành; đầu tư kinh doanh có tham gia quản lý, điều hành, kể cả trường hợp có đầu tư thành lập tổ chức kinh tế hoặc có chi phối."],"e":"Đáp án đúng: Cả A và B.","t":""},{"s":"D","y":"NH","r":"QĐ 224-QĐ/TW","q":"Theo Quy định số 224-QĐ/TW, nhận định nào phản ánh đầy đủ nguyên tắc áp dụng quyền, giới hạn và kiểm soát xung đột lợi ích?","o":["Áp dụng theo chức danh, vị trí công tác, chức trách, nhiệm vụ được giao; đảng viên giữ nhiều chức danh, thực hiện nhiều nhiệm vụ hoặc thuộc nhiều nhóm đối tượng phải tuân thủ giới hạn tương ứng với từng chức danh, nhiệm vụ, nhóm đối tượng.","Chỉ áp dụng theo chức danh cao nhất mà đảng viên đang giữ.","Chỉ áp dụng theo nơi đảng viên sinh hoạt đảng, không xét nhiệm vụ thực tế."],"e":"Đáp án đúng: Áp dụng theo chức danh, vị trí công tác, chức trách, nhiệm vụ được giao; đảng viên giữ nhiều chức danh, thực hiện nhiều nhiệm vụ hoặc thuộc nhiều nhóm đối tượng phải tuân thủ giới hạn tương ứng với từng chức danh, nhiệm vụ, nhóm đối tượng.","t":""},{"s":"D","y":"NH","r":"QĐ 224-QĐ/TW","q":"Theo Quy định số 224-QĐ/TW, nhận định nào đúng đối với đảng viên ngoài khu vực công khi được giao thực hiện nhiệm vụ công?","o":["Không được lợi dụng tư cách đảng viên, chức vụ trong Đảng hoặc quan hệ với người có thẩm quyền để tạo lợi thế bất bình đẳng, tác động trái quy định, phục vụ lợi ích riêng, lợi ích nhóm; không được xử lý công việc, nhiệm vụ có xung đột lợi ích chưa được kiểm soát hoặc làm ảnh hưởng tiêu cực đến việc thực hiện nhiệm vụ công được giao.","Phải xin chấp thuận của tổ chức đảng trước mọi khoản đầu tư kinh doanh hợp pháp.","Được tự mình tiếp tục xử lý công việc có xung đột lợi ích chưa được kiểm soát."],"e":"Đáp án đúng: Không được lợi dụng tư cách đảng viên, chức vụ trong Đảng hoặc quan hệ với người có thẩm quyền để tạo lợi thế bất bình đẳng, tác động trái quy định, phục vụ lợi ích riêng, lợi ích nhóm; không được xử lý công việc, nhiệm vụ có xung đột lợi ích chưa được kiểm soát hoặc làm ảnh hưởng tiêu cực đến việc thực hiện nhiệm vụ công được giao.","t":""},{"s":"D","y":"NH","r":"QĐ 224-QĐ/TW","q":"Theo Quy định số 224-QĐ/TW, đảng viên là cán bộ thuộc diện Bộ Chính trị, Ban Bí thư quản lý được thực hiện những hoạt động nào mà không phải xin chấp thuận?","o":["Hoạt động chuyên môn và khai thác tài sản tạo thu nhập; đầu tư kinh doanh nhưng không đầu tư thành lập tổ chức kinh tế và không chi phố kinh doanh nhưng không thành lập tổ chức kinh tế và không chi phối, quản lý, điều hành."],"e":"Đáp án đúng: Đồng thời quản lý, điều hành tổ chức kinh tế, trừ trường hợp được cử tham gia quản lý hoặc làm đại diện phần vốn, tài sản của đơn vị tại tổ chức kinh tế theo quy định của pháp luật.","t":""},{"s":"D","y":"NH","r":"QĐ 224-QĐ/TW","q":"Theo Quy định số 224-QĐ/TW, đảng viên đang công tác, phục vụ trong Quân đội Nhân dân, Công an Nhân dân tham gia đầu tư kinh doanh như thế nào?","o":["Được thực hiện hoạt động chuyên môn và khai thác tài sản tạo thu nhập; đầu tư kinh doanh nhưng không thành lập tổ chức kinh tế và không chi phối, quản lý, điều hành; sau khi được chấp thuận nếu không ở vị trí, lĩnh vực có nguy cơ cao phát sinh xung đột lợi ích thì được thực hiện hoạt động đầu tư kinh doanh có đầu tư thành lập tổ chức kinh tế hoặc có chi phối nhưng không quản lý, điều hành; tham gia quản lý, điều hành, kể cả trường hợp có đầu tư thành lập tổ chức kinh tế hoặc có chi phối; phải bảo đảm bí mật nhà nước, bí mật công tác và yêu cầu quốc phòng, an ninh.","Mọi đảng viên đều được trực tiếp quản lý, điều hành tổ chức kinh tế sau khi kê khai.","Mọi hình thức đầu tư kinh doanh và hoạt động chuyên môn tạo thu nhập đều bị cấm."],"e":"Đáp án đúng: Được thực hiện hoạt động chuyên môn và khai thác tài sản tạo thu nhập; đầu tư kinh doanh nhưng không thành lập tổ chức kinh tế và không chi phối, quản lý, điều hành; sau khi được chấp thuận nếu không ở vị trí, lĩnh vực có nguy cơ cao phát sinh xung đột lợi ích thì được thực hiện hoạt động đầu tư kinh doanh có đầu tư thành lập tổ chức kinh tế hoặc có chi phối nhưng không quản lý, điều hành; tham gia quản lý, điều hành, kể cả trường hợp có đầu tư thành lập tổ chức kinh tế hoặc có chi phối; phải bảo đảm bí mật nhà nước, bí mật công tác và yêu cầu quốc phòng, an ninh.","t":""},{"s":"D","y":"NH","r":"QĐ 224-QĐ/TW","q":"Theo Quy định số 224-QĐ/TW, đảng viên là người quản lý doanh nghiệp nhà nước, người đại diện phần vốn nhà nước được làm gì mà không phải xin chấp thuận?","o":["Được thực hiện hoạt động chuyên môn và khai thác tài sản tạo thu nhập; đầu tư kinh doanh nhưng không đầu tư thành lập tổ chức kinh tế và không chi phối, quản lý, điều hành; mua, nhận, nắm giữ cổ phần, phần vốn góp và thực hiện quyền cổ đông, thành viên tại doanh nghiệp do mình quản lý hoặc đại diện phần vốn nhà nước theo quy định của pháp luật; việc thực hiện quyền đối với phần vốn cá nhân phải tách bạch với chức trách quản lý, đại diện phần vốn nhà nước và bảo đảm kiểm soát xung đột lợi ích.","Được tự mình thành lập và trực tiếp điều hành tổ chức kinh tế ngoài khu vực công trong mọi lĩnh vực.","Được đầu tư kinh doanh trong ngành, lĩnh vực có lợi ích liên quan trực tiếp đến doanh nghiệp nhà nước do mình quản lý, không cần điều kiện nào."],"e":"Đáp án đúng: Được thực hiện hoạt động chuyên môn và khai thác tài sản tạo thu nhập; đầu tư kinh doanh nhưng không đầu tư thành lập tổ chức kinh tế và không chi phối, quản lý, điều hành; mua, nhận, nắm giữ cổ phần, phần vốn góp và thực hiện quyền cổ đông, thành viên tại doanh nghiệp do mình quản lý hoặc đại diện phần vốn nhà nước theo quy định của pháp luật; việc thực hiện quyền đối với phần vốn cá nhân phải tách bạch với chức trách quản lý, đại diện phần vốn nhà nước và bảo đảm kiểm soát xung đột lợi ích.","t":""},{"s":"D","y":"NH","r":"QĐ 224-QĐ/TW","q":"Theo Quy định số 224-QĐ/TW, đảng viên không còn công tác trong khu vực công sau khi thôi công tác, nghỉ hưu không được thực hiện hoạt động nào?","o":["Các hoạt động bị hạn chế có liên quan đến lĩnh vực, công việc đã phụ trách trong phạm vi và thời hạn theo quy định của pháp luật.","Hoạt động chuyên môn và khai thác tài sản tạo thu nhập hợp pháp.","Đầu tư thành lập tổ chức kinh tế trong lĩnh vực không bị hạn chế theo pháp luật."],"e":"Đáp án đúng: Các hoạt động bị hạn chế có liên quan đến lĩnh vực, công việc đã phụ trách trong phạm vi và thời hạn theo quy định của pháp luật.","t":""},{"s":"D","y":"NH","r":"QĐ 224-QĐ/TW","q":"Theo Quy định số 224-QĐ/TW, đảng viên phải báo cáo về xung đột lợi ích khi nào?","o":["Khi phát sinh xung đột lợi ích hoặc khi cấp có thẩm quyền phát hiện và yêu cầu thì phải kịp thời báo cáo cấp có thẩm quyền.","Mỗi khi phát sinh bất kỳ khoản đầu tư hợp pháp nào, dù không có xung đột lợi ích.","Chỉ khi đã có kết luận về hành vi vi phạm."],"e":"Đáp án đúng: Khi phát sinh xung đột lợi ích hoặc khi cấp có thẩm quyền phát hiện và yêu cầu thì phải kịp thời báo cáo cấp có thẩm quyền.","t":""},{"s":"E","y":"NH","r":"KL 105-KL/TW","q":"Theo Kết luận, nhân tài được nhận thức như thế nào?","o":["Là người có phẩm chất, tố chất, năng lực nổi trội và tư duy sáng tạo; có sản phẩm, thành tích hoặc đóng góp đặc biệt, có tính đột phá, tạo ra giá trị và tác động tích cực; có khả năng đảm niệm, giải quyết hiệu quả nhiệm vụ quan trọng, mới, khó, phức tạp.","Là người có bằng cấp cao, học hàm, học vị và nhiều năm giữ chức vụ lãnh đạo, quản lý trong cơ quan nhà nước.","Là người được cơ quan có thẩm quyền tuyển dụng vào biên chế và xếp ở ngạch chuyên môn cao nhất."],"e":"Đáp án đúng: Là người có phẩm chất, tố chất, năng lực nổi trội và tư duy sáng tạo; có sản phẩm, thành tích hoặc đóng góp đặc biệt, có tính đột phá, tạo ra giá trị và tác động tích cực; có khả năng đảm niệm, giải quyết hiệu quả nhiệm vụ quan trọng, mới, khó, phức tạp.","t":""},{"s":"E","y":"NH","r":"KL 105-KL/TW","q":"Việc thu hút và trọng dụng nhân tài phải đặt trong tổng thể nào và lấy nội dung nào làm định hướng cao nhất?","o":["Đặt trong tổng thể chiến lược phát triển đất nước, lấy lợi ích quốc gia, dân tộc làm định hướng cao nhất.","Đặt trong tổng thể phát triển đất nước và nhu cầu tăng số lượng người có học hàm, học vị trong khu vực công.","Đặt trong tổng thể phát triển đất nước và mở rộng đồng đều chính sách nhân tài cho tất cả ngành, lĩnh vực và địa phương."],"e":"Đáp án đúng: Đặt trong tổng thể chiến lược phát triển đất nước, lấy lợi ích quốc gia, dân tộc làm định hướng cao nhất.","t":""},{"s":"E","y":"NH","r":"KL 105-KL/TW","q":"Theo quan điểm của Kết luận, đâu là khâu then chốt và đâu là nhiệm vụ căn bản, lâu dài trong công tác nhân tài?","o":["Trọng dụng là khâu then chốt; tạo nguồn nhân tài là nhiệm vụ căn bản, lâu dài.","Đãi ngộ là khâu then chốt; thu hút từ nước ngoài là nhiệm vụ căn bản, lâu dài.","Tuyển dụng là khâu then chốt; đánh giá hằng năm là nhiệm vụ căn bản, lâu dài."],"e":"Đáp án đúng: Trọng dụng là khâu then chốt; tạo nguồn nhân tài là nhiệm vụ căn bản, lâu dài.","t":""},{"s":"E","y":"NH","r":"KL 105-KL/TW","q":"Đến năm 2030, Kết luận đặt mục tiêu phấn đấu thu hút, trọng dụng khoảng bao nhiêu nhân tài quốc gia gắn với từng nhiệm vụ, chương trình, dự án cụ thể?","o":["Khoảng 1.000 nhân tài quốc gia.","Khoảng 2.000 nhân tài quốc gia.","Khoảng 5.000 nhân tài quốc gia."],"e":"Đáp án đúng: Khoảng 1.000 nhân tài quốc gia.","t":""},{"s":"E","y":"NH","r":"KL 105-KL/TW","q":"Mục tiêu đến năm 2030 về Chỉ số năng lực cạnh tranh nhân tài toàn cầu của Việt Nam là gì?","o":["Thuộc nhóm 03 nước đứng đầu Đông Nam Á.","Thuộc nhóm 20 quốc gia dẫn đầu thế giới.","Đứng đầu châu Á về Chỉ số năng lực cạnh tranh nhân tài toàn cầu."],"e":"Đáp án đúng: Thuộc nhóm 03 nước đứng đầu Đông Nam Á.","t":""},{"s":"E","y":"NH","r":"KL 105-KL/TW","q":"Đến năm 2045, Việt Nam phấn đấu đạt vị trí nào về Chỉ số năng lực cạnh tranh nhân tài toàn cầu?","o":["Thuộc nhóm 20 quốc gia dẫn đầu thế giới.","Thuộc nhóm 03 nước đứng đầu Đông Nam Á.","Thuộc nhóm 10 quốc gia đứng đầu châu Á."],"e":"Đáp án đúng: Thuộc nhóm 20 quốc gia dẫn đầu thế giới.","t":""},{"s":"E","y":"NH","r":"KL 105-KL/TW","q":"Nhóm hạ tầng và công cụ số quốc gia về nhân tài được Kết luận xác định gồm những thành phần chủ yếu nào?","o":["Cơ sở dữ liệu quốc gia về nhân tài, hệ thống chỉ số quốc gia về nhân tài, Cổng thông tin quốc gia về nhân tài và các nền tảng số phục vụ quản trị, đánh giá.","Chỉ gồm Cơ sở dữ liệu quốc gia về nhân tài do Trung ương quản lý.","Các cơ sở dữ liệu riêng biệt của từng địa phương, không kết nối và không dùng chung chỉ số đánh giá."],"e":"Đáp án đúng: Cơ sở dữ liệu quốc gia về nhân tài, hệ thống chỉ số quốc gia về nhân tài, Cổng thông tin quốc gia về nhân tài và các nền tảng số phục vụ quản trị, đánh giá.","t":""},{"s":"E","y":"NH","r":"KL 105-KL/TW","q":"Mức ngân sách nhà nước dành cho công tác nhân tài được Kết luận định hướng như thế nào?","o":["Khoảng 0,1% GDP hằng năm trong tổng nguồn lực dành cho khoa học, công nghệ, đổi mới sáng tạo và chuyển đổi số.","Khoảng 0,05% GDP hằng năm, bố trí ngoài nguồn lực dành cho khoa học, công nghệ.","Khoảng 1% GDP hằng năm, phân bổ bình quân cho các bộ, ngành, địa phương."],"e":"Đáp án đúng: Khoảng 0,1% GDP hằng năm trong tổng nguồn lực dành cho khoa học, công nghệ, đổi mới sáng tạo và chuyển đổi số.","t":""},{"s":"E","y":"NH","r":"KL 105-KL/TW","q":"Nhân tài phải được đánh giá chủ yếu dựa trên căn cứ nào?","o":["Kết quả thực hiện nhiệm vụ, chất lượng sản phẩm và giá trị tạo ra.","Bằng cấp, học hàm, học vị, chức vụ quản lý và thâm niên công tác.","Vị trí công tác, độ tuổi, cơ quan công tác và số năm giữ chức vụ."],"e":"Đáp án đúng: Kết quả thực hiện nhiệm vụ, chất lượng sản phẩm và giá trị tạo ra.","t":""},{"s":"E","y":"NH","r":"KL 105-KL/TW","q":"Nguyên tắc nào phải được thực hiện nhất quán khi giao nhiệm vụ chiến lược cho nhân tài?","o":["Nhiệm vụ đi liền với người thực hiện, thẩm quyền và nguồn lực.","Giao nhiệm vụ trước, xác định thẩm quyền và nguồn lực sau khi có kết quả bước đầu.","Ưu tiên giao nhiệm vụ theo chức vụ, thâm niên và thứ bậc hành chính."],"e":"Đáp án đúng: Nhiệm vụ đi liền với người thực hiện, thẩm quyền và nguồn lực.","t":""},{"s":"E","y":"NH","r":"KL 105-KL/TW","q":"Kết luận xác định việc phát hiện, giới thiệu, tiến cử nhân tài và sử dụng nhân tài trong khu vực công như thế nào?","o":["Thực hiện từ nhiều nguồn trong và ngoài nước, không phân biệt khu vực công và khu vực tư, không tính vào chỉ tiêu biên chế đối với khu vực công.","Chỉ phát hiện trong khu vực công và phải tính đủ vào chỉ tiêu biên chế.","Chỉ tiếp nhận nhân tài là người Việt Nam ở nước ngoài theo chế độ tuyển dụng đặc biệt."],"e":"Đáp án đúng: Thực hiện từ nhiều nguồn trong và ngoài nước, không phân biệt khu vực công và khu vực tư, không tính vào chỉ tiêu biên chế đối với khu vực công.","t":""},{"s":"E","y":"NH","r":"KL 105-KL/TW","q":"Phương thức nào được Kết luận chỉ rõ trong lựa chọn, sử dụng, trọng dụng nhân tài?","o":["Đặt hàng các nhiệm vụ chiến lược, bài toán lớn, chương trình, dự án trọng điểm.","Thông qua tuyển dụng chính thức vào cơ quan nhà nước.","Thông qua hợp đồng lao động không xác định thời hạn và bổ nhiệm chức vụ."],"e":"Đáp án đúng: Đặt hàng các nhiệm vụ chiến lược, bài toán lớn, chương trình, dự án trọng điểm.","t":""},{"s":"E","y":"NH","r":"KL 105-KL/TW","q":"Trong đánh giá kết quả thực hiện nhiệm vụ của nhân tài, Kết luận yêu cầu phân định rõ nội dung nào?","o":["Rủi ro, thất bại khách quan trong nghiên cứu, đổi mới sáng tạo với hành vi thiếu trách nhiệm, gian lận hoặc vụ lợi.","Kết quả của cá nhân với kết quả của tập thể để chỉ xem xét trách nhiệm của người đứng đầu.","Nhiệm vụ có nguồn ngân sách nhà nước với nhiệm vụ do doanh nghiệp tài trợ để áp dụng hai tiêu chuẩn đánh giá khác nhau."],"e":"Đáp án đúng: Rủi ro, thất bại khách quan trong nghiên cứu, đổi mới sáng tạo với hành vi thiếu trách nhiệm, gian lận hoặc vụ lợi.","t":""},{"s":"E","y":"NH","r":"KL 105-KL/TW","q":"Cơ chế “Nhân tài dẫn dắt nhân tài” được hiểu đúng là gì?","o":["Thực hiện cố vấn, hướng dẫn, truyền nghề giữa chuyên gia đầu ngành với nhân tài trẻ; xây dựng nhóm chuyên môn, tuyển chọn cộng sự và phát triển đội ngũ kế cận.","Giao toàn bộ việc tuyển chọn nhân tài cho các chuyên gia quốc tế.","Chỉ tổ chức các cuộc thi định kỳ để xếp hạng nhân tài theo từng ngành, lĩnh vực."],"e":"Đáp án đúng: Thực hiện cố vấn, hướng dẫn, truyền nghề giữa chuyên gia đầu ngành với nhân tài trẻ; xây dựng nhóm chuyên môn, tuyển chọn cộng sự và phát triển đội ngũ kế cận.","t":""},{"s":"E","y":"NH","r":"KL 105-KL/TW","q":"Cơ quan nào được giao chủ trì điều phố function compute(){
 var n=S.qs.length,c=0,bl=0,th={},ty={};
 S.qs.forEach(function(q,k){var a=S.ans[k],ok=a!==undefined&&q.opts[a].ok;if(a===undefined)bl++;if(ok)c++;
  [[th,q.b.s],[ty,q.b.y]].forEach(function(p){var m=p[0],key=p[1];m[key]=m[key]||{n:0,c:0};m[key].n++;if(ok)m[key].c++})});
 return {n:n,c:c,bl:bl,wr:n-c-bl,score:Math.round(c*100/n)/10,th:th,ty:ty};
}
function commentary(r){
 var out=[],weak=[],bestK=null,bp=-1;
 Object.keys(r.th).forEach(function(k){var p=pct(r.th[k].c,r.th[k].n);if(p<70)weak.push(THEMES[k].t+' ('+THEMES[k].d+')');if(p>bp){bp=p;bestK=k}});
 if(r.c===r.n)out.push('Bạn trả lời đúng toàn bộ các tình huống.');
 if(bestK&&bp>=70)out.push('Nhóm làm tốt nhất: '+THEMES[bestK].t+' ('+bp+'%).');
 if(weak.length)out.push('Nên ôn lại: '+weak.join('; ')+'.');
 if(r.ty.RG&&pct(r.ty.RG.c,r.ty.RG.n)<60)out.push('Bạn còn nhầm ở các câu phân biệt ranh giới giữa việc được làm và không được làm: hãy đọc kỹ từng lựa chọn và dòng “Cần nhớ”.');
 if(r.bl)out.push('Còn '+r.bl+' câu chưa trả lời.');
 return out;
}

function viewStart(){
 var h='<div class="banner hb"><div class="hbi"><small>HỘI NGHỊ LẦN THỨ TƯ · BAN CHẤP HÀNH TRUNG ƯƠNG ĐẢNG KHÓA XIV</small><strong>KIỂM TRA NHẬN THỨC</strong><em>Nghị quyết 29, 30, 31-NQ/TW · Quy định 224-QĐ/TW · Kết luận 105, 106-KL/TW</em></div>'+tbtn()+'</div>';
 h+='<div class="credit"><span><b>Người số hoá từ bộ câu hỏi gốc: PHẠM QUANG CHINH</b></span><span>TÀI LIỆU HỌC TẬP CỦA CHI BỘ THÔN 8, ĐẠ HUOAI, LÂM ĐỒNG</span></div>';
 h+='<div class="wrap"><div class="hero"><h1>Kiểm tra nhận thức Hội nghị Trung ương 4 khóa XIV</h1><p class="sub">Bộ 77 câu trắc nghiệm về 6 văn kiện của Hội nghị; mỗi câu có 3 phương án, chọn một đáp án đúng.</p>';
 h+='<div class="stats"><div class="stat"><b>77</b><small>câu hỏi</small></div><div class="stat"><b>6</b><small>văn kiện</small></div><div class="stat"><b>3</b><small>phương án mỗi câu</small></div><div class="stat"><b>100</b><small>điểm tối đa</small></div></div>';
 h+='<div class="modes"><button class="mode'+(mode==='learn'?' on':'')+'" data-act="mode" data-m="learn"><h3>📘 Chế độ học</h3><p>Chọn xong thấy ngay đáp án đúng. Nên bắt đầu từ đây.</p></button>';
 h+='<button class="mode'+(mode==='exam'?' on':'')+'" data-act="mode" data-m="exam"><h3>📝 Thi thử</h3><p>Được đổi đáp án, đánh dấu câu cần xem lại; đáp án hiện sau khi nộp bài.</p></button></div>';
 h+='<button class="go" data-act="start">Bắt đầu làm bài →</button>';
 if(ENDPOINT)h+='<div style="margin-top:12px"><button class="btn" data-act="stats" style="width:100%">📊 Thống kê chung của chi bộ</button></div><p class="privacy">Kết quả khi làm đủ 77 câu được gửi ẩn danh (không ghi tên) để chi bộ tổng hợp, đánh giá chung.</p>';
 if(best)h+='<p class="best">Điểm cao nhất của bạn: <b>'+Math.round(best.s*10)+'/100</b> ('+esc(best.g)+')</p>';
 h+='<div class="ladder"><h2>Thang điểm</h2><div class="lad">'+GRADES.map(function(g,i){var rng=i===0?'từ '+g.min*10+' điểm':(i===GRADES.length-1?'dưới '+GRADES[i-1].min*10+' điểm':'từ '+g.min*10+' điểm');if(i===GRADES.length-1)rng='dưới 50 điểm';return '<div><b>'+esc(g.name)+'</b><span>'+rng+' · <em>'+esc(g.note)+'</em></span></div>'}).join('')+'</div><p class="best" style="text-align:left">Mỗi câu đúng khoảng '+fmt(100/BANK.length)+' điểm (tổng 100 điểm); điểm làm tròn đến số nguyên; câu sai hoặc bỏ trống không bị trừ.</p></div>';
 h+='</div></div>';
 return h;
}
function viewQuiz(){
 var q=S.qs[S.cur],k=S.cur,n=S.qs.length,a=S.ans[k];
 var answered=Object.keys(S.ans).length;
 var h='<div class="bar"><div class="wrap"><button class="tbtn" data-act="home" aria-label="Về trang đầu">⌂</button><div class="mid"><div class="t1"><span>Câu '+(k+1)+'/'+n+' · đã làm '+answered+'</span><span>⏱ <span id="tm">'+mmss(S.el)+'</span></span></div><div class="prog"><i style="width:'+pct(answered,n)+'%"></i></div></div>'+tbtn()+'<button class="btn pri" data-act="submit" style="padding:8px 14px">Nộp bài</button></div></div>';
 h+='<div class="wrap"><div class="qlay"><div class="card main"><div class="qtags"><a class="tag red lnk" href="'+esc(THEMES[q.b.s].u)+'" target="_blank" rel="noopener" title="Mở văn bản gốc để đối chiếu">'+esc(q.b.r)+' ↗</a><a class="tag lnk" href="'+esc(THEMES[q.b.s].u)+'" target="_blank" rel="noopener" title="Mở văn bản gốc để đối chiếu">'+esc(THEMES[q.b.s].t)+' ↗</a></div>';
 h+='<p class="qtext">'+esc(q.b.q)+'</p><div class="opts">'+optHtml(q,k,'live')+'</div>';
 if(S.mode==='learn'&&a!==undefined)h+=expHtml(q,k);
 if(S.mode==='exam')h+='<div style="margin-top:12px"><button class="btn flagb'+(S.flag[k]?' on':'')+'" data-act="flag">⚑ '+(S.flag[k]?'Đã đánh dấu xem lại':'Đánh dấu xem lại')+'</button></div>';
 h+='</div><div class="card side"><div class="sec-t">Danh sách câu</div><div class="grid">';
 S.qs.forEach(function(qq,j){var aa=S.ans[j],c='gn';if(j===S.cur)c+=' cur';if(aa!==undefined){if(S.mode==='learn')c+=qq.opts[aa].ok?' ok':' bad';else c+=' done'}if(S.flag[j])c+=' fl';h+='<button class="'+c+'" data-act="go" data-i="'+j+'">'+(j+1)+'</button>'});
 h+='</div><div class="legend">'+(S.mode==='learn'?'Xanh: đúng · Đỏ: sai':'Đỏ: đã chọn · ⚑ đánh dấu')+' · Phím tắt: A–D chọn, ← → chuyển câu</div></div></div></div>';
 h+='<div class="nav"><div class="wrap"><button class="btn" data-act="prev"'+(k===0?' disabled':'')+'>← Câu trước</button><button class="btn pri" data-act="next">'+(k===n-1?'Nộp bài':'Câu sau →')+'</button></div></div>';
 if(S.confirm){var un=n-answered;h+='<div class="ov"><div class="card"><h3>Nộp bài?</h3><p>'+(un?'Bạn còn <b>'+un+'</b> câu chưa trả lời. Câu bỏ trống không được điểm.':'Bạn đã trả lời tất cả '+n+' câu.')+'</p><div class="row"><button class="btn" data-act="cancel">Làm tiếp</button><button class="btn pri" data-act="confirm">Nộp bài</button></div></div></div>'}
 return h;
}
function viewResult(){
 var r=S.res,g=gradeOf(r.score);
 var h='<div class="bar"><div class="wrap"><button class="tbtn" data-act="home" aria-label="Về trang đầu">⌂</button><div class="mid"><b>Kết quả</b></div>'+tbtn()+'</div></div><div class="wrap" style="padding-top:18px">';
 h+='<div class="card rtop"><div class="ring"><svg viewBox="0 0 120 120"><circle class="tr" cx="60" cy="60" r="52"/><circle class="fg" id="rfg" cx="60" cy="60" r="52"/></svg><div class="num"><b id="rn">0</b><small>/ 100 điểm</small></div></div><div><span class="gb">'+esc(g.name)+'</span><p style="margin:6px 0 0">'+esc(g.note)+'</p><p class="best" style="text-align:inherit">Thời gian: '+mmss(S.el)+' · '+(S.mode==='learn'?'Chế độ học':'Thi thử')+'</p></div></div>';
 if(S.sent)h+='<p class="best" style="margin:10px 0 0">✔ Kết quả đã được gửi ẩn danh vào thống kê chung.</p>';
 h+='<div class="rstats"><div class="rs"><b>'+r.n+'</b><small>tổng số câu</small></div><div class="rs ok"><b>'+r.c+'</b><small>đúng</small></div><div class="rs bad"><b>'+r.wr+'</b><small>sai</small></div><div class="rs"><b>'+r.bl+'</b><small>bỏ trống</small></div></div>';
 var cm=commentary(r);if(cm.length)h+='<div class="comments">'+cm.map(function(c){return '<p>'+esc(c)+'</p>'}).join('')+'</div>';
 h+='<div class="card"><div class="sec-t">Kết quả theo nhóm nội dung</div><div class="meters">';
 Object.keys(THEMES).forEach(function(k){var m=r.th[k];if(!m)return;var p=pct(m.c,m.n),l=lvl(p);h+='<div class="'+l[0]+'"><div class="meter-top"><b>'+esc(THEMES[k].t)+'</b><span>'+m.c+'/'+m.n+' · '+l[1]+'</span></div><div class="mbar"><i data-w="'+p+'"></i></div></div>'});
 h+='</div><div class="meters">';
 Object.keys(TYPES).forEach(function(k){var m=r.ty[k];if(!m)return;var p=pct(m.c,m.n),l=lvl(p);h+='<div class="'+l[0]+'"><div class="meter-top"><b>'+esc(TYPES[k])+'</b><span>'+m.c+'/'+m.n+' · '+l[1]+'</span></div><div class="mbar"><i data-w="'+p+'"></i></div></div>'});
 h+='</div></div>';
 var wrongIdx=[];S.qs.forEach(function(q,k){var a=S.ans[k];if(!(a!==undefined&&q.opts[a].ok))wrongIdx.push(k)});
 if(wrongIdx.length){h+='<div class="sec"><div class="sec-t">Các câu cần xem lại</div><ul class="recall">';wrongIdx.forEach(function(k){var q=S.qs[k];h+='<li><b>'+esc(q.b.r)+':</b> '+esc(q.b.q)+'<br>'+esc(q.b.e)+'</li>'});h+='</ul></div>'}
 h+='<div class="sec"><div class="sec-t">Xem lại từng câu</div><div class="chips">';
 [['all','Tất cả ('+r.n+')'],['wrong','Sai ('+r.wr+')'],['blank','Bỏ trống ('+r.bl+')']].forEach(function(f){h+='<button class="chip'+(S.filter===f[0]?' on':'')+'" data-act="filter" data-f="'+f[0]+'">'+f[1]+'</button>'});
 h+='</div><div class="rv">';
 S.qs.forEach(function(q,k){var a=S.ans[k],ok=a!==undefined&&q.opts[a].ok;
  if(S.filter==='wrong'&&(ok||a===undefined))return;if(S.filter==='blank'&&a!==undefined)return;
  h+='<div class="card"><div class="qtags"><a class="tag red lnk" href="'+esc(THEMES[q.b.s].u)+'" target="_blank" rel="noopener" title="Mở văn bản gốc để đối chiếu">Câu '+(k+1)+' · '+esc(q.b.r)+' ↗</a><a class="tag lnk" href="'+esc(THEMES[q.b.s].u)+'" target="_blank" rel="noopener" title="Mở văn bản gốc để đối chiếu">'+esc(THEMES[q.b.s].t)+' ↗</a></div><p class="qtext" style="font-size:16px">'+esc(q.b.q)+'</p><div class="opts">'+optHtml(q,k,'review')+'</div>'+expHtml(q,k)+'</div>'});
 h+='</div></div><details style="margin:18px 0 0"><summary>📚 Tài liệu nguồn để đối chiếu (6 văn kiện)</summary><ul class="refs">'+REF.map(function(r){return '<li><b>'+esc(r[0])+'</b><br>'+esc(r[1])+'<br><a href="'+esc(r[2])+'" target="_blank" rel="noopener">Mở văn bản gốc trên dangcongsan.vn ↗</a></li>'}).join('')+'</ul></details><div class="acts">'+(wrongIdx.length?'<button class="btn pri" data-act="redo">Học lại '+wrongIdx.length+' câu chưa đúng</button>':'')+'<button class="btn" data-act="again">Làm lại từ đầu</button><button class="btn" data-act="home">Về trang đầu</button></div></div>';
 return h;
}
function loadStats(){
 S={view:'stats',st:null,err:null,loading:true};render();
 fetch(ENDPOINT+(ENDPOINT.indexOf('?')<0?'?':'&')+'action=stats&k=nq14&_='+Date.now()).then(function(r){return r.json()}).then(function(d){if(!d||!d.ok)throw 0;S.st=d;S.loading=false;render()}).catch(function(){S.err=true;S.loading=false;render()});
}
function statsComment(d){
 var o=[],weak=[],bestK=null,bp=-1;
 Object.keys(THEMES).forEach(function(k){var m=d.th[k];if(!m||!m.n)return;var p=pct(m.c,m.n);if(p<70)weak.push(THEMES[k].t+' ('+p+'%)');if(p>bp){bp=p;bestK=k}});
 if(d.completions<5)o.push('Mới có '+d.completions+' lượt làm đủ bài, số liệu còn ít nên chỉ mang tính tham khảo.');
 if(d.completions){o.push('Điểm trung bình '+fmt(d.avg*10)+'/100; '+d.pass+'% lượt làm bài đạt từ 50 điểm trở lên.');}
 if(bestK&&bp>=70)o.push('Nhóm nội dung nắm tốt nhất: '+THEMES[bestK].t+' ('+bp+'% câu đúng).');
 if(weak.length)o.push('Nhóm cần tăng cường tuyên truyền, ôn tập: '+weak.join('; ')+'.');
 var rg=d.ty&&d.ty.RG;if(rg&&rg.n&&pct(rg.c,rg.n)<60)o.push('Các câu phân biệt ranh giới (được làm/không được làm) còn nhiều người nhầm ('+pct(rg.c,rg.n)+'% đúng).');
 return o;
}
function viewStats(){
 var h='<div class="bar"><div class="wrap"><button class="tbtn" data-act="home" aria-label="Về trang đầu">⌂</button><div class="mid"><b>Thống kê chung</b></div>'+tbtn()+'<button class="btn sm" data-act="stats">Làm mới</button></div></div><div class="wrap" style="padding-top:18px;padding-bottom:40px">';
 if(S.loading)return h+'<div class="card">Đang tải số liệu…</div></div>';
 if(S.err)return h+'<div class="note">Chưa tải được số liệu thống kê. Kiểm tra kết nối mạng rồi bấm “Làm mới”.</div></div>';
 var d=S.st;
 h+='<div class="bigstat"><div class="stat"><b>'+d.visitors+'</b><small>người đã truy cập</small></div><div class="stat"><b>'+d.participants+'</b><small>người đã làm bài</small></div><div class="stat"><b>'+d.completions+'</b><small>lượt làm đủ 77 câu</small></div><div class="stat"><b>'+(d.completions?fmt(d.avg*10):'–')+'</b><small>điểm trung bình</small></div><div class="stat"><b>'+(d.completions?d.pass+'%':'–')+'</b><small>lượt đạt (từ 50 điểm)</small></div><div class="stat"><b>'+(d.completions?mmss(d.avgSecs):'–')+'</b><small>thời gian làm TB</small></div></div>';
 if(!d.completions)return h+'<div class="note">Chưa có ai làm đủ bài. Khi có kết quả, phần phân tích sẽ hiện ở đây.</div></div>';
 var cm=statsComment(d);if(cm.length)h+='<div class="comments">'+cm.map(function(c){return '<p>'+esc(c)+'</p>'}).join('')+'</div>';
 h+='<div class="card"><div class="sec-t">Phân bố xếp loại</div><div class="meters">';
 GRADES.forEach(function(g){var c=d.grades[g.name]||0,p=pct(c,d.completions);h+='<div class="l-mid"><div class="meter-top"><b>'+esc(g.name)+'</b><span>'+c+' lượt · '+p+'%</span></div><div class="mbar"><i data-w="'+p+'"></i></div></div>'});
 h+='</div><div class="sec-t" style="margin-top:20px">Tỷ lệ trả lời đúng theo nhóm nội dung</div><div class="meters">';
 Object.keys(THEMES).forEach(function(k){var m=d.th[k];if(!m||!m.n)return;var p=pct(m.c,m.n),l=lvl(p);h+='<div class="'+l[0]+'"><div class="meter-top"><b>'+esc(THEMES[k].t)+'</b><span>'+p+'% · '+l[1]+'</span></div><div class="mbar"><i data-w="'+p+'"></i></div></div>'});
 h+='</div><div class="meters">';
 Object.keys(TYPES).forEach(function(k){var m=d.ty[k];if(!m||!m.n)return;var p=pct(m.c,m.n),l=lvl(p);h+='<div class="'+l[0]+'"><div class="meter-top"><b>'+esc(TYPES[k])+'</b><span>'+p+'% · '+l[1]+'</span></div><div class="mbar"><i data-w="'+p+'"></i></div></div>'});
 h+='</div></div>';
 var qs=(d.q||[]).filter(function(x){return x.n>=1}).map(function(x){return {i:x.i,p:pct(x.c,x.n),n:x.n}}).sort(function(a,b){return a.p-b.p||b.n-a.n}).slice(0,8);
 if(qs.length){h+='<div class="sec"><div class="sec-t">Những câu nhiều người trả lời sai nhất</div><ul class="hq">';qs.forEach(function(x){var b=BANK[x.i];if(!b)return;h+='<li><b>'+x.p+'% đúng</b> · '+esc(b.r)+' — '+esc(b.q)+'<br><span style="color:var(--muted)">'+esc(b.e)+'</span></li>'});h+='</ul></div>'}
 h+='<p class="best">Số liệu ẩn danh, cập nhật lúc '+esc(new Date(d.updated).toLocaleString('vi-VN'))+'.</p></div>';
 return h;
}
function render(){
 var h=S===null||S.view==='start'?viewStart():S.view==='quiz'?viewQuiz():S.view==='stats'?viewStats():viewResult();
 app.innerHTML=h;
 if(S&&S.view==='stats'){setTimeout(function(){var ms=document.querySelectorAll('.mbar i');for(var i=0;i<ms.length;i++)ms[i].style.width=ms[i].getAttribute('data-w')+'%'},30)}
 if(S&&S.view==='result'){
  var r=S.res,fg=document.getElementById('rfg'),rn=document.getElementById('rn');
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  setTimeout(function(){if(fg)fg.style.strokeDashoffset=String(326.7*(1-r.score/10));var ms=document.querySelectorAll('.mbar i');for(var i=0;i<ms.length;i++)ms[i].style.width=ms[i].getAttribute('data-w')+'%'},30);
  if(reduce){rn.textContent=String(Math.round(r.score*10))}else{var t0=performance.now();(function step(t){var p=Math.min(1,(t-t0)/1000);rn.textContent=String(Math.round(r.score*10*p));if(p<1)requestAnimationFrame(step);else rn.textContent=String(Math.round(r.score*10))})(t0)}
 }
}
function finish(){
 clearInterval(timer);S.el=Math.floor((Date.now()-S.t0)/1000);S.res=compute();S.view='result';S.confirm=false;
 if(S.qs.length===BANK.length){var g=gradeOf(S.res.score);if(!best||S.res.score>best.s){best={s:S.res.score,g:g.name};ls('qdnq_best',JSON.stringify(best))}}
 if(S.qs.length===BANK.length&&ENDPOINT){var th={},ty={};['th','ty'].forEach(function(w){var src=S.res[w],dst=w==='th'?th:ty;Object.keys(src).forEach(function(k){dst[k]=[src[k].c,src[k].n]})});
  send({t:'result',mode:S.mode,score:S.res.score,c:S.res.c,n:S.res.n,secs:S.el,q:S.qs.map(function(q,k){var a=S.ans[k];return [q.i,a===undefined?-1:(q.opts[a].ok?1:0)]}),th:th,ty:ty});S.sent=true}
 render();window.scrollTo(0,0);
}
function pick(j){
 var k=S.cur;if(S.mode==='learn'&&S.ans[k]!==undefined)return;
 if(S.mode==='exam'&&S.ans[k]===j){delete S.ans[k]}else S.ans[k]=j;
 render();
}
function goto(i){if(i<0||i>=S.qs.length)return;S.cur=i;render();window.scrollTo(0,0)}
app.addEventListener('click',function(e){
 var el=e.target.closest('[data-act]');if(!el)return;var a=el.getAttribute('data-act');
 if(a==='theme')return toggleTheme();
 if(a==='mode'){mode=el.getAttribute('data-m');return render()}
 if(a==='stats')return loadStats();
 if(a==='start')return newSession(mode,BANK.map(function(_,i){return i}));
 if(a==='home'){if(S&&S.view==='quiz'&&Object.keys(S.ans).length&&!confirm('Thoát về trang đầu? Bài đang làm sẽ mất.'))return;clearInterval(timer);S=null;render();return window.scrollTo(0,0)}
 if(!S)return;
 if(a==='opt')return pick(+el.getAttribute('data-j'));
 if(a==='go')return goto(+el.getAttribute('data-i'));
 if(a==='prev')return goto(S.cur-1);
 if(a==='next'){if(S.cur===S.qs.length-1){S.confirm=true;return render()}return goto(S.cur+1)}
 if(a==='flag'){S.flag[S.cur]=!S.flag[S.cur];return render()}
 if(a==='submit'){S.confirm=true;return render()}
 if(a==='cancel'){S.confirm=false;return render()}
 if(a==='confirm')return finish();
 if(a==='filter'){S.filter=el.getAttribute('data-f');return render()}
 if(a==='again')return newSession(S.mode,BANK.map(function(_,i){return i}));
 if(a==='redo'){var idx=[];S.qs.forEach(function(q,k){var x=S.ans[k];if(!(x!==undefined&&q.opts[x].ok))idx.push(q.i)});return newSession('learn',idx)}
});
document.addEventListener('keydown',function(e){
 if(!S||S.view!=='quiz'||e.ctrlKey||e.metaKey||e.altKey)return;
 var k=e.key.toLowerCase();
 if(k.length===1){var j='abcd'.indexOf(k);if(j<0)j='1234'.indexOf(k);if(j>=0&&j<S.qs[S.cur].opts.length&&!S.confirm){pick(j)}return}
 if(S.confirm)return;
 if(k==='arrowright')goto(S.cur+1);else if(k==='arrowleft')goto(S.cur-1);else if(k==='enter'&&S.mode==='learn'&&S.ans[S.cur]!==undefined&&S.cur<S.qs.length-1)goto(S.cur+1);
});
theme();pingVisit();
var bt=document.getElementById('boot');if(bt)bt.parentNode.removeChild(bt);
render();
})();
</script>
</body>
</html>
