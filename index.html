n môn và khai thác tài sản tạo thu nhập; đầu tư kinh doanh không đầu tư thành lập tổ chức kinh tế và không chi phối, quản lý, điều hành; đầu tư kinh doanh có thành lập tổ chức kinh tế hoặc có chi phối nhưng không quản lý, điều hành; đầu tư kinh doanh có tham gia quản lý, điều hành, kể cả trường hợp có thành lập tổ chức kinh tế hoặc có chi phối.","Chỉ hai nhóm: hoạt động chuyên môn và khai thác tài sản tạo thu nhập; đầu tư kinh doanh nhưng không đầu tư thành lập tổ chức kinh tế và không chi phối, quản lý, điều hành.","Chỉ hai nhóm: đầu tư kinh doanh có đầu tư thành lập tổ chức kinh tế hoặc có chi phối nhưng không quản lý, điều hành; đầu tư kinh doanh có tham gia quản lý, điều hành, kể cả trường hợp có đầu tư thành lập tổ chức kinh tế hoặc có chi phối."],"e":"Điều 4 phân loại hoạt động đầu tư kinh doanh của đảng viên thành bốn nhóm: (1) hoạt động chuyên môn và khai thác tài sản tạo thu nhập; (2) đầu tư kinh doanh nhưng không đầu tư thành lập tổ chức kinh tế và không chi phối, quản lý, điều hành; (3) đầu tư kinh doanh có đầu tư thành lập tổ chức kinh tế hoặc có chi phối nhưng không quản lý, điều hành; (4) đầu tư kinh doanh có tham gia quản lý, điều hành, kể cả trường hợp có đầu tư thành lập tổ chức kinh tế hoặc có chi phối.\nCách nhớ: mức độ can dự tăng dần từ nhóm 1 đến nhóm 4. Các điều 6–10 dùng chính số thứ tự này (“khoản 3, khoản 4 Điều 4”) để xác định ai được làm, ai phải xin chấp thuận, ai không được làm. Chi phối, quản lý, điều hành áp dụng với cả tổ chức kinh tế, dự án đầu tư, hợp đồng đầu tư, hợp đồng hợp tác kinh doanh và các hình thức khác.\nVì sao các phương án còn lại chưa đúng: Mỗi phương án còn lại chỉ nêu hai trong bốn nhóm: một phương án chỉ có hai nhóm đầu (nhóm 1 và 2), một phương án chỉ có hai nhóm sau (nhóm 3 và 4). Cách phân loại đầy đủ phải có cả bốn nhóm.","t":"Bốn nhóm, mức độ can dự tăng dần; các điều 6–10 viện dẫn khoản 3, khoản 4 Điều 4."},{"s":"D","y":"NH","r":"QĐ 224-QĐ/TW · Điều 2.3","q":"Theo Quy định số 224-QĐ/TW, nhận định nào phản ánh đầy đủ nguyên tắc áp dụng quyền, giới hạn và kiểm soát xung đột lợi ích?","o":["Áp dụng theo chức danh, vị trí công tác, chức trách, nhiệm vụ được giao; đảng viên giữ nhiều chức danh, thực hiện nhiều nhiệm vụ hoặc thuộc nhiều nhóm đối tượng phải tuân thủ giới hạn tương ứng với từng chức danh, nhiệm vụ, nhóm đối tượng.","Chỉ áp dụng theo chức danh cao nhất mà đảng viên đang giữ.","Chỉ áp dụng theo nơi đảng viên sinh hoạt đảng, không xét nhiệm vụ thực tế."],"e":"Điều 2.3 quy định quyền, giới hạn và việc kiểm soát xung đột lợi ích áp dụng theo chức danh, vị trí công tác, chức trách, nhiệm vụ được giao. Đảng viên giữ nhiều chức danh, thực hiện nhiều nhiệm vụ hoặc thuộc nhiều nhóm đối tượng phải tuân thủ giới hạn tương ứng với từng chức danh, nhiệm vụ, nhóm đối tượng, bảo đảm kiểm soát xung đột lợi ích, bảo vệ bí mật nhà nước, bí mật công tác.\nNghĩa là mỗi vai trò đều có giới hạn riêng và phải tuân thủ đồng thời, không lấy một vai trò thay cho các vai trò còn lại.\nVì sao các phương án còn lại chưa đúng: Phương án chỉ áp dụng theo chức danh cao nhất bỏ qua các chức danh, nhiệm vụ khác mà đảng viên đang đảm nhiệm, trái yêu cầu tuân thủ giới hạn “tương ứng với từng chức danh”. Phương án chỉ theo nơi sinh hoạt đảng, không xét nhiệm vụ thực tế đi ngược căn cứ của Quy định: chức danh, vị trí công tác, chức trách, nhiệm vụ được giao.","t":"Quyền, giới hạn, kiểm soát xung đột lợi ích áp dụng theo chức danh, nhiệm vụ, nhóm đối tượng."},{"s":"D","y":"NH","r":"QĐ 224-QĐ/TW · Điều 5.1, 5.2","q":"Theo Quy định số 224-QĐ/TW, nhận định nào đúng đối với đảng viên ngoài khu vực công khi được giao thực hiện nhiệm vụ công?","o":["Không được lợi dụng tư cách đảng viên, chức vụ trong Đảng hoặc quan hệ với người có thẩm quyền để tạo lợi thế bất bình đẳng, tác động trái quy định, phục vụ lợi ích riêng, lợi ích nhóm; không được xử lý công việc, nhiệm vụ có xung đột lợi ích chưa được kiểm soát hoặc làm ảnh hưởng tiêu cực đến việc thực hiện nhiệm vụ công được giao.","Phải xin chấp thuận của tổ chức đảng trước mọi khoản đầu tư kinh doanh hợp pháp.","Được tự mình tiếp tục xử lý công việc có xung đột lợi ích chưa được kiểm soát."],"e":"Điều 5.1 cho phép đảng viên ngoài khu vực công thực hiện tất cả các hoạt động ở Điều 4 và các hoạt động khác mà pháp luật không cấm, không phải xin chấp thuận của tổ chức đảng; phát sinh xung đột lợi ích thì báo cáo, kiểm soát theo Điều 12. Điều 5.2 đặt giới hạn khi được giao nhiệm vụ công: không lợi dụng tư cách đảng viên, chức vụ trong Đảng hoặc quan hệ với người có thẩm quyền để tạo lợi thế bất bình đẳng, tác động trái quy định, phục vụ lợi ích riêng, lợi ích nhóm; không xử lý công việc có xung đột lợi ích chưa được kiểm soát hoặc làm ảnh hưởng tiêu cực đến nhiệm vụ công.\nVì sao các phương án còn lại chưa đúng: Phương án phải xin chấp thuận của tổ chức đảng trước mọi khoản đầu tư hợp pháp trái Điều 5.1 (không phải xin chấp thuận) và Điều 2.2 (cấp ủy không đặt thêm thủ tục hạn chế). Phương án được tự mình tiếp tục xử lý công việc có xung đột lợi ích chưa được kiểm soát trái trực tiếp Điều 5.2, và Điều 12.2 cũng yêu cầu không tham gia xử lý công việc đó, trừ khi cấp có thẩm quyền cho phép.","t":"Ngoài khu vực công: không phải xin chấp thuận; nhưng khi làm nhiệm vụ công thì không lợi dụng, không xử lý việc có xung đột lợi ích chưa kiểm soát."},{"s":"D","y":"NH","r":"QĐ 224-QĐ/TW · Điều 6.1","q":"Theo Quy định số 224-QĐ/TW, đảng viên là cán bộ thuộc diện Bộ Chính trị, Ban Bí thư quản lý được thực hiện những hoạt động nào mà không phải xin chấp thuận?","o":["Hoạt động chuyên môn và khai thác tài sản tạo thu nhập; đầu tư kinh doanh nhưng không đầu tư thành lập tổ chức kinh tế và không chi phối, quản lý, điều hành.","Đầu tư thành lập tổ chức kinh tế hoặc chi phối tổ chức kinh tế.","Đầu tư kinh doanh vào tổ chức kinh tế, lĩnh vực mà mình trực tiếp quyết định, quản lý."],"e":"Điều 6.1 quy định cán bộ thuộc diện Bộ Chính trị, Ban Bí thư quản lý được làm và không phải xin chấp thuận hai nhóm: hoạt động chuyên môn và khai thác tài sản tạo thu nhập (khoản 1 Điều 4); đầu tư kinh doanh nhưng không đầu tư thành lập tổ chức kinh tế và không chi phối, quản lý, điều hành (khoản 2 Điều 4).\nTa thấy nhóm này chỉ được ở hai nhóm đầu, tức mức can dự thấp nhất.\nVì sao các phương án còn lại chưa đúng: Phương án đầu tư thành lập hoặc chi phối tổ chức kinh tế là nhóm 3 ở Điều 4, mà Điều 6.2a ghi rõ là không được làm. Phương án đầu tư vào tổ chức kinh tế, lĩnh vực mà mình trực tiếp quyết định, quản lý trái Điều 2.4: đảng viên trong khu vực công không được đầu tư kinh doanh vào những nơi mình trực tiếp quyết định, quản lý.","t":"Cán bộ diện Bộ Chính trị, Ban Bí thư: được làm nhóm 1 và 2, không xin chấp thuận; không được nhóm 3 và 4."},{"s":"D","y":"NH","r":"QĐ 224-QĐ/TW · Điều 7","q":"Theo Quy định số 224-QĐ/TW, đảng viên là cán bộ, công chức không thuộc diện Bộ Chính trị, Ban Bí thư quản lý không được thực hiện hoạt động nào?","o":["Đầu tư kinh doanh có tham gia quản lý, điều hành, kể cả trường hợp có đầu tư thành lập tổ chức kinh tế hoặc có chi phối.","Hoạt động chuyên môn và khai thác tài sản tạo thu nhập.","Đầu tư kinh doanh nhưng không đầu tư thành lập tổ chức kinh tế và không chi phối, quản lý, điều hành."],"e":"Điều 7.3a quy định cán bộ, công chức không thuộc diện Bộ Chính trị, Ban Bí thư quản lý không được làm hoạt động đầu tư kinh doanh có tham gia quản lý, điều hành (nhóm 4, khoản 4 Điều 4). Cùng điều đó: nhóm 1 và 2 được làm không phải xin chấp thuận (Điều 7.1); nhóm 3 được làm sau khi được chấp thuận nếu không ở vị trí, lĩnh vực có nguy cơ cao phát sinh xung đột lợi ích (Điều 7.2).\nSo với cán bộ diện Bộ Chính trị, Ban Bí thư (Điều 6), nhóm này được mở thêm nhóm 3 (có điều kiện chấp thuận).\nVì sao các phương án còn lại chưa đúng: Hoạt động chuyên môn và khai thác tài sản tạo thu nhập, cũng như đầu tư không thành lập tổ chức kinh tế và không chi phối, quản lý, điều hành, đều là những hoạt động Điều 7.1 cho phép làm mà không phải xin chấp thuận, nên không phải hoạt động bị cấm.","t":"Cán bộ, công chức khác: nhóm 1, 2 tự làm; nhóm 3 sau chấp thuận (nếu không ở vị trí nguy cơ cao); nhóm 4 không được."},{"s":"D","y":"NH","r":"QĐ 224-QĐ/TW · Điều 8.1, 8.2","q":"Theo Quy định số 224-QĐ/TW, hoạt động nào đảng viên là viên chức được thực hiện mà không phải xin chấp thuận?","o":["Hoạt động chuyên môn và khai thác tài sản tạo thu nhập; đầu tư kinh doanh không thành lập tổ chức kinh tế và không chi phối, quản lý, điều hành; nếu không ở vị trí, lĩnh vực có nguy cơ cao phát sinh xung đột lợi ích, được thực hiện hoạt động đầu tư kinh doanh có đầu tư thành lập tổ chức kinh tế hoặc có chi phối nhưng không quản lý, điều hành.","Tạm thời rời vị trí công tác để thành lập, chi phối, quản lý, điều hành tổ chức kinh tế mà không cần quyết định của cấp có thẩm quyền.","Viên chức không giữ chức vụ quản lý được trực tiếp điều hành tổ chức kinh tế trong khi vẫn làm việc mà không phải xin chấp thuận."],"e":"Điều 8.1 quy định viên chức được làm và không phải xin chấp thuận: hoạt động chuyên môn và khai thác tài sản tạo thu nhập; đầu tư kinh doanh không thành lập tổ chức kinh tế và không chi phối, quản lý, điều hành; và, nếu không ở vị trí, lĩnh vực có nguy cơ cao phát sinh xung đột lợi ích, được làm nhóm 3 (đầu tư thành lập tổ chức kinh tế hoặc có chi phối nhưng không quản lý, điều hành).\nSo với cán bộ, công chức (Điều 7), viên chức được làm nhóm 3 mà không cần chấp thuận; còn nhóm 4 thì phải chấp thuận (Điều 8.2).\nVì sao các phương án còn lại chưa đúng: Phương án tạm thời rời vị trí công tác để thành lập, chi phối, quản lý, điều hành tổ chức kinh tế mà không cần quyết định của cấp có thẩm quyền sai: Điều 8.2b đặt việc này vào nhóm “được làm sau khi được chấp thuận”, và đối tượng, điều kiện, thời hạn, quyền, nghĩa vụ, việc tiếp nhận trở lại do cấp có thẩm quyền quản lý cán bộ quyết định. Phương án viên chức không giữ chức vụ quản lý trực tiếp điều hành tổ chức kinh tế khi vẫn làm việc mà không xin chấp thuận cũng sai: Điều 8.2a yêu cầu chấp thuận của cấp có thẩm quyền và bảo đảm không ảnh hưởng chức trách, nhiệm vụ, chất lượng dịch vụ công.","t":"Viên chức: nhóm 1, 2 và nhóm 3 (nếu không nguy cơ cao) không cần chấp thuận; nhóm 4 cần chấp thuận."},{"s":"D","y":"NH","r":"QĐ 224-QĐ/TW · Điều 6.2","q":"Theo Quy định số 224-QĐ/TW, đảng viên là cán bộ thuộc diện Bộ Chính trị, Ban Bí thư quản lý không được thực hiện hoạt động nào?","o":["Đầu tư kinh doanh có đầu tư thành lập tổ chức kinh tế hoặc có chi phối nhưng không quản lý, điều hành; tham gia quản lý, điều hành, kể cả trường hợp có đầu tư thành lập tổ chức kinh tế hoặc có chi phối; duy trì khoản đầu tư kinh doanh có xung đột lợi ích chưa được kiểm soát.","Hoạt động chuyên môn và khai thác tài sản tạo thu nhập.","Đầu tư kinh doanh không thành lập tổ chức kinh tế và không chi phối, quản lý, điều hành."],"e":"Điều 6.2 quy định cán bộ thuộc diện Bộ Chính trị, Ban Bí thư quản lý không được làm: (a) các hoạt động ở khoản 3 và khoản 4 Điều 4 (nhóm 3 và nhóm 4); (b) duy trì khoản đầu tư kinh doanh có xung đột lợi ích chưa được kiểm soát.\nPhân biệt với cán bộ, công chức khác (Điều 7): đối với diện Bộ Chính trị, Ban Bí thư, cả nhóm 3 cũng không được làm, không có đường “xin chấp thuận” như Điều 7.2.\nVì sao các phương án còn lại chưa đúng: Hoạt động chuyên môn và khai thác tài sản tạo thu nhập, và đầu tư không thành lập tổ chức kinh tế, không chi phối, quản lý, điều hành, là hai nhóm Điều 6.1 cho phép làm mà không phải xin chấp thuận, nên không thuộc diện bị cấm.","t":"Diện Bộ Chính trị, Ban Bí thư: không nhóm 3, không nhóm 4, không duy trì khoản đầu tư xung đột lợi ích chưa kiểm soát."},{"s":"D","y":"NH","r":"QĐ 224-QĐ/TW · Điều 7.3b; Điều 3.8","q":"Theo Quy định số 224-QĐ/TW, đảng viên là cán bộ, công chức không thuộc diện Bộ Chính trị, Ban Bí thư quản lý ở vị trí, lĩnh vực nào thì không được tham gia đầu tư kinh doanh?","o":["Ở vị trí, lĩnh vực có nguy cơ cao phát sinh xung đột lợi ích.","Không được thực hiện hoạt động chuyên môn và khai thác tài sản tạo thu nhập.","Không được thực hiện bất kỳ khoản đầu tư nào mà không tham gia quản lý, điều hành hoặc chi phối."],"e":"Điều 7.3b quy định cán bộ, công chức ở vị trí, lĩnh vực có nguy cơ cao phát sinh xung đột lợi ích không được thực hiện hoạt động đầu tư kinh doanh ở khoản 3 và khoản 4 Điều 4. Điều 3.8 giải thích đó là vị trí công tác, lĩnh vực hoạt động trong khu vực công mà việc thực hiện quyền quyết định, tham mưu, đề xuất hoặc tiếp cận thông tin chưa công khai có thể ảnh hưởng đến quyền, nghĩa vụ, lợi ích kinh tế liên quan đến hoạt động đầu tư kinh doanh của tổ chức, cá nhân.\nLưu ý cách hiểu: câu hỏi nói “không được tham gia đầu tư kinh doanh” là nói gọn; chính xác là không được làm nhóm 3 và nhóm 4, còn nhóm 1 và nhóm 2 vẫn được làm không xin chấp thuận (Điều 7.1).\nVì sao các phương án còn lại chưa đúng: Phương án không được thực hiện hoạt động chuyên môn và khai thác tài sản tạo thu nhập sai vì đây là nhóm Điều 7.1 cho phép làm. Phương án không được thực hiện bất kỳ khoản đầu tư nào nếu không tham gia quản lý, điều hành hoặc chi phối cũng sai vì nhóm 2 (đầu tư không thành lập tổ chức kinh tế và không chi phối, quản lý, điều hành) vẫn được làm theo Điều 7.1.","t":"Vị trí, lĩnh vực nguy cơ cao: không được nhóm 3 và 4; vẫn được nhóm 1 và 2."},{"s":"D","y":"NH","r":"QĐ 224-QĐ/TW · Điều 8.3b","q":"Theo Quy định số 224-QĐ/TW, đảng viên là viên chức giữ chức vụ quản lý không được thực hiện hoạt động nào?","o":["Đồng thời quản lý, điều hành tổ chức kinh tế, trừ trường hợp được cử tham gia quản lý hoặc làm đại diện phần vốn, tài sản của đơn vị tại tổ chức kinh tế theo quy định của pháp luật.","Hoạt động chuyên môn và khai thác tài sản tạo thu nhập.","Đầu tư kinh doanh nhưng không thành lập tổ chức kinh tế và không chi phối, quản lý, điều hành."],"e":"Điều 8.3b quy định viên chức giữ chức vụ quản lý không được đồng thời quản lý, điều hành tổ chức kinh tế, trừ trường hợp được cử tham gia quản lý hoặc làm đại diện phần vốn, tài sản của đơn vị tại tổ chức kinh tế theo quy định của pháp luật.\nHai ý cần nhớ: cấm đồng thời giữ chức vụ quản lý của đơn vị và quản lý, điều hành tổ chức kinh tế; ngoại lệ là việc được cử đi vì nhiệm vụ của đơn vị (đại diện phần vốn, tài sản).\nVì sao các phương án còn lại chưa đúng: Hoạt động chuyên môn và khai thác tài sản tạo thu nhập, và đầu tư không thành lập tổ chức kinh tế, không chi phối, quản lý, điều hành, đều thuộc những hoạt động Điều 8.1 cho phép làm mà không phải xin chấp thuận; Điều 8.3b không cấm hai hoạt động này đối với viên chức giữ chức vụ quản lý.","t":"Viên chức giữ chức vụ quản lý: không đồng thời quản lý, điều hành tổ chức kinh tế (trừ khi được cử/đại diện phần vốn, tài sản của đơn vị)."},{"s":"D","y":"NH","r":"QĐ 224-QĐ/TW · Điều 9","q":"Theo Quy định số 224-QĐ/TW, đảng viên đang công tác, phục vụ trong Quân đội Nhân dân, Công an Nhân dân tham gia đầu tư kinh doanh như thế nào?","o":["Được thực hiện hoạt động chuyên môn và khai thác tài sản tạo thu nhập, và đầu tư kinh doanh không thành lập tổ chức kinh tế, không chi phối, quản lý, điều hành mà không phải xin chấp thuận; sau khi được chấp thuận, nếu không ở vị trí, lĩnh vực có nguy cơ cao phát sinh xung đột lợi ích thì được đầu tư thành lập tổ chức kinh tế hoặc có chi phối nhưng không quản lý, điều hành; trong thời gian công tác, phục vụ không được quản lý, điều hành tổ chức kinh tế, trừ trường hợp được cấp có thẩm quyền phân công, giao nhiệm vụ; phải bảo đảm bí mật nhà nước, bí mật công tác và yêu cầu quốc phòng, an ninh.","Mọi đảng viên đều được trực tiếp quản lý, điều hành tổ chức kinh tế sau khi kê khai.","Mọi hình thức đầu tư kinh doanh và hoạt động chuyên môn tạo thu nhập đều bị cấm."],"e":"Điều 9 quy định đảng viên đang công tác, phục vụ trong Quân đội, Công an: được làm và không phải xin chấp thuận nhóm 1 và nhóm 2; được làm nhóm 3 sau khi được chấp thuận nếu không ở vị trí, lĩnh vực có nguy cơ cao phát sinh xung đột lợi ích; việc thực hiện phải bảo đảm bí mật nhà nước, bí mật công tác, không phương hại đến quốc phòng, an ninh. Đảng viên ở vị trí nguy cơ cao không được làm nhóm 3 và 4; trong thời gian công tác, phục vụ không được quản lý, điều hành tổ chức kinh tế, trừ trường hợp được cấp có thẩm quyền phân công, giao nhiệm vụ.\nKhung tương tự cán bộ, công chức (Điều 7) nhưng thêm yêu cầu riêng về bí mật nhà nước, quốc phòng, an ninh.\nVì sao các phương án còn lại chưa đúng: Phương án mọi đảng viên đều được trực tiếp quản lý, điều hành tổ chức kinh tế sau khi kê khai sai: Điều 9.3b cấm quản lý, điều hành tổ chức kinh tế trong thời gian công tác, trừ khi được cấp có thẩm quyền phân công, giao nhiệm vụ. Phương án mọi hình thức đầu tư kinh doanh và hoạt động chuyên môn tạo thu nhập đều bị cấm sai: nhóm 1 và 2 được làm không phải xin chấp thuận (Điều 9.1).","t":"Quân đội, Công an: nhóm 1, 2 tự làm; nhóm 3 sau chấp thuận (nếu không nguy cơ cao); không quản lý, điều hành tổ chức kinh tế (trừ khi được phân công); bảo đảm bí mật, quốc phòng, an ninh."},{"s":"D","y":"NH","r":"QĐ 224-QĐ/TW · Điều 10","q":"Theo Quy định số 224-QĐ/TW, đảng viên là người quản lý doanh nghiệp nhà nước, người đại diện phần vốn nhà nước được làm gì mà không phải xin chấp thuận?","o":["Được thực hiện hoạt động chuyên môn và khai thác tài sản tạo thu nhập; đầu tư kinh doanh nhưng không đầu tư thành lập tổ chức kinh tế và không chi phối, quản lý, điều hành; mua, nhận, nắm giữ cổ phần, phần vốn góp và thực hiện quyền cổ đông, thành viên tại doanh nghiệp do mình quản lý hoặc đại diện phần vốn nhà nước theo quy định của pháp luật; việc thực hiện quyền đối với phần vốn cá nhân phải tách bạch với chức trách quản lý, đại diện phần vốn nhà nước và bảo đảm kiểm soát xung đột lợi ích.","Được tự mình thành lập và trực tiếp điều hành tổ chức kinh tế ngoài khu vực công trong mọi lĩnh vực.","Được đầu tư kinh doanh trong ngành, lĩnh vực có lợi ích liên quan trực tiếp đến doanh nghiệp nhà nước do mình quản lý, không cần điều kiện nào."],"e":"Điều 10.1 cho phép đảng viên là người quản lý doanh nghiệp nhà nước, người đại diện phần vốn nhà nước được làm không phải xin chấp thuận: hoạt động chuyên môn và khai thác tài sản tạo thu nhập; đầu tư không thành lập tổ chức kinh tế và không chi phối, quản lý, điều hành; mua, nhận, nắm giữ cổ phần, phần vốn góp và thực hiện quyền cổ đông, thành viên tại doanh nghiệp do mình quản lý hoặc đại diện phần vốn nhà nước. Quyền đối với phần vốn cá nhân phải tách bạch với chức trách quản lý, đại diện phần vốn nhà nước và bảo đảm kiểm soát xung đột lợi ích.\nĐiều 10.2: nhóm 3 và 4 chỉ được làm sau khi chấp thuận, và chỉ với tổ chức kinh tế ngoài khu vực công, không thuộc ngành, lĩnh vực có lợi ích liên quan trực tiếp đến doanh nghiệp nhà nước mà mình quản lý.\nVì sao các phương án còn lại chưa đúng: Phương án tự thành lập và trực tiếp điều hành tổ chức kinh tế ngoài khu vực công trong mọi lĩnh vực sai: đó là nhóm 3, 4 nên phải được chấp thuận (Điều 10.2) và không áp dụng với lĩnh vực có lợi ích liên quan trực tiếp đến doanh nghiệp nhà nước mình quản lý. Phương án đầu tư kinh doanh trong ngành, lĩnh vực có lợi ích liên quan trực tiếp mà không cần điều kiện nào trái Điều 10.3, chỉ ngoại trừ việc nắm giữ cổ phần, phần vốn góp theo Điều 10.1c.","t":"Người quản lý DNNN: được nắm giữ cổ phần ở doanh nghiệp mình quản lý (tách bạch phần vốn cá nhân); không đầu tư vào ngành, lĩnh vực liên quan trực tiếp, trừ trường hợp này."},{"s":"D","y":"NH","r":"QĐ 224-QĐ/TW · Điều 11","q":"Theo Quy định số 224-QĐ/TW, đảng viên không còn công tác trong khu vực công sau khi thôi công tác, nghỉ hưu không được thực hiện hoạt động nào?","o":["Các hoạt động bị hạn chế có liên quan đến lĩnh vực, công việc đã phụ trách trong phạm vi và thời hạn theo quy định của pháp luật.","Hoạt động chuyên môn và khai thác tài sản tạo thu nhập hợp pháp.","Đầu tư thành lập tổ chức kinh tế trong lĩnh vực không bị hạn chế theo pháp luật."],"e":"Điều 11.2 cho phép đảng viên không còn công tác trong khu vực công làm như đảng viên ngoài khu vực công (Điều 5), không phải xin chấp thuận, trừ các hoạt động bị hạn chế. Điều 11.3 quy định không được làm các hoạt động bị hạn chế có liên quan đến lĩnh vực, công việc đã phụ trách, trong phạm vi và thời hạn theo quy định của pháp luật. Điều 11.1 còn khuyến khích đảng viên sau khi thôi chức, thôi công tác, nghỉ hưu phát huy chuyên môn, kinh nghiệm, nguồn lực hợp pháp để khởi nghiệp, đầu tư kinh doanh, đổi mới sáng tạo.\nTinh thần: khuyến khích và mở rộng, nhưng giữ giới hạn đối với lĩnh vực, công việc đã phụ trách (chống lợi dụng ảnh hưởng, thông tin từ chức vụ cũ).\nVì sao các phương án còn lại chưa đúng: Hoạt động chuyên môn và khai thác tài sản tạo thu nhập hợp pháp là hoạt động đảng viên ngoài khu vực công được làm (Điều 5.1, Điều 11.2). Đầu tư thành lập tổ chức kinh tế trong lĩnh vực không bị hạn chế theo pháp luật cũng được làm theo Điều 11.2 vì không rơi vào hoạt động bị hạn chế của Điều 11.3.","t":"Sau thôi giữ chức, nghỉ hưu: làm như ngoài khu vực công; trừ hoạt động bị hạn chế liên quan lĩnh vực, công việc đã phụ trách (theo phạm vi, thời hạn pháp luật)."},{"s":"D","y":"NH","r":"QĐ 224-QĐ/TW · Điều 12.1, 12.2","q":"Theo Quy định số 224-QĐ/TW, đảng viên phải báo cáo về xung đột lợi ích khi nào?","o":["Khi phát sinh xung đột lợi ích hoặc khi cấp có thẩm quyền phát hiện và yêu cầu thì phải kịp thời báo cáo cấp có thẩm quyền.","Mỗi khi phát sinh bất kỳ khoản đầu tư hợp pháp nào, dù không có xung đột lợi ích.","Chỉ khi đã có kết luận về hành vi vi phạm."],"e":"Điều 12.2 yêu cầu: khi phát sinh xung đột lợi ích, hoặc khi cấp có thẩm quyền phát hiện và yêu cầu, đảng viên phải kịp thời báo cáo cấp có thẩm quyền; không tham gia xử lý công việc có xung đột lợi ích chưa được kiểm soát, trừ trường hợp cấp có thẩm quyền cho phép. Điều 12.1 nhận diện xung đột lợi ích dựa trên mối liên hệ cụ thể giữa lợi ích kinh tế (trực tiếp, gián tiếp, thực tế được thụ hưởng, không phụ thuộc người đứng tên) với chức trách, nhiệm vụ, quyền hạn.\nHai thời điểm báo cáo: khi phát sinh xung đột lợi ích, và khi cấp có thẩm quyền yêu cầu. Cả hai đều “kịp thời”, không chờ kết luận.\nVì sao các phương án còn lại chưa đúng: Phương án báo cáo mỗi khi có bất kỳ khoản đầu tư hợp pháp nào, dù không có xung đột lợi ích, mở rộng nghĩa vụ vượt Điều 12.2 và trái Điều 2.2 (cấp ủy không đặt thêm thủ tục hạn chế quyền đầu tư kinh doanh hợp pháp). Phương án chỉ báo cáo khi đã có kết luận về hành vi vi phạm là quá muộn: Quy định yêu cầu báo cáo kịp thời ngay khi phát sinh xung đột lợi ích hoặc khi được yêu cầu, nhằm kiểm soát trước khi thành vi phạm.","t":"Báo cáo kịp thời khi phát sinh xung đột lợi ích hoặc khi cấp có thẩm quyền yêu cầu; không xử lý việc có xung đột chưa kiểm soát."},{"s":"E","y":"NH","r":"KL 105-KL/TW · Mục III.1","q":"Theo Kết luận, nhân tài được nhận thức như thế nào?","o":["Là người có phẩm chất, tố chất, năng lực nổi trội và tư duy sáng tạo; có sản phẩm, thành tích hoặc đóng góp đặc biệt, có tính đột phá, tạo ra giá trị và tác động tích cực; có khả năng đảm nhận, giải quyết hiệu quả nhiệm vụ quan trọng, mới, khó, phức tạp.","Là người có bằng cấp cao, học hàm, học vị và nhiều năm giữ chức vụ lãnh đạo, quản lý trong cơ quan nhà nước.","Là người được cơ quan có thẩm quyền tuyển dụng vào biên chế và xếp ở ngạch chuyên môn cao nhất."],"e":"Mục III.1 thống nhất nhận thức: nhân tài là người có phẩm chất, tố chất, năng lực nổi trội và tư duy sáng tạo; có sản phẩm, thành tích hoặc đóng góp đặc biệt, có tính đột phá, tạo ra giá trị và tác động tích cực; có khả năng đảm nhận, giải quyết hiệu quả những nhiệm vụ quan trọng, mới, khó, phức tạp. Nhân tài được nhận diện chủ yếu bằng phẩm chất, năng lực thực tế, sản phẩm cụ thể, uy tín nghề nghiệp và giá trị đóng góp trong thực tiễn.\nĐiểm then chốt: văn bản nói rõ không đồng nhất nhân tài với người có bằng cấp cao, học hàm, học vị, chức vụ quản lý hoặc thâm niên công tác.\nVì sao các phương án còn lại chưa đúng: Phương án bằng cấp cao, học hàm, học vị và nhiều năm giữ chức vụ lãnh đạo, quản lý chính là những tiêu chí mục III.1 loại ra khỏi định nghĩa nhân tài. Phương án được tuyển vào biên chế và xếp ngạch chuyên môn cao nhất gắn nhân tài với biên chế, ngạch; trong khi Kết luận chủ trương tìm nhân tài không phân biệt khu vực công, khu vực tư và không tính vào chỉ tiêu biên chế đối với khu vực công (mục III.3).","t":"Nhân tài = năng lực nổi trội + sản phẩm, đóng góp đột phá + giải được việc khó; không đồng nhất với bằng cấp, học hàm, chức vụ, thâm niên."},{"s":"E","y":"NH","r":"KL 105-KL/TW · Mục II.1, quan điểm (2); III.2","q":"Việc thu hút và trọng dụng nhân tài phải đặt trong tổng thể nào và lấy nội dung nào làm định hướng cao nhất?","o":["Đặt trong tổng thể chiến lược phát triển đất nước, lấy lợi ích quốc gia, dân tộc làm định hướng cao nhất.","Đặt trong tổng thể phát triển đất nước và nhu cầu tăng số lượng người có học hàm, học vị trong khu vực công.","Đặt trong tổng thể phát triển đất nước và mở rộng đồng đều chính sách nhân tài cho tất cả ngành, lĩnh vực và địa phương."],"e":"Quan điểm (2) nêu: thu hút và trọng dụng nhân tài phải đặt trong tổng thể chiến lược phát triển đất nước, lấy lợi ích quốc gia - dân tộc làm định hướng cao nhất; đầu tư cho nhân tài là đầu tư dài hạn, chiến lược; thực hiện có trọng tâm, trọng điểm, ưu tiên nhân tài thực hiện các chương trình, dự án trọng điểm quốc gia.\nHai từ khóa: “chiến lược phát triển đất nước” (tổng thể) và “lợi ích quốc gia - dân tộc” (định hướng cao nhất).\nVì sao các phương án còn lại chưa đúng: Phương án tăng số lượng người có học hàm, học vị trong khu vực công đặt mục tiêu vào bằng cấp, trái mục III.1 (không đồng nhất nhân tài với học hàm, học vị). Phương án mở rộng đồng đều chính sách cho mọi ngành, lĩnh vực, địa phương trái yêu cầu “có trọng tâm, trọng điểm”; mục III.2 cũng yêu cầu tập trung nguồn lực, không phân bổ bình quân, dàn trải.","t":"Đặt trong tổng thể chiến lược phát triển đất nước; định hướng cao nhất là lợi ích quốc gia - dân tộc."},{"s":"E","y":"NH","r":"KL 105-KL/TW · Mục II.1, quan điểm (3), (5)","q":"Theo quan điểm của Kết luận, đâu là khâu then chốt và đâu là nhiệm vụ căn bản, lâu dài trong công tác nhân tài?","o":["Trọng dụng là khâu then chốt; tạo nguồn nhân tài là nhiệm vụ căn bản, lâu dài.","Đãi ngộ là khâu then chốt; thu hút từ nước ngoài là nhiệm vụ căn bản, lâu dài.","Tuyển dụng là khâu then chốt; đánh giá hằng năm là nhiệm vụ căn bản, lâu dài."],"e":"Quan điểm (3) khẳng định trọng dụng là khâu then chốt, tạo nguồn nhân tài là căn bản, lâu dài; trọng dụng gắn với bố trí đúng sở trường, giao nhiệm vụ lớn, trao quyền tự chủ thực chất, chấp nhận rủi ro có kiểm soát, bảo đảm nguồn lực và điều kiện làm việc. Quan điểm (5) bổ sung: phát hiện, đào tạo, bồi dưỡng và phát triển nhân tài trong nước là nền tảng chiến lược, lâu dài.\nGhi nhớ cặp: trọng dụng = then chốt; tạo nguồn = căn bản, lâu dài.\nVì sao các phương án còn lại chưa đúng: Phương án đãi ngộ là then chốt, thu hút từ nước ngoài là căn bản đảo vai trò: Kết luận coi nhân tài trong nước là nền tảng, còn thu hút người Việt Nam ở nước ngoài và nhân tài quốc tế là hướng “chủ động” bổ sung (quan điểm (5)). Phương án tuyển dụng là then chốt, đánh giá hằng năm là căn bản không có trong Kết luận; quan điểm (3) còn chuyển từ quản lý con người theo tổ chức, biên chế sang quản trị và phát triển nhân tài.","t":"Trọng dụng là khâu then chốt; tạo nguồn là căn bản, lâu dài."},{"s":"E","y":"NH","r":"KL 105-KL/TW · Mục II.2.2, điểm (2)","q":"Đến năm 2030, Kết luận đặt mục tiêu phấn đấu thu hút, trọng dụng khoảng bao nhiêu nhân tài quốc gia gắn với từng nhiệm vụ, chương trình, dự án cụ thể?","o":["Khoảng 1.000 nhân tài quốc gia.","Khoảng 2.000 nhân tài quốc gia.","Khoảng 5.000 nhân tài quốc gia."],"e":"Mục tiêu đến năm 2030, điểm (2): hình thành, vận hành cơ chế xác định, công bố, đặt hàng các nhiệm vụ chiến lược, bài toán lớn cần nhân tài thực hiện; phấn đấu thu hút, trọng dụng khoảng 1.000 nhân tài quốc gia gắn với từng nhiệm vụ, chương trình, dự án cụ thể trong các lĩnh vực khoa học cơ bản, trí tuệ nhân tạo, bán dẫn, lượng tử, khoa học dữ liệu, công nghệ chiến lược, công nghệ mới và các nhiệm vụ chiến lược khác.\nCon số cần nhớ gắn với cơ chế “đặt hàng nhiệm vụ”: nhân tài được trọng dụng gắn với từng nhiệm vụ cụ thể, không phải một danh sách chung.\nVì sao các phương án còn lại chưa đúng: Khoảng 2.000 và khoảng 5.000 nhân tài quốc gia là những con số không có trong Kết luận; văn bản nêu khoảng 1.000 nhân tài quốc gia gắn với từng nhiệm vụ, chương trình, dự án cụ thể.","t":"Đến 2030: khoảng 1.000 nhân tài quốc gia, gắn với nhiệm vụ, chương trình, dự án cụ thể."},{"s":"E","y":"NH","r":"KL 105-KL/TW · Mục II.2.2, điểm (5)","q":"Mục tiêu đến năm 2030 về Chỉ số năng lực cạnh tranh nhân tài toàn cầu của Việt Nam là gì?","o":["Thuộc nhóm 03 nước đứng đầu Đông Nam Á.","Thuộc nhóm 20 quốc gia dẫn đầu thế giới.","Đứng đầu châu Á về Chỉ số năng lực cạnh tranh nhân tài toàn cầu."],"e":"Mục tiêu đến năm 2030, điểm (5): phấn đấu thuộc nhóm 3 nước đứng đầu Đông Nam Á về Chỉ số năng lực cạnh tranh nhân tài toàn cầu.\nPhân biệt hai mốc: 2030 là vị trí trong khu vực (Đông Nam Á); 2045 là vị trí trên thế giới (nhóm 20 quốc gia dẫn đầu).\nVì sao các phương án còn lại chưa đúng: Nhóm 20 quốc gia dẫn đầu thế giới là mục tiêu tầm nhìn đến năm 2045 (mục II.2.3), không phải 2030. Phương án đứng đầu châu Á không có trong Kết luận; văn bản chỉ nêu mốc thuộc nhóm 3 nước đứng đầu Đông Nam Á cho năm 2030.","t":"2030: nhóm 3 nước đứng đầu Đông Nam Á; 2045: nhóm 20 quốc gia dẫn đầu thế giới."},{"s":"E","y":"NH","r":"KL 105-KL/TW · Mục II.2.3","q":"Đến năm 2045, Việt Nam phấn đấu đạt vị trí nào về Chỉ số năng lực cạnh tranh nhân tài toàn cầu?","o":["Thuộc nhóm 20 quốc gia dẫn đầu thế giới.","Thuộc nhóm 03 nước đứng đầu Đông Nam Á.","Thuộc nhóm 10 quốc gia đứng đầu châu Á."],"e":"Mục tiêu đến năm 2045: phấn đấu thuộc nhóm 20 quốc gia dẫn đầu về Chỉ số năng lực cạnh tranh nhân tài toàn cầu và là điểm đến hấp dẫn của nhân tài trong khu vực và trên thế giới. Đi kèm là yêu cầu: có năng lực bảo đảm chủ động nguồn lực nhân tài cho quốc gia phát triển, thu nhập cao; thể chế và hệ thống quản trị nhân tài đạt trình độ tiên tiến, hiện đại, hội nhập quốc tế.\nVì sao các phương án còn lại chưa đúng: Nhóm 3 nước đứng đầu Đông Nam Á là mốc của năm 2030 (mục II.2.2). Nhóm 10 quốc gia đứng đầu châu Á không có trong Kết luận; mục tiêu 2045 được tính trên phạm vi toàn cầu (nhóm 20 quốc gia dẫn đầu), không phải trong phạm vi châu Á.","t":"2045: phấn đấu thuộc nhóm 20 quốc gia dẫn đầu thế giới về Chỉ số năng lực cạnh tranh nhân tài toàn cầu."},{"s":"E","y":"NH","r":"KL 105-KL/TW · Mục III.2; II.2.2, điểm (3)","q":"Nhóm hạ tầng và công cụ số quốc gia về nhân tài được Kết luận xác định gồm những thành phần chủ yếu nào?","o":["Cơ sở dữ liệu quốc gia về nhân tài, hệ thống chỉ số quốc gia về nhân tài, Cổng thông tin quốc gia về nhân tài và các nền tảng số phục vụ quản trị, đánh giá.","Chỉ gồm Cơ sở dữ liệu quốc gia về nhân tài do Trung ương quản lý.","Các cơ sở dữ liệu riêng biệt của từng địa phương, không kết nối và không dùng chung chỉ số đánh giá."],"e":"Mục III.2 yêu cầu xây dựng, vận hành thống nhất, đồng bộ Cơ sở dữ liệu quốc gia, hệ thống chỉ số quốc gia về nhân tài, Cổng thông tin quốc gia về nhân tài, các nền tảng số để phục vụ quản trị nguồn lực nhân tài, đánh giá hiệu quả công tác nhân tài của từng ngành, lĩnh vực, địa phương và trên phạm vi quốc gia. Mục tiêu 2030 (điểm (3)) nêu hoàn thành xây dựng, vận hành đồng bộ hạ tầng số quốc gia về nhân tài, nhất là Cơ sở dữ liệu quốc gia, và hình thành mạng lưới chuyên gia trong nước, quốc tế.\nVì sao các phương án còn lại chưa đúng: Phương án chỉ có cơ sở dữ liệu do Trung ương quản lý thiếu ba thành phần còn lại (hệ thống chỉ số, cổng thông tin, nền tảng số). Phương án cơ sở dữ liệu riêng của từng địa phương, không kết nối, không dùng chung chỉ số trái yêu cầu vận hành “thống nhất, đồng bộ” ở tầm quốc gia.","t":"Hạ tầng số quốc gia: cơ sở dữ liệu + hệ thống chỉ số + cổng thông tin + nền tảng số; thống nhất, đồng bộ."},{"s":"E","y":"NH","r":"KL 105-KL/TW · Mục III.2","q":"Mức ngân sách nhà nước dành cho công tác nhân tài được Kết luận định hướng như thế nào?","o":["Khoảng 0,1% GDP hằng năm trong tổng nguồn lực dành cho khoa học, công nghệ, đổi mới sáng tạo và chuyển đổi số.","Khoảng 0,05% GDP hằng năm, bố trí ngoài nguồn lực dành cho khoa học, công nghệ.","Khoảng 1% GDP hằng năm, phân bổ bình quân cho các bộ, ngành, địa phương."],"e":"Mục III.2 yêu cầu xây dựng cơ chế tài chính đặc thù, linh hoạt, đủ mạnh và bền vững cho thu hút, trọng dụng nhân tài; bố trí ngân sách nhà nước cho công tác nhân tài đạt khoảng 0,1% GDP hằng năm trong tổng nguồn lực dành cho khoa học, công nghệ, đổi mới sáng tạo, chuyển đổi số. Các tỉnh, thành phố tự chủ ngân sách được quyết định mức chi cao hơn, phù hợp nhu cầu và khả năng cân đối.\nNhớ hai điểm: khoảng 0,1% GDP và nằm trong tổng nguồn lực khoa học, công nghệ, đổi mới sáng tạo, chuyển đổi số (không tách riêng ngoài khoản này).\nVì sao các phương án còn lại chưa đúng: Phương án 0,05% GDP bố trí ngoài nguồn lực khoa học, công nghệ sai cả mức lẫn cách tính. Phương án khoảng 1% GDP phân bổ bình quân cho các bộ, ngành, địa phương sai mức và trái yêu cầu tập trung nguồn lực, không phân bổ bình quân, dàn trải (mục III.2).","t":"Ngân sách nhân tài: khoảng 0,1% GDP hằng năm, trong tổng nguồn lực khoa học, công nghệ, đổi mới sáng tạo, chuyển đổi số."},{"s":"E","y":"NH","r":"KL 105-KL/TW · Mục III.3; II.1, quan điểm (3)","q":"Nhân tài phải được đánh giá chủ yếu dựa trên căn cứ nào?","o":["Kết quả thực hiện nhiệm vụ, chất lượng sản phẩm và giá trị tạo ra.","Bằng cấp, học hàm, học vị, chức vụ quản lý và thâm niên công tác.","Vị trí công tác, độ tuổi, cơ quan công tác và số năm giữ chức vụ."],"e":"Mục III.3 xác định đánh giá nhân tài lấy kết quả thực hiện nhiệm vụ, chất lượng sản phẩm và giá trị tạo ra làm thước đo chủ yếu. Phù hợp quan điểm (3): lấy sản phẩm, kết quả và giá trị cống hiến làm thước đo.\nKhác với cách đánh giá cũ nặng về lý lịch, hồ sơ: ở đây đánh giá sau khi có kết quả cụ thể của nhiệm vụ.\nVì sao các phương án còn lại chưa đúng: Bằng cấp, học hàm, học vị, chức vụ quản lý và thâm niên công tác là những tiêu chí mục III.1 loại ra khỏi cách nhận diện nhân tài. Vị trí công tác, độ tuổi, cơ quan công tác và số năm giữ chức vụ cũng không phải căn cứ đánh giá; mục III.2 còn yêu cầu tháo gỡ rào cản về tiêu chuẩn, độ tuổi, thâm niên, quy hoạch, bổ nhiệm không còn phù hợp.","t":"Đánh giá nhân tài theo kết quả nhiệm vụ, chất lượng sản phẩm, giá trị tạo ra."},{"s":"E","y":"NH","r":"KL 105-KL/TW · Mục III.3","q":"Nguyên tắc nào phải được thực hiện nhất quán khi giao nhiệm vụ chiến lược cho nhân tài?","o":["Nhiệm vụ đi liền với người thực hiện, thẩm quyền và nguồn lực.","Giao nhiệm vụ trước, xác định thẩm quyền và nguồn lực sau khi có kết quả bước đầu.","Ưu tiên giao nhiệm vụ theo chức vụ, thâm niên và thứ bậc hành chính."],"e":"Mục III.3 yêu cầu thực hiện nhất quán nguyên tắc nhiệm vụ đi liền với người thực hiện, thẩm quyền và nguồn lực. Việc lựa chọn nhân tài chủ trì nhiệm vụ phải xác định rõ mục tiêu, sản phẩm đầu ra, thời hạn, nguồn lực, đãi ngộ và tiêu chí đánh giá; giao việc xứng tầm, trao thẩm quyền thực chất đi liền với trách nhiệm giải trình.\nCách nhớ: giao nhiệm vụ là phải giao kèm cả người, thẩm quyền và nguồn lực ngay từ đầu.\nVì sao các phương án còn lại chưa đúng: Phương án giao nhiệm vụ trước, xác định thẩm quyền và nguồn lực sau khi có kết quả bước đầu trái nguyên tắc đi liền; thiếu thẩm quyền, nguồn lực thì không thể có “trao quyền tự chủ thực chất, bảo đảm nguồn lực” (quan điểm (3)). Phương án ưu tiên theo chức vụ, thâm niên, thứ bậc hành chính đi ngược nguyên tắc lựa chọn theo yêu cầu nhiệm vụ, đúng người, đúng việc, đúng sở trường.","t":"Nhiệm vụ đi liền với người thực hiện, thẩm quyền và nguồn lực."},{"s":"E","y":"NH","r":"KL 105-KL/TW · Mục III.3; III.2","q":"Kết luận xác định việc phát hiện, giới thiệu, tiến cử nhân tài và sử dụng nhân tài trong khu vực công như thế nào?","o":["Thực hiện từ nhiều nguồn trong và ngoài nước, không phân biệt khu vực công và khu vực tư, không tính vào chỉ tiêu biên chế đối với khu vực công.","Chỉ phát hiện trong khu vực công và phải tính đủ vào chỉ tiêu biên chế.","Chỉ tiếp nhận nhân tài là người Việt Nam ở nước ngoài theo chế độ tuyển dụng đặc biệt."],"e":"Mục III.3 yêu cầu chủ động phát hiện, giới thiệu, tiến cử nhân tài từ nhiều nguồn, trong nước và ngoài nước, không phân biệt khu vực công và khu vực tư, không tính vào chỉ tiêu biên chế đối với khu vực công; chú trọng phát hiện qua thực tiễn, sản phẩm; khen thưởng người tiến cử đúng, xử lý nghiêm hành vi lợi dụng tiến cử để vụ lợi. Mục III.2 cho phép huy động theo hợp đồng chuyên gia, tư vấn, kiêm nhiệm, biệt phái, làm việc theo chương trình, dự án, không nhất thiết đổi nơi ở, nơi làm việc.\nVì sao các phương án còn lại chưa đúng: Phương án chỉ phát hiện trong khu vực công và tính đủ vào chỉ tiêu biên chế trái cả hai ý: “không phân biệt khu vực công và khu vực tư” và “không tính vào chỉ tiêu biên chế”. Phương án chỉ tiếp nhận người Việt Nam ở nước ngoài theo chế độ tuyển dụng đặc biệt thu hẹp quá mức: Kết luận nêu nhiều nguồn, trong và ngoài nước, gồm cả khu vực tư, người Việt Nam ở nước ngoài và chuyên gia quốc tế (mục III.2, III.6).","t":"Nhiều nguồn trong và ngoài nước; không phân biệt công, tư; không tính vào chỉ tiêu biên chế khu vực công."},{"s":"E","y":"NH","r":"KL 105-KL/TW · Mục III.3","q":"Phương thức nào được Kết luận chỉ rõ trong lựa chọn, sử dụng, trọng dụng nhân tài?","o":["Đặt hàng các nhiệm vụ chiến lược, bài toán lớn, chương trình, dự án trọng điểm.","Thông qua tuyển dụng chính thức vào cơ quan nhà nước.","Thông qua hợp đồng lao động không xác định thời hạn và bổ nhiệm chức vụ."],"e":"Mục III.3 chỉ rõ: lấy việc đặt hàng các nhiệm vụ chiến lược, bài toán lớn, chương trình, dự án trọng điểm làm căn cứ để phát hiện, tuyển chọn, giao nhiệm vụ, trọng dụng và đánh giá nhân tài. Đây là “đặt hàng theo nhiệm vụ”: nhiệm vụ có trước, sau đó tìm người phù hợp.\nCũng gắn với mục tiêu 2030 (điểm (2)): hình thành cơ chế xác định, công bố, đặt hàng các nhiệm vụ chiến lược, bài toán lớn.\nVì sao các phương án còn lại chưa đúng: Phương án tuyển dụng chính thức vào cơ quan nhà nước là cách quản lý theo tổ chức, biên chế mà quan điểm (3) muốn chuyển khỏi; mục III.2 còn cho huy động qua hợp đồng chuyên gia, tư vấn, kiêm nhiệm, biệt phái, làm việc theo chương trình, dự án, không nhất thiết gắn với biên chế, chức vụ. Phương án hợp đồng lao động không xác định thời hạn và bổ nhiệm chức vụ cũng không phải phương thức Kết luận nêu: trọng dụng theo nhiệm vụ cụ thể, sản phẩm, kết quả.","t":"Lựa chọn, sử dụng, trọng dụng nhân tài bằng đặt hàng nhiệm vụ chiến lược, bài toán lớn, chương trình, dự án trọng điểm."},{"s":"E","y":"NH","r":"KL 105-KL/TW · Mục III.3","q":"Trong đánh giá kết quả thực hiện nhiệm vụ của nhân tài, Kết luận yêu cầu phân định rõ nội dung nào?","o":["Rủi ro, thất bại khách quan trong nghiên cứu, đổi mới sáng tạo với hành vi thiếu trách nhiệm, gian lận hoặc vụ lợi.","Kết quả của cá nhân với kết quả của tập thể để chỉ xem xét trách nhiệm của người đứng đầu.","Nhiệm vụ có nguồn ngân sách nhà nước với nhiệm vụ do doanh nghiệp tài trợ để áp dụng hai tiêu chuẩn đánh giá khác nhau."],"e":"Mục III.3 yêu cầu phân định rõ rủi ro, thất bại khách quan trong nghiên cứu, đổi mới sáng tạo với hành vi thiếu trách nhiệm, gian lận hoặc vụ lợi; đồng thời kịp thời chấm dứt giao nhiệm vụ và cơ chế, chính sách liên quan khi nhân tài không đáp ứng yêu cầu. Mục III.5 thêm: có cơ chế miễn trừ trách nhiệm hợp lý đối với nhân tài khi gặp rủi ro, thất bại khách quan.\nTinh thần: chấp nhận rủi ro có kiểm soát, nhưng không bao che gian lận, vụ lợi hay thiếu trách nhiệm.\nVì sao các phương án còn lại chưa đúng: Phương án phân định kết quả cá nhân với kết quả tập thể để chỉ xem xét trách nhiệm người đứng đầu không phải nội dung mục III.3 yêu cầu phân định; mục III.1 chỉ nêu người đứng đầu trực tiếp chỉ đạo và chịu trách nhiệm về kết quả phát hiện, trọng dụng nhân tài thuộc phạm vi quản lý. Phương án áp dụng hai tiêu chuẩn đánh giá khác nhau cho nhiệm vụ dùng ngân sách và nhiệm vụ do doanh nghiệp tài trợ cũng không có trong văn bản.","t":"Phân định rủi ro, thất bại khách quan với hành vi thiếu trách nhiệm, gian lận, vụ lợi."},{"s":"E","y":"NH","r":"KL 105-KL/TW · Mục III.4","q":"Cơ chế “Nhân tài dẫn dắt nhân tài” được hiểu đúng là gì?","o":["Thực hiện cố vấn, hướng dẫn, truyền nghề giữa chuyên gia đầu ngành với nhân tài trẻ; xây dựng nhóm chuyên môn, tuyển chọn cộng sự và phát triển đội ngũ kế cận.","Giao toàn bộ việc tuyển chọn nhân tài cho các chuyên gia quốc tế.","Chỉ tổ chức các cuộc thi định kỳ để xếp hạng nhân tài theo từng ngành, lĩnh vực."],"e":"Mục III.4 yêu cầu thiết lập cơ chế “Nhân tài dẫn dắt nhân tài”: thực hiện chế độ cố vấn, hướng dẫn, truyền nghề giữa chuyên gia đầu ngành với nhân tài trẻ; xây dựng cơ chế nhóm chuyên môn, tuyển chọn cộng sự với nhân tài và phát triển đội ngũ kế cận.\nHiểu đơn giản: người tài giỏi đi trước dìu dắt, truyền nghề cho người tài trẻ và được chọn cộng sự để tạo lớp kế cận.\nVì sao các phương án còn lại chưa đúng: Phương án giao toàn bộ việc tuyển chọn nhân tài cho chuyên gia quốc tế đi ngược nguyên tắc công tác nhân tài đặt dưới sự lãnh đạo thống nhất, toàn diện của Đảng và Nhà nước kiến tạo thể chế (quan điểm (4)); hợp tác quốc tế (mục III.6) chỉ là cố vấn, chủ trì nhiệm vụ, đào tạo, không thay thế vai trò này. Phương án chỉ tổ chức cuộc thi định kỳ để xếp hạng chỉ là một cách xếp hạng, không phải cơ chế cố vấn, truyền nghề, chọn cộng sự và phát triển kế cận mà Kết luận nêu.","t":"“Nhân tài dẫn dắt nhân tài”: cố vấn, hướng dẫn, truyền nghề; nhóm chuyên môn, chọn cộng sự; phát triển đội ngũ kế cận."},{"s":"E","y":"NH","r":"KL 105-KL/TW · Mục IV.4; III.1","q":"Cơ quan nào được giao chủ trì điều phối thống nhất công tác nhân tài ở tầm quốc gia?","o":["Đảng ủy Chính phủ.","Đảng ủy Quốc hội.","Ban Tuyên giáo Trung ương."],"e":"Mục IV.4 giao Đảng ủy Chính phủ chủ trì điều phối thống nhất công tác nhân tài ở tầm quốc gia; tham mưu sửa đổi, bổ sung quy định của Đảng về công tác cán bộ, nhân tài và pháp luật có liên quan; xác định, cập nhật danh mục ngành, lĩnh vực mũi nhọn, bài toán lớn; bố trí, huy động, điều phối nguồn lực, xây dựng hạ tầng dữ liệu và công cụ quản trị nhân tài quốc gia. Mục III.1 yêu cầu xác định rõ đầu mối điều phối thống nhất, theo nguyên tắc một việc chỉ giao một cơ quan chủ trì, chịu trách nhiệm đến cùng.\nVì sao các phương án còn lại chưa đúng: Đảng ủy Quốc hội được giao lãnh đạo, chỉ đạo rà soát, bổ sung nhiệm vụ lập pháp, ban hành nghị quyết của Quốc hội về cơ chế, chính sách đặc biệt và tăng cường giám sát (mục IV.3), không phải điều phối chung. Ban Tuyên giáo Trung ương chủ trì, phối hợp với Đảng ủy Chính phủ hướng dẫn, quán triệt, tuyên truyền Kết luận (mục IV.6), không phải điều phối công tác nhân tài.","t":"Đảng ủy Chính phủ chủ trì điều phối thống nhất công tác nhân tài ở tầm quốc gia."},{"s":"F","y":"NH","r":"KL 106-KL/TW · Mục II.1","q":"Hội nghị lần thứ tư Ban Chấp hành Trung ương Đảng khóa XIV xác định năm 2027 là năm như thế nào?","o":["Năm tăng tốc, bứt phá, tạo đà, tạo thế, tạo lực để thực hiện thắng lợi Nghị quyết Đại hội XIV của Đảng.","Năm bản lề, tạo nền tảng cho cả giai đoạn phát triển 2026 - 2030.","Năm củng cố, ổn định, tạo tiền đề cho giai đoạn tăng tốc từ năm 2028."],"e":"Mục II.1 của Kết luận 106-KL/TW xác định năm 2027 là năm tăng tốc, bứt phá, tạo đà, tạo thế, tạo lực để thực hiện thắng lợi Nghị quyết Đại hội XIV của Đảng.\nĐây là năm thứ hai của nhiệm kỳ Đại hội XIV, nên yêu cầu đặt ra là chuyển từ chuẩn bị sang bứt tốc. Mục tiêu tăng trưởng từ 10% trở lên và các chỉ tiêu khác trong Kết luận đều phục vụ tinh thần này.\nVì sao các phương án còn lại chưa đúng: Cách gọi “năm bản lề” hay “năm củng cố, ổn định” nghe quen nhưng không phải cách Kết luận nêu; Kết luận cũng không đặt mốc “tăng tốc từ năm 2028”. Tinh thần của Kết luận là hành động mạnh ngay trong năm 2027, không phải củng cố hay chờ đến năm sau.","t":"Năm 2027: tăng tốc, bứt phá, tạo đà, tạo thế, tạo lực."},{"s":"F","y":"NH","r":"KL 106-KL/TW · Mục II.2.12","q":"Mục tiêu tăng trưởng kinh tế năm 2027 được Trung ương thống nhất là:","o":["Phấn đấu tăng trưởng từ 10% trở lên, gắn với giữ vững ổn định kinh tế vĩ mô, kiểm soát lạm phát, bảo đảm các cân đối lớn.","Phấn đấu tăng trưởng khoảng 8,5%, ưu tiên giữ vững ổn định kinh tế vĩ mô.","Phấn đấu tăng trưởng từ 10% trở lên, chấp nhận lạm phát cao hơn mục tiêu để hỗ trợ tăng trưởng."],"e":"Mục II.2.12 của Kết luận 106-KL/TW thống nhất mục tiêu năm 2027: phấn đấu tăng trưởng kinh tế từ 10% trở lên, gắn với giữ vững ổn định kinh tế vĩ mô, kiểm soát lạm phát, bảo đảm các cân đối lớn.\nĐiểm cần nhớ là hai vế đi cùng nhau: tăng trưởng cao nhưng không đánh đổi bằng mất ổn định vĩ mô hay để lạm phát vượt tầm kiểm soát.\nVì sao các phương án còn lại chưa đúng: Mức khoảng 8,5% thấp hơn mục tiêu Kết luận đặt ra. Phương án “chấp nhận lạm phát cao hơn mục tiêu để hỗ trợ tăng trưởng” trái với yêu cầu kiểm soát lạm phát và giữ ổn định vĩ mô; dù cùng nêu mức 10% trở lên, vế đi kèm lại sai.","t":"2027: tăng trưởng từ 10% trở lên, đi cùng ổn định vĩ mô, kiểm soát lạm phát, bảo đảm các cân đối lớn."},{"s":"F","y":"NH","r":"KL 106-KL/TW · Mục II.1","q":"Trung ương xác định những yếu tố nào được lấy làm thước đo cho sự phát triển?","o":["Hiệu quả thực chất, năng suất và đời sống của Nhân dân.","Quy mô GDP, tốc độ tăng thu ngân sách nhà nước và tỷ lệ giải ngân vốn đầu tư công.","Số dự án đầu tư được phê duyệt, tổng vốn đầu tư toàn xã hội và kim ngạch xuất khẩu."],"e":"Mục II.1 của Kết luận 106-KL/TW lấy hiệu quả thực chất, năng suất và đời sống của Nhân dân làm thước đo cho sự phát triển.\nTức là không chỉ nhìn vào quy mô hay tốc độ, mà nhìn vào chất lượng thật của tăng trưởng và việc đời sống người dân có được cải thiện hay không. Cách tiếp cận này cùng tinh thần với việc lấy sự hài lòng, niềm tin của Nhân dân làm thước đo ở các văn bản khác của Hội nghị.\nVì sao các phương án còn lại chưa đúng: Quy mô GDP, tăng thu ngân sách, tỷ lệ giải ngân đầu tư công, số dự án được phê duyệt, tổng vốn đầu tư hay kim ngạch xuất khẩu đều là chỉ số quy mô, số lượng. Chúng có thể là chỉ tiêu theo dõi, nhưng không phải thước đo phát triển mà Kết luận xác định.","t":"Thước đo phát triển: hiệu quả thực chất, năng suất và đời sống của Nhân dân."},{"s":"F","y":"NH","r":"KL 106-KL/TW · Mục II.2.12","q":"Trung ương xác định tốc độ tăng chỉ số giá tiêu dùng (CPI) bình quân năm 2027 ở mức:","o":["Khoảng 4,5%.","Khoảng 3,5%.","Khoảng 5,5%."],"e":"Mục II.2.12 của Kết luận 106-KL/TW đặt chỉ tiêu tốc độ tăng chỉ số giá tiêu dùng (CPI) bình quân năm 2027 khoảng 4,5%.\nCPI phản ánh mức tăng giá của hàng hóa, dịch vụ mà người dân tiêu dùng. Chỉ tiêu này đi cùng mục tiêu tăng trưởng từ 10% trở lên: tăng trưởng cao phải gắn với kiểm soát lạm phát.\nVì sao các phương án còn lại chưa đúng: Các mức khoảng 3,5% và khoảng 5,5% đều không phải chỉ tiêu được Kết luận nêu. Cần nhớ cặp số: tăng trưởng từ 10% trở lên và CPI khoảng 4,5%.","t":"2027: CPI khoảng 4,5%; GDP từ 10% trở lên."},{"s":"F","y":"NH","r":"KL 106-KL/TW · Mục II.2.1; II.2.12","q":"Trung ương đồng ý phấn đấu thu ngân sách nhà nước năm 2027 tăng khoảng bao nhiêu so với thực hiện năm 2026?","o":["Khoảng 9,1%.","Khoảng 12%.","Khoảng 15%."],"e":"Mục II.2.1 của Kết luận 106-KL/TW yêu cầu phấn đấu thu ngân sách nhà nước năm 2027 tăng khoảng 9,1% so với thực hiện năm 2026.\nĐây là mục tiêu phấn đấu về thu, đi cùng yêu cầu tiết kiệm chi ngay từ khi phân bổ dự toán (câu sau) để bảo đảm cân đối ngân sách.\nVì sao các phương án còn lại chưa đúng: Các mức khoảng 12% và khoảng 15% không phải mức Kết luận nêu. Đừng nhầm với các chỉ tiêu khác của năm 2027 như tăng trưởng GDP từ 10% trở lên hay CPI khoảng 4,5%.","t":"2027: thu ngân sách phấn đấu tăng khoảng 9,1% so với năm 2026."},{"s":"F","y":"NH","r":"KL 106-KL/TW · Mục II.2.5","q":"Trung ương yêu cầu tạo đột phá thực chất, chuyển mạnh sang tạo sản phẩm, kết quả và giá trị cụ thể, lượng hóa đóng góp vào tăng trưởng đối với lĩnh vực nào?","o":["Khoa học, công nghệ, đổi mới sáng tạo, chuyển đổi số.","Mở rộng tín dụng và tăng mạnh vốn đầu tư công.","Khai thác tài nguyên và thu hút vốn đầu tư nước ngoài."],"e":"Mục II.2.5 của Kết luận 106-KL/TW yêu cầu tạo đột phá thực chất về khoa học, công nghệ, đổi mới sáng tạo, chuyển đổi số theo Nghị quyết số 57-NQ/TW; chuyển mạnh sang tạo ra sản phẩm, kết quả và giá trị cụ thể, lượng hóa được đóng góp vào tăng trưởng.\nTinh thần là không dừng ở phong trào, đề án hay báo cáo, mà phải chỉ ra được sản phẩm và mức đóng góp thật cho tăng trưởng.\nVì sao các phương án còn lại chưa đúng: Mở rộng tín dụng, tăng vốn đầu tư công, khai thác tài nguyên và thu hút vốn đầu tư nước ngoài là các nguồn lực, động lực truyền thống. Chúng không phải lĩnh vực mà Kết luận yêu cầu tạo đột phá thực chất và lượng hóa đóng góp như trên.","t":"Khoa học, công nghệ, đổi mới sáng tạo, chuyển đổi số: tạo sản phẩm cụ thể, lượng hóa đóng góp vào tăng trưởng."},{"s":"F","y":"NH","r":"KL 106-KL/TW · Mục II.2.12","q":"Trong dự toán ngân sách nhà nước năm 2027, Trung ương yêu cầu tiết kiệm ngay khi phân bổ ngân sách từ đầu năm như thế nào?","o":["Tiết kiệm 5% chi đầu tư công để bổ sung cho các dự án trọng điểm, cấp thiết và 10% chi thường xuyên (ngoài tiết kiệm tạo nguồn cải cách tiền lương, các khoản chi lương, có tính chất tiền lương và các khoản chi cho con người) để bổ sung nguồn chi an sinh xã hội.","Tiết kiệm 10% chi đầu tư công để bổ sung dự phòng ngân sách và 5% chi thường xuyên để bổ sung nguồn cải cách tiền lương.","Tiết kiệm 5% chi thường xuyên để bổ sung cho các dự án trọng điểm, cấp thiết, không tiết kiệm chi đầu tư công."],"e":"Mục II.2.12 của Kết luận 106-KL/TW yêu cầu khi lập và phân bổ dự toán ngân sách nhà nước năm 2027 phải tiết kiệm ngay từ đầu năm: 5% chi đầu tư công, dùng bổ sung cho các dự án trọng điểm, cấp thiết; và 10% chi thường xuyên, dùng bổ sung nguồn chi an sinh xã hội.\nPhần 10% chi thường xuyên tính ngoài khoản tiết kiệm tạo nguồn cải cách tiền lương và ngoài các khoản chi lương, chi có tính chất tiền lương, chi cho con người. Cách nhớ: 5 gắn với đầu tư công, 10 gắn với chi thường xuyên.\nVì sao các phương án còn lại chưa đúng: Phương án đảo tỷ lệ (10% đầu tư công, 5% chi thường xuyên) và đổi mục đích sang dự phòng ngân sách là sai. Phương án chỉ tiết kiệm chi thường xuyên và “không tiết kiệm chi đầu tư công” bỏ sót yêu cầu tiết kiệm 5% chi đầu tư công.","t":"Tiết kiệm từ đầu năm: 5% chi đầu tư công (cho dự án trọng điểm, cấp thiết); 10% chi thường xuyên (cho an sinh xã hội)."},{"s":"F","y":"NH","r":"KL 106-KL/TW · Mục II.2.12","q":"Về quy định tỷ lệ phần trăm (%) bố trí chi ngân sách nhà nước cho các ngành, lĩnh vực, Trung ương xác định:","o":["Không ban hành thêm các quy định về tỷ lệ % bố trí chi ngân sách nhà nước cho các ngành, lĩnh vực.","Bổ sung quy định tỷ lệ chi tối thiểu cho các lĩnh vực ưu tiên.","Giao các địa phương tự quy định tỷ lệ chi cho từng lĩnh vực."],"e":"Theo mục II.2.12 Kết luận 106-KL/TW, về tỷ lệ phần trăm bố trí chi ngân sách nhà nước cho các ngành, lĩnh vực, Trung ương xác định không ban hành thêm các quy định mới.\nNói cách khác, không đặt thêm “tỷ lệ cứng” cho từng ngành, lĩnh vực; việc bố trí chi dựa trên yêu cầu nhiệm vụ, hiệu quả và khả năng cân đối ngân sách.\nVì sao các phương án còn lại chưa đúng: Phương án bổ sung tỷ lệ chi tối thiểu cho các lĩnh vực ưu tiên đi ngược hướng này. Phương án giao các địa phương tự quy định tỷ lệ chi cho từng lĩnh vực cũng không phải nội dung Kết luận nêu.","t":"Không ban hành thêm quy định về tỷ lệ % bố trí chi ngân sách cho các ngành, lĩnh vực."},{"s":"F","y":"NH","r":"KL 106-KL/TW · Mục II.2.2","q":"Theo chỉ đạo của Trung ương, trách nhiệm trực tiếp chỉ đạo xử lý dứt điểm nhà, đất dôi dư của địa phương thuộc về ai?","o":["Bí thư Tỉnh ủy, Thành ủy.","Chủ tịch Ủy ban Nhân dân cấp xã.","Giám đốc Sở Tài chính."],"e":"Mục II.2.2 của Kết luận 106-KL/TW giao Bí thư Tỉnh ủy, Thành ủy trực tiếp lãnh đạo, chỉ đạo bảo đảm hoàn thành xử lý dứt điểm các cơ sở nhà, đất dôi dư của địa phương.\nĐặt trách nhiệm ở người đứng đầu cấp ủy địa phương nhằm tránh tình trạng giao chung chung, không ai chịu trách nhiệm đến cùng.\nVì sao các phương án còn lại chưa đúng: Chủ tịch Ủy ban nhân dân cấp xã và Giám đốc Sở Tài chính không phải đối tượng Kết luận nêu là người trực tiếp chỉ đạo xử lý dứt điểm. Sở Tài chính là cơ quan chuyên môn, còn cấp xã là cấp thực hiện; trách nhiệm lãnh đạo, chỉ đạo thuộc người đứng đầu cấp ủy tỉnh, thành phố.","t":"Nhà, đất dôi dư: Bí thư Tỉnh ủy, Thành ủy trực tiếp lãnh đạo, chỉ đạo xử lý dứt điểm."},{"s":"F","y":"NH","r":"KL 106-KL/TW · Mục II.2.12","q":"Trong trường hợp có biến động hoặc ban hành thêm chính sách tác động tới thu ngân sách nhà nước, Trung ương cho phép đánh giá việc hoàn thành nhiệm vụ tài chính - ngân sách nhà nước năm 2027 của Trung ương và địa phương theo cách nào?","o":["Theo dự toán điều chỉnh.","Theo dự toán Quốc hội quyết định từ đầu năm, không điều chỉnh trong năm.","Theo số thực hiện năm 2026 cộng mức tăng thu dự kiến."],"e":"Mục II.2.12 của Kết luận 106-KL/TW cho phép: khi có biến động hoặc ban hành thêm chính sách tác động tới thu ngân sách nhà nước, việc đánh giá hoàn thành nhiệm vụ tài chính - ngân sách nhà nước năm 2027 của Trung ương và địa phương được thực hiện theo dự toán điều chỉnh đúng thẩm quyền.\nChữ “đúng thẩm quyền” quan trọng: chỉ dự toán được điều chỉnh theo đúng thẩm quyền mới được dùng làm căn cứ đánh giá.\nVì sao các phương án còn lại chưa đúng: Phương án “theo dự toán Quốc hội quyết định từ đầu năm, không điều chỉnh trong năm” bỏ qua trường hợp có biến động, trái với nội dung cho phép điều chỉnh. Phương án “số thực hiện năm 2026 cộng mức tăng thu dự kiến” không phải căn cứ đánh giá mà Kết luận nêu.","t":"Có biến động chính sách thu: đánh giá hoàn thành nhiệm vụ theo dự toán điều chỉnh đúng thẩm quyền."}]};

function tone(f,t0,d,type,vol,f2){var c=actx();if(!c)return;try{var o=c.createOscillator(),g=c.createGain(),t=c.currentTime+t0;o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.18,t+0.015);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+0.03)}catch(e){}}

 else if(k==='bad'){tone(220,0,0.16,'sawtooth',0.1,160);tone(160,0.14,0.26,'sawtooth',0.1,110)}
 else if(k==='win'){[523.25,659.25,783.99,1046.5].forEach(function(f,i){tone(f,i*0.13,0.22,'triangle',0.2)});tone(1046.5,0.55,0.5,'sine',0.18)}
 else if(k==='end'){tone(392,0,0.2,'triangle',0.16);tone(330,0.18,0.2,'triangle',0.16);tone(262,0.36,0.35,'triangle',0.16)}}

function readProg(m){var raw=ls(pk(m));if(!raw)return null;try{var d=JSON.parse(raw);if(!d||d.v!==1||!Array.isArray(d.idx)||!d.idx.length||d.idx.length!==d.p.length)return null;
 for(var n=0;n<d.idx.length;n++){var b=BANK[d.idx[n]];if(!b||!Array.isArray(d.p[n])||d.p[n].length!==b.o.length)return null;if(d.p[n].slice().sort(function(x,y){return x-y}).join()!==b.o.map(function(_,k){return k}).join())return null}
 var ans={};Object.keys(d.ans||{}).forEach(function(k){var v=d.ans[k];if(+k>=0&&+k<d.idx.length&&v>=0&&v<d.p[+k].length)ans[k]=v});
 d.ans=ans;d.flag=d.flag||{};d.cur=Math.min(Math.max(+d.cur||0,0),d.idx.length-1);d.el=Math.max(0,+d.el||0);d.mode=m==='exam'?'exam':'learn';return d}catch(e){return null}}

function compute(){
 var n=S.qs.length,c=0,bl=0,th={},ty={};
 S.qs.forEach(function(q,k){var a=S.ans[k],ok=a!==undefined&&q.opts[a].ok;if(a===undefined)bl++;if(ok)c++;
  [[th,q.b.s],[ty,q.b.y]].forEach(function(p){var m=p[0],key=p[1];m[key]=m[key]||{n:0,c:0};m[key].n++;if(ok)m[key].c++})});
 return {n:n,c:c,bl:bl,wr:n-c-bl,score:Math.round(c*100/n)/10,th:th,ty:ty};
}
function commentary(r){
 var out=[],weak=[],bestK=null,bp=-1;
 Object.keys(r.th).forEach(function(k){var p=pct(r.th[k].c,r.th[k].n);if(p<70)weak.push(THEMES[k].t+' ('+THEMES[k].d+')');if(p>bp){bp=p;bestK=k}});
 if(r.c===r.n)out.push('Bạn trả lời đúng toàn bộ các tình huống.');

 var qs=(d.q||[]).filter(function(x){return x.n>=1}).map(function(x){return {i:x.i,p:pct(x.c,x.n),n:x.n}}).sort(function(a,b){return a.p-b.p||b.n-a.n}).slice(0,8);
 if(qs.length){h+='<div class="sec"><div class="sec-t">Những câu nhiều người trả lời sai nhất</div><ul class="hq">';qs.forEach(function(x){var b=BANK[x.i];if(!b)return;h+='<li><b>'+x.p+'% đúng</b> · '+esc(b.r)+' — '+esc(b.q)+'<br><span style="color:var(--muted)">'+esc(b.e)+'</span></li>'});h+='</ul></div>'}
 h+='<p class="best">Số liệu ẩn danh, cập nhật lúc '+esc(new Date(d.updated).toLocaleString('vi-VN'))+'.</p></div>';
 return h;
}
function render_(){
 var h=S===null||S.view==='start'?viewStart():S.view==='quiz'?viewQuiz():S.view==='stats'?viewStats():viewResult();
 app.innerHTML=h;
 if(S&&S.view==='stats'){setTimeout(function(){var ms=document.querySelectorAll('.mbar i');for(var i=0;i<ms.length;i++)ms[i].style.width=ms[i].getAttribute('data-w')+'%'},30)}
 if(S&&S.view==='result'){
  var r=S.res,fg=document.getElementById('rfg'),rn=document.getElementById('rn');
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  setTimeout(function(){if(fg)fg.style.strokeDashoffset=String(326.7*(1-r.score/10));var ms=document.querySelectorAll('.mbar i');for(var i=0;i<ms.length;i++)ms[i].style.width=ms[i].getAttribute('data-w')+'%'},30);
  if(reduce){rn.textContent=String(Math.round(r.score*10))}else{var t0=performance.now();(function step(t){var p=Math.min(1,(t-t0)/1000);rn.textContent=String(Math.round(r.score*10*p));if(p<1)requestAnimationFrame(step);else rn.textContent=String(Math.round(r.score*10))})(t0)}
 }
}
function finish(){
 clearInterval(timer);S.el=Math.floor((Date.now()-S.t0)/1000);S.res=compute();S.view='result';S.confirm=false;clearProg(S.mode);
 if(S.qs.length===BANK.length){var g=gradeOf(S.res.score);if(!best||S.res.score>best.s){best={s:S.res.score,g:g.name};ls('qdnq_best',JSON.stringify(best))}}
 if(S.qs.length===BANK.length&&ENDPOINT){var th={},ty={};['th','ty'].forEach(function(w){var src=S.res[w],dst=w==='th'?th:ty;Object.keys(src).forEach(function(k){dst[k]=[src[k].c,src[k].n]})});
  send({t:'result',mode:S.mode,score:S.res.score,c:S.res.c,n:S.res.n,secs:S.el,q:S.qs.map(function(q,k){var a=S.ans[k];return [q.i,a===undefined?-1:(q.opts[a].ok?1:0)]}),th:th,ty:ty});S.sent=true}
 sfx(S.res.score>=5?'win':'end');render();window.scrollTo(0,0);
}
function pick(j){
 var k=S.cur;if(S.mode==='learn'&&S.ans[k]!==undefined)return;
 if(S.mode==='exam'&&S.ans[k]===j){delete S.ans[k];sfx('tick')}else{S.ans[k]=j;sfx(S.mode==='learn'?(S.qs[k].opts[j].ok?'ok':'bad'):'tick')}
 render();
}
function goto(i){if(i<0||i>=S.qs.length)return;S.cur=i;render();window.scrollTo(0,0)}
app.addEventListener('click',function(e){
 var el=e.target.closest('[data-act]');if(!el)return;var a=el.getAttribute('data-act');
 if(a==='snd')return toggleSnd();
 if(a==='theme')return toggleTheme();
 if(a==='mode'){mode=el.getAttribute('data-m');askRestart=false;return render()}
 if(a==='rs_no'){askRestart=false;return render()}
 if(a==='rs_ok'){askRestart=false;clearProg(mode);return newSession(mode,BANK.map(function(_,i){return i}))}
 if(a==='stats')return loadStats();
 if(a==='resume'){var rd=readProg(mode);if(!rd){S=null;return render()}return newSession(rd.mode,rd.idx,rd)}
 if(a==='start'&&readProg(mode)){askRestart=true;return render()}
 if(a==='start')return newSession(mode,BANK.map(function(_,i){return i}));
 if(a==='home'){if(S&&S.view==='quiz')saveProg();clearInterval(timer);S=null;render();return window.scrollTo(0,0)}
 if(!S)return;
 if(a==='opt')return pick(+el.getAttribute('data-j'));
 if(a==='go')return goto(+el.getAttribute('data-i'));
 if(a==='prev')return goto(S.cur-1);
 if(a==='next'){if(S.cur===S.qs.length-1){S.confirm=true;return render()}return goto(S.cur+1)}
 if(a==='flag'){S.flag[S.cur]=!S.flag[S.cur];return render()}
 if(a==='submit'){S.confirm=true;return render()}
 if(a==='cancel'){S.confirm=false;return render()}
 if(a==='confirm')return finish();
 if(a==='filter'){S.filter=el.getAttribute('data-f');return render()}
 if(a==='again')return newSession(S.mode,BANK.map(function(_,i){return i}));
 if(a==='redo'){var idx=[];S.qs.forEach(function(q,k){var x=S.ans[k];if(!(x!==undefined&&q.opts[x].ok))idx.push(q.i)});return newSession('learn',idx)}
});
document.addEventListener('keydown',function(e){
 if(!S||S.view!=='quiz'||e.ctrlKey||e.metaKey||e.altKey)return;
 var k=e.key.toLowerCase();
 if(k.length===1){var j='abcd'.indexOf(k);if(j<0)j='1234'.indexOf(k);if(j>=0&&j<S.qs[S.cur].opts.length&&!S.confirm){pick(j)}return}
 if(S.confirm)return;
 if(k==='arrowright')goto(S.cur+1);else if(k==='arrowleft')goto(S.cur-1);else if(k==='enter'&&S.mode==='learn'&&S.ans[S.cur]!==undefined&&S.cur<S.qs.length-1)goto(S.cur+1);
});
function flush(){if(S&&S.view==='quiz'){S.el=Math.floor((Date.now()-S.t0)/1000);saveProg()}}
document.addEventListener('visibilitychange',function(){if(document.hidden)flush()});window.addEventListener('pagehide',flush);
theme();pingVisit();
var bt=document.getElementById('boot');if(bt)bt.parentNode.removeChild(bt);
render();
})();
</script>
</body>
</html>
