<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Trắc nghiệm Hội nghị Trung ương 4 khóa XIV</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#B3171F">
<meta name="color-scheme" content="light dark">
<style>
:root{--bg:#F3F5F9;--card:#FFFFFF;--card2:#F4F6FA;--line:#DCE2EB;--ink:#15202E;--muted:#5B6B7E;
--red:#B3171F;--red-h:#8E1218;--red-bg:#FCEBEC;--gold:#F2B205;--gold-h:#D99F00;--gold-ink:#3A2A00;--gold-bg:#FFF3C9;--gold-tx:#6B4B00;
--ok:#157A47;--ok-bg:#E2F5EA;--bad:#C0281F;--bad-bg:#FDE9E7;--blue:#2F6FDE;--band:#7E0F15;--cream:#F6D5D7;--shadow:0 6px 24px rgba(21,32,46,.08)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D1420;--card:#162131;--card2:#1C2A3D;--line:#2B3B52;--ink:#EAF0F8;--muted:#9DB0C6;
--red:#E5484D;--red-h:#C93A40;--red-bg:#3A1D24;--gold:#F5C547;--gold-h:#E2B23A;--gold-ink:#2B1F00;--gold-bg:#3A3010;--gold-tx:#F5D77A;
--ok:#5FD39A;--ok-bg:#123626;--bad:#FF8A80;--bad-bg:#40191A;--blue:#6AA2FF;--band:#3B070C;--cream:#F1C9CC;--shadow:0 6px 24px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#0D1420;--card:#162131;--card2:#1C2A3D;--line:#2B3B52;--ink:#EAF0F8;--muted:#9DB0C6;
--red:#E5484D;--red-h:#C93A40;--red-bg:#3A1D24;--gold:#F5C547;--gold-h:#E2B23A;--gold-ink:#2B1F00;--gold-bg:#3A3010;--gold-tx:#F5D77A;
--ok:#5FD39A;--ok-bg:#123626;--bad:#FF8A80;--bad-bg:#40191A;--blue:#6AA2FF;--band:#3B070C;--cream:#F1C9CC;--shadow:0 6px 24px rgba(0,0,0,.4)}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;line-height:1.5;font-size:16px}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
.banner{position:relative;background:var(--band)}
.banner img{display:block;width:100%;height:max(23.6vw,min(42vh,33.7vw));object-fit:cover;object-position:top}
.credit{background:var(--band);color:var(--cream);text-align:center;padding:10px max(16px,env(safe-area-inset-left));font-size:13px;line-height:1.45;letter-spacing:.02em;border-top:3px solid var(--gold)}
.credit b{color:#fff;font-weight:700}
.credit span{display:block}
@media(min-width:760px){.credit span{display:inline}.credit span+span:before{content:"  ·  "}}
.tbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:inline-flex;align-items:center;justify-content:center;font-size:18px;box-shadow:var(--shadow)}
.banner .tbtn.snd{right:calc(max(10px,env(safe-area-inset-right)) + 48px)}
.banner .tbtn{position:absolute;top:max(10px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));background:rgba(255,255,255,.85);color:#222;border-color:transparent}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:20px}
.hero{margin-top:-1px;padding:26px 0 8px}
h1{font-size:clamp(22px,4.6vw,34px);line-height:1.2;margin:0 0 6px;color:var(--red);letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 18px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:18px}
@media(min-width:700px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;border-left:4px solid var(--gold)}
.stat b{display:block;font-size:26px;line-height:1.1;color:var(--red)}
.stat small{color:var(--muted)}
.modes{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;margin-bottom:16px}
@media(min-width:700px){.modes{grid-template-columns:repeat(2,minmax(0,1fr))}}
.mode{text-align:left;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px 16px;display:block;width:100%}
.mode.on{border-color:var(--red);background:var(--red-bg)}
.mode h3{margin:0 0 4px;font-size:17px}
.mode p{margin:0;color:var(--muted);font-size:14px}
.go{display:block;width:100%;background:var(--gold);color:var(--gold-ink);border:0;border-radius:14px;padding:15px 20px;font-size:18px;font-weight:800;box-shadow:0 6px 0 var(--gold-h);transition:transform .08s,box-shadow .08s}
.go:hover{background:var(--gold-h)}
.go:active{transform:translateY(4px);box-shadow:0 2px 0 var(--gold-h)}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 16px;font-weight:600}
.btn:hover{border-color:var(--red);color:var(--red)}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff}
.btn.pri:hover{background:var(--red-h);color:#fff}
.btn[disabled]{opacity:.45;cursor:default}
.best{margin:12px 0 0;text-align:center;color:var(--muted);font-size:14px}
details{margin-top:16px}
summary{cursor:pointer;font-weight:700;padding:12px 16px;background:var(--card);border:1px solid var(--line);border-radius:12px}
.refs{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:8px}
.refs li{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:14px}
.refs b{color:var(--red)}
.ladder{margin:22px 0 40px}
.ladder h2,.sec-t{font-size:18px;margin:0 0 10px}
.lad{display:grid;gap:8px}
.lad div{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:14px}
.lad b{min-width:84px;color:var(--red)}
.lad em{font-style:normal;color:var(--muted)}
/* quiz */
.bar{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 0;padding-top:max(10px,env(safe-area-inset-top))}
.bar .wrap{display:flex;align-items:center;gap:10px}
.bar .mid{flex:1;min-width:0}
.bar .t1{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.prog{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:4px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--gold));border-radius:99px;transition:width .3s}
.qlay{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;padding:18px 0 24px}
@media(min-width:900px){.qlay{grid-template-columns:minmax(0,1fr) 280px;align-items:start}.side{position:sticky;top:76px}}
.qtags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tag{font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--card2);border:1px solid var(--line);color:var(--muted)}
.tag.red{background:var(--red-bg);color:var(--red);border-color:transparent}
.qtext{font-size:clamp(17px,2.4vw,20px);font-weight:700;line-height:1.4;margin:0 0 14px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 14px;transition:border-color .12s,background .12s}
.opt:hover:not([disabled]){border-color:var(--red)}
.opt .k{flex:none;width:30px;height:30px;border-radius:50%;background:var(--card2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.opt .tx{flex:1;min-width:0;overflow-wrap:anywhere}
.opt.sel{border-color:var(--red);background:var(--red-bg)}
.opt.sel .k{background:var(--red);color:#fff;border-color:var(--red)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.ok .k{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt.bad .k{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt[disabled]{cursor:default}
.exp{margin-top:14px;border-radius:14px;padding:14px 16px;border:1px solid var(--line);background:var(--card2);font-size:15px}
.exp.ok{background:var(--ok-bg);border-color:var(--ok)}
.exp.bad{background:var(--bad-bg);border-color:var(--bad)}
.exp h4{margin:0 0 6px;font-size:15px}.exp p{margin:0 0 8px;line-height:1.6}.exp p:last-child{margin-bottom:0}.exp p.why{opacity:.82;font-size:14px;border-top:1px dashed var(--line);padding-top:8px;margin-top:10px}.exp p.pk{font-size:14px}
.exp.ok h4{color:var(--ok)}.exp.bad h4{color:var(--bad)}
.tip{margin-top:10px;background:var(--gold-bg);color:var(--gold-tx);border-left:5px solid var(--gold);border-radius:10px;padding:10px 14px;font-size:15px}
.tip b{letter-spacing:.06em;font-size:12px;display:block;margin-bottom:2px}
.nav{position:sticky;bottom:0;z-index:15;background:var(--bg);border-top:1px solid var(--line);padding:10px 0;padding-bottom:max(10px,env(safe-area-inset-bottom))}
.nav .wrap{display:flex;gap:10px}
.nav .btn{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.gn{height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:700;font-size:14px;padding:0;position:relative}
.gn.cur{outline:3px solid var(--gold)}
.gn.done{background:var(--red);border-color:var(--red);color:#fff}
.gn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.gn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.gn.fl:after{content:"⚑";position:absolute;top:-6px;right:-3px;font-size:13px;color:var(--gold)}
.legend{font-size:12px;color:var(--muted);margin-top:10px}
.flagb{font-size:13px;padding:6px 12px;border-radius:99px}
.flagb.on{background:var(--gold-bg);border-color:var(--gold);color:var(--gold-tx)}
/* modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.ov .card{max-width:420px;width:100%}
.ov h3{margin:0 0 8px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.row .btn{flex:1}
/* result */
.rtop{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;align-items:center;text-align:center}
@media(min-width:760px){.rtop{grid-template-columns:200px minmax(0,1fr);text-align:left}}
.ring{position:relative;width:180px;height:180px;margin:0 auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .tr{fill:none;stroke:var(--line);stroke-width:12}
.ring .fg{fill:none;stroke:var(--red);stroke-width:12;stroke-linecap:round;stroke-dasharray:326.7;stroke-dashoffset:326.7;transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)}
.ring .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .num b{font-size:40px;line-height:1;color:var(--red)}
.ring .num small{color:var(--muted)}
.gb{display:inline-block;background:var(--gold);color:var(--gold-ink);font-weight:800;border-radius:99px;padding:4px 16px;font-size:18px;margin-bottom:6px}
.rstats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:16px 0}
@media(min-width:700px){.rstats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.rs{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.rs b{display:block;font-size:24px}
.rs.ok b{color:var(--ok)}.rs.bad b{color:var(--bad)}
.rs small{color:var(--muted)}
.comments{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;margin:0 0 16px}
.comments p{margin:0;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:10px;padding:10px 14px;font-size:15px}
.meters{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.meter-top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:14px;margin-bottom:4px}
.meter-top span{color:var(--muted)}
.mbar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.mbar i{display:block;height:100%;border-radius:99px;width:0;transition:width .9s ease}
.l-hi i{background:var(--ok)}.l-mid i{background:var(--gold)}.l-lo i{background:var(--bad)}
.recall{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;margin:0;padding:0;list-style:none}
.recall li{background:var(--gold-bg);color:var(--gold-tx);border-left:5px solid var(--gold);border-radius:10px;padding:10px 14px;font-size:14px}
.sec{margin-top:22px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{border-radius:99px;padding:6px 14px;font-size:14px;border:1px solid var(--line);background:var(--card)}
.chip.on{background:var(--red);border-color:var(--red);color:#fff}
.rv{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.rv .card{padding:16px}
.rv .opt{cursor:default;padding:8px 12px}
.rv .opt:hover{border-color:var(--line)}
.rv .opt.ok:hover{border-color:var(--ok)}.rv .opt.bad:hover{border-color:var(--bad)}
.acts{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;margin:18px 0 40px}
@media(min-width:700px){.acts{grid-template-columns:repeat(3,minmax(0,1fr))}}
.btn.sm{padding:8px 14px;font-size:14px}
.privacy{margin:10px 0 0;text-align:center;color:var(--muted);font-size:13px}
.bigstat{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:14px 0}
@media(min-width:700px){.bigstat{grid-template-columns:repeat(3,minmax(0,1fr))}}
.hq{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.hq li{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:14px}
.hq b{color:var(--red)}
.hb{background:linear-gradient(135deg,#7E0F15,#B3171F 55%,#8E1218);padding:46px 16px 38px;text-align:center;color:#fff}.hbi small{display:block;letter-spacing:.08em;font-weight:700;color:#F5C547;font-size:13px}.hbi strong{display:block;font-size:clamp(28px,6vw,52px);font-weight:900;line-height:1.1;margin:10px 0}.hbi em{font-style:normal;color:#F6D5D7;font-size:15px}
.exp a,.refs a{color:var(--blue);font-weight:600}
.tag.lnk{text-decoration:none;cursor:pointer;border-color:var(--blue);color:var(--blue)}.tag.red.lnk{background:var(--red-bg);color:var(--red);border-color:transparent}.tag.lnk:hover{text-decoration:underline}
.note{padding:14px 16px;background:var(--gold-bg);color:var(--gold-tx);border-radius:12px;margin:20px 0;font-size:15px}
#boot{padding:24px;margin:24px auto;max-width:560px;background:var(--gold-bg);color:var(--gold-tx);border-radius:12px;font-size:15px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<div id="app"></div>

ir","note":"Bạn nắm được phần lớn nội dung; nên đọc lại văn kiện của các câu làm sai."},{"min":5,"name":"Đạt","cls":"g-pass","note":"Đạt mức tối thiểu; nên học lại bằng chế độ học rồi làm lại."},{"min":0,"name":"Cần ôn lại","cls":"g-fail","note":"Nên đọc lại các văn kiện, học lại từng câu ở chế độ học rồi làm lại bài."}],"REF":[["NGHỊ QUYẾT SỐ 31-NQ/TW NGÀY 15/10/2026","Về tăng cường xây dựng, chỉnh đốn Đảng và hệ thống chính trị trong sạch, vững mạnh toàn diện, đáp ứng yêu cầu phát triển của đất nước trong kỷ nguyên mới","https://tulieuvankien.dangcongsan.vn/he-thong-van-ban/van-ban-cua-dang/nghi-quyet-so-31-nq-tw-ngay-15-10-2026-hoi-nghi-lan-thu-tu-ban-chap-hanh-trung-uong-dang-khoa-xiv-ve-tang-cuong-xay-dung.html"],["NGHỊ QUYẾT SỐ 29-NQ/TW NGÀY 15/10/2026","Về tiếp tục đổi mới, hoàn thiện phương thức lãnh đạo, cầm quyền của Đảng trong kỷ nguyên mới","https://tulieuvankien.dangcongsan.vn/he-thong-van-ban/van-ban-cua-dang/nghi-quyet-so-29-nq-tw-ngay-15-10-2026-hoi-nghi-lan-thu-tu-ban-chap-hanh-trung-uong-dang-khoa-xiv-ve-tiep-tuc-doi-moi-ho.html"],["NGHỊ QUYẾT SỐ 30-NQ/TW NGÀY 15/10/2026","Về tiếp tục xây dựng đội ngũ cán bộ các cấp và đổi mới căn bản, toàn diện công tác cán bộ đáp ứng yêu cầu phát triển đất nước trong kỷ nguyên mới","https://tulieuvankien.dangcongsan.vn/he-thong-van-ban/van-ban-cua-dang/nghi-quyet-so-30-nq-tw-ngay-15-101-2026-hoi-nghi-lan-thu-tu-ban-chap-hanh-trung-uong-dang-ve-tiep-tuc-xay-dung-doi-ngu-c.html?categoryId=102000092"],["QUY ĐỊNH SỐ 224-QĐ/TW NGÀY 14/10/2026","Của Ban Chấp hành Trung ương Đảng khóa XIV về đảng viên tham gia hoạt động đầu tư, kinh doanh","https://dangcongsan.vn/van-ban-cua-dang/quy-dinh-so-224-qd-tw-ngay-14-10-2026-cua-ban-chap-hanh-trung-uong-ve-dang-vien-tham-gia-hoat-dong-dau-tu-kinh-doanh.html"],["KẾT LUẬN SỐ 105-KL/TW NGÀY 15/10/2026","Của Ban Chấp hành Trung ương Đảng khóa XIV về thu hút và trọng dụng nhân tài trong các ngành, lĩnh vực mũi nhọn, phục vụ đất nước phát triển nhanh, bền vững","https://tulieuvankien.dangcongsan.vn/he-thong-van-ban/van-ban-cua-dang/ket-luan-so-105-kl-tw-ngay-15-10-2026-hoi-nghi-lan-thu-tu-ban-chap-hanh-trung-uong-dang-khoa-xiv-ve-thu-hut-va-trong-dun.html?categoryId=102000092"],["KẾT LUẬN SỐ 106-KL/TW NGÀY 15/10/2026","Của Ban Chấp hành Trung ương Đảng khóa XIV về tình hình phát triển kinh tế - xã hội, thực hiện ngân sách nhà nước năm 2026; kế hoạch năm 2027","https://tulieuvankien.dangcongsan.vn/he-thong-van-ban/van-ban-cua-dang/ket-luan-so-106-kl-tw-ngay-15-10-2026-hoi-nghi-lan-thu-tu-ban-chap-hanh-trung-uong-dang-khoa-xiv-ve-tinh-hinh-phat-trien.html?categoryId=102000092"]],"BANK":[{"s":"A","y":"NH","r":"NQ 31-NQ/TW · Mục I; II.1, quan điểm (1)","q":"Đặt trong yêu cầu phát triển đất nước ở kỷ nguyên mới, nhận thức nào phản ánh đầy đủ nhất vị trí và yêu cầu đối với công tác xây dựng, chỉnh đốn Đảng?","o":["Đây là nhiệm vụ then chốt, thường xuyên, quyết định thành công của sự nghiệp xây dựng và bảo vệ Tổ quốc trong kỷ nguyên mới.","Đây là nhiệm vụ trọng tâm trong giai đoạn kiện toàn tổ chức bộ máy; kết quả chủ yếu thể hiện ở sự hoàn chỉnh về tổ chức, quy chế và đội ngũ.","Đây là nhiệm vụ tập trung vào phát hiện, xử lý vi phạm và tăng cường kỷ luật, qua đó củng cố sức chiến đấu và giữ vững sự ổn định của tổ chức đảng."],"e":"Mục I và quan điểm (1) của Nghị quyết cùng khẳng định: xây dựng, chỉnh đốn Đảng và hệ thống chính trị trong sạch, vững mạnh toàn diện là nhiệm vụ then chốt, thường xuyên, quyết định thành công của sự nghiệp xây dựng và bảo vệ Tổ quốc trong kỷ nguyên mới (mục I còn nêu “có ý nghĩa sống còn đối với Đảng, chế độ”).\nBa từ khóa cần gắn với nhau: then chốt (vị trí), thường xuyên (không làm theo đợt) và quyết định thành công (vai trò đối với sự nghiệp chung, không chỉ riêng việc nội bộ của Đảng).\nVì sao các phương án còn lại chưa đúng: Phương án nói về “giai đoạn kiện toàn tổ chức bộ máy” biến một nhiệm vụ thường xuyên thành nhiệm vụ theo giai đoạn và chỉ đo bằng sự hoàn chỉnh về tổ chức, quy chế. Phương án chỉ tập trung xử lý vi phạm và kỷ luật thu hẹp nhiệm vụ này, trong khi Nghị quyết yêu cầu kết hợp “xây” với “chống” và chủ động phòng ngừa.","t":"Then chốt – thường xuyên – quyết định thành công."},{"s":"A","y":"NH","r":"NQ 31-NQ/TW · Mục II.1, quan điểm (1), (2)","q":"Quan hệ giữa “kiên định” và “đổi mới” được thể hiện như thế nào trong tư duy chỉ đạo của Nghị quyết?","o":["Kiên định và vận dụng, phát triển sáng tạo chủ nghĩa Mác-Lênin, tư tưởng Hồ Chí Minh, lý luận về đường lối đổi mới, mục tiêu độc lập dân tộc và chủ nghĩa xã hội, các nguyên tắc tổ chức, hoạt động của Đảng. Trên nền tảng đó, không ngừng đổi mới tư duy, phát triển lý luận, tổng kết thực tiễn, nâng cao năng lực dự báo và kiến tạo tầm nhìn dài hạn.","Kiên định mục tiêu và nguyên tắc là nền tảng; đổi mới chỉ cần đặt ra ở cách tổ chức thực hiện, không nhất thiết phát triển nhận thức và lý luận.","Đổi mới phải đi trước để đáp ứng thực tiễn; khi yêu cầu phát triển thay đổi có thể chủ động điều chỉnh các nguyên tắc nền tảng."],"e":"Quan điểm (1) yêu cầu kiên định và vận dụng, phát triển sáng tạo chủ nghĩa Mác-Lênin, tư tưởng Hồ Chí Minh, lý luận về đường lối đổi mới, mục tiêu độc lập dân tộc và chủ nghĩa xã hội, các nguyên tắc tổ chức, hoạt động của Đảng. Quan điểm (2) bổ sung: không ngừng đổi mới tư duy, phát triển lý luận, tổng kết thực tiễn, nâng cao năng lực dự báo, kiến tạo tầm nhìn dài hạn.\nCần nhớ: kiên định là nền tảng, đổi mới diễn ra “trên nền tảng đó”. Hai vế đi cùng nhau, không vế nào thay thế vế nào.\nVì sao các phương án còn lại chưa đúng: Phương án cho rằng đổi mới chỉ cần ở khâu tổ chức thực hiện bỏ qua yêu cầu đổi mới tư duy, phát triển nhận thức và lý luận. Phương án cho rằng có thể điều chỉnh nguyên tắc nền tảng khi yêu cầu thay đổi đi ngược yêu cầu “kiên định” mục tiêu, nguyên tắc; đổi mới ở đây là vận dụng, phát triển sáng tạo chứ không phải thay đổi nền tảng.","t":"Kiên định nền tảng tư tưởng, lý luận, đồng thời không ngừng đổi mới tư duy, phát triển lý luận."},{"s":"A","y":"NH","r":"NQ 31-NQ/TW · Mục II.1, quan điểm (3); III.6","q":"Điểm cốt lõi nào thể hiện hiệu quả xử lý vi phạm, không để vi phạm tương tự tái diễn?","o":["Chuyển mạnh từ phát hiện, xử lý khi vi phạm sang chủ động nhận diện, cảnh báo, phòng ngừa từ sớm, từ xa, từ gốc; kết hợp xử lý nghiêm vi phạm với loại bỏ nguyên nhân, điều kiện phát sinh và ngăn ngừa tái diễn.","Tiếp tục tăng mức xử lý kỷ luật đối với các trường hợp trực tiếp vi phạm, coi tính nghiêm minh của xử lý là kết quả khắc phục chủ yếu.","Tập trung giáo dục, nhắc nhở và hoàn thiện hồ sơ kiểm điểm; chuyển việc theo dõi các nguy cơ tái diễn sang các kỳ kiểm tra tiếp theo."],"e":"Quan điểm (3) và nhiệm vụ 6 yêu cầu chuyển mạnh từ phát hiện, xử lý khi vi phạm đã xảy ra sang chủ động nhận diện, cảnh báo, phòng ngừa từ sớm, từ xa, từ gốc; đồng thời kết hợp xử lý nghiêm vi phạm với loại bỏ nguyên nhân, điều kiện phát sinh và ngăn ngừa tái diễn, để không cho khuyết điểm nhỏ tích tụ thành sai phạm lớn.\nHiệu quả xử lý được đo ở chỗ vi phạm tương tự không lặp lại, tức là phải xử lý đến nguyên nhân, không dừng ở người vi phạm.\nVì sao các phương án còn lại chưa đúng: Phương án chỉ tăng mức kỷ luật đối với người trực tiếp vi phạm coi nghiêm minh là kết quả chủ yếu, trong khi Nghị quyết vẫn yêu cầu xử lý nghiêm nhưng phải đi kèm loại bỏ nguyên nhân. Phương án chỉ giáo dục, nhắc nhở, hoàn thiện hồ sơ rồi chuyển việc theo dõi sang kỳ kiểm tra sau là né tránh: Nghị quyết đòi mỗi khuyết điểm phải chỉ rõ nguyên nhân, trách nhiệm, biện pháp và thời hạn khắc phục.","t":"Từ sớm, từ xa, từ gốc; xử lý nghiêm và loại bỏ nguyên nhân để không tái diễn."},{"s":"A","y":"NH","r":"NQ 31-NQ/TW · Mục II.1, quan điểm (6)(i); III.1","q":"Đâu là điểm nâng tầm cốt lõi của yêu cầu “tự đổi mới, tự chỉnh đốn, tự hoàn thiện” đối với một đảng cầm quyền?","o":["Tạo chuyển biến sâu sắc về nhận thức và hành động trong toàn Đảng và hệ thống chính trị về xây dựng, chỉnh đốn Đảng là quy luật phát triển, nhu cầu tự thân, thường xuyên của Đảng.","Tăng tần suất kiểm điểm, đánh giá và sơ kết để các cấp ủy sớm nhận diện và khắc phục khuyết điểm.","Tăng cường sự giám sát từ cơ quan cấp trên và các chủ thể bên ngoài để kịp thời phát hiện sai phạm."],"e":"Quan điểm (6)(i) đặt yêu cầu nâng tầm năng lực tự đổi mới, tự chỉnh đốn, tự hoàn thiện, và mục III.1 nói rõ: đó là quy luật phát triển, nhu cầu tự thân, thường xuyên của Đảng; phải trở thành năng lực nội sinh và công việc thường xuyên của mỗi tổ chức đảng, cán bộ, đảng viên, tạo chuyển biến sâu sắc về nhận thức và hành động.\nChữ “tự” là điểm mấu chốt: động lực xuất phát từ bên trong, không chờ bị nhắc hay bị phát hiện.\nVì sao các phương án còn lại chưa đúng: Tăng tần suất kiểm điểm, đánh giá, sơ kết chỉ là tăng thủ tục; Nghị quyết cảnh báo tình trạng nhận khuyết điểm nhưng sửa chậm, sửa hình thức. Tăng giám sát của cấp trên và các chủ thể bên ngoài là cần thiết (mục III.7) nhưng đó là kiểm soát từ bên ngoài, chưa phải điều làm nên “tự” đổi mới, tự chỉnh đốn.","t":"Tự đổi mới, tự chỉnh đốn là quy luật phát triển, nhu cầu tự thân, thường xuyên của Đảng."},{"s":"A","y":"NH","r":"NQ 31-NQ/TW · Mục II.1, quan điểm (2)","q":"Thước đo nào cho thấy rõ nhất công tác xây dựng, chỉnh đốn Đảng thực sự góp phần nâng cao năng lực lãnh đạo, cầm quyền?","o":["Chất lượng chủ trương, quyết sách, năng lực và hiệu quả tổ chức thực hiện, kết quả phát triển của đất nước.","Số lượng nghị quyết, chủ trương, chương trình, kế hoạch được ban hành và mức độ hoàn thành quy trình triển khai.","Kết quả tăng trưởng và các chỉ tiêu kinh tế - xã hội, không cần gắn riêng với chất lượng quyết sách, trách nhiệm và tiến độ tổ chức thực hiện."],"e":"Quan điểm (2) lấy chất lượng chủ trương, quyết sách, năng lực và hiệu quả tổ chức thực hiện, kết quả phát triển của đất nước làm thước đo năng lực lãnh đạo, cầm quyền. Như vậy thước đo gồm cả đầu vào (chất lượng quyết sách), quá trình (hiệu quả tổ chức thực hiện) và kết quả phát triển.\nXây dựng, chỉnh đốn Đảng chỉ thật sự có hiệu quả khi nâng được cả ba yếu tố này.\nVì sao các phương án còn lại chưa đúng: Số lượng nghị quyết, chương trình, kế hoạch và mức độ hoàn thành quy trình chỉ đo hoạt động, không đo chất lượng; mục III.2 yêu cầu chọn đúng, trúng vấn đề then chốt, cấp bách thay vì ban hành nhiều. Phương án chỉ lấy chỉ tiêu kinh tế - xã hội mà không gắn với chất lượng quyết sách, trách nhiệm và tiến độ tổ chức thực hiện là thiếu hai vế còn lại của thước đo.","t":"Thước đo năng lực lãnh đạo: chất lượng quyết sách, hiệu quả tổ chức thực hiện, kết quả phát triển đất nước."},{"s":"A","y":"NH","r":"NQ 31-NQ/TW · Mục III.3","q":"Phương án nào thể hiện đúng nhất bước phát triển trong việc xây dựng Đảng “thật sự là đạo đức, là văn minh” theo Nghị quyết?","o":["Chuyển các giá trị vì nước, vì dân, cần, kiệm, liêm, chính, chí công vô tư, trung thực, nêu gương từ yêu cầu tu dưỡng, rèn luyện thành chuẩn mực bắt buộc trong ứng xử, ra quyết định, sử dụng quyền lực và kỷ luật thực thi công vụ.","Đặt trọng tâm vào giáo dục, tự giác tu dưỡng và các phong trào nêu gương; các chuẩn mực về hành vi, quyết định và sử dụng quyền lực sẽ hình thành từ quá trình rèn luyện.","Xây dựng hệ thống văn hóa lãnh đạo, văn hóa cầm quyền, văn hóa quản lý và văn hóa liêm chính như bốn thành tố độc lập ngang nhau; đánh giá chủ yếu qua việc tuân thủ quy tắc ứng xử."],"e":"Mục III.3 yêu cầu chuyển hóa các giá trị vì nước, vì dân, cần, kiệm, liêm, chính, chí công vô tư, trung thực, nêu gương từ yêu cầu tu dưỡng, rèn luyện thành chuẩn mực bắt buộc trong ứng xử, ra quyết định, sử dụng quyền lực và kỷ luật thực thi công vụ.\nBước phát triển nằm ở chữ “bắt buộc”: đạo đức không chỉ là tự giác mà được quy chế hóa thành quy tắc ứng xử, quy trình, trách nhiệm cụ thể, có thể kiểm tra, đánh giá; kiểm soát bằng thể chế đi cùng tự kiểm soát bằng danh dự, lòng tự trọng.\nVì sao các phương án còn lại chưa đúng: Phương án đặt trọng tâm vào giáo dục, tự giác và phong trào nêu gương chưa tạo ra chuẩn mực bắt buộc, kiểm tra được. Phương án coi các “văn hóa” là bốn thành tố độc lập ngang nhau, đánh giá chủ yếu bằng tuân thủ quy tắc, không khớp văn bản: Nghị quyết nêu ba loại văn hóa (lãnh đạo, cầm quyền, liêm chính), yêu cầu xác lập đồng bộ chứ không tách rời, và không có “văn hóa quản lý”.","t":"Giá trị đạo đức thành chuẩn mực bắt buộc trong ứng xử, ra quyết định, sử dụng quyền lực."},{"s":"A","y":"NH","r":"NQ 31-NQ/TW · Mục III.5","q":"Theo Nghị quyết, khi phân cấp nhiệm vụ cho cấp sát việc, sát dân, phương án nào bảo đảm đồng bộ nhất giữa trao quyền và trách nhiệm?","o":["Trao đủ thẩm quyền, nguồn lực và trách nhiệm giải trình; cấp trên tập trung định hướng, tiêu chuẩn, kiểm tra, giám sát, cấp dưới chủ động quyết định và chịu trách nhiệm theo thẩm quyền. Kiểm soát quyền lực xuyên suốt từ giao quyền, thực hiện quyền đến kiểm tra, giám sát.","Giao rõ nhiệm vụ, tăng nguồn lực nhưng vẫn yêu cầu cấp dưới xin ý kiến cấp trên trước các quyết định thuộc thẩm quyền để giảm rủi ro.","Trao quyền quyết định và yêu cầu cấp dưới tự chịu trách nhiệm; hoạt động kiểm tra, giám sát chủ yếu tiến hành sau khi phát sinh khó khăn, sai phạm."],"e":"Mục III.5 nêu nguyên tắc quyền hạn đến đâu, trách nhiệm đến đó; phân cấp, phân quyền phải đưa quyết định đến cấp sát việc, sát dân, gắn với trao đủ thẩm quyền, nguồn lực và trách nhiệm giải trình. Cấp trên tập trung định hướng, tiêu chuẩn, kiểm tra, giám sát; cấp dưới chủ động quyết định và chịu trách nhiệm theo thẩm quyền; quyền lực được kiểm soát xuyên suốt từ giao quyền, thực hiện quyền đến kiểm tra, giám sát.\nVì sao các phương án còn lại chưa đúng: Phương án vẫn bắt cấp dưới xin ý kiến trước các quyết định thuộc thẩm quyền thì thực chất chưa phân quyền, trái yêu cầu cấp dưới “chủ động quyết định”. Phương án trao quyền rồi chỉ kiểm tra sau khi phát sinh sai phạm thiếu kiểm soát xuyên suốt và thiếu hai điều kiện đi kèm là nguồn lực và trách nhiệm giải trình.","t":"Giao quyền = đủ thẩm quyền + nguồn lực + trách nhiệm giải trình, và kiểm soát xuyên suốt."},{"s":"A","y":"NH","r":"NQ 31-NQ/TW · Mục II.1, quan điểm (4); III.7","q":"Theo quan điểm “Dân là gốc”, đâu là cách hiểu đầy đủ nhất về cơ sở tạo dựng và kiểm chứng uy tín của Đảng?","o":["Xây dựng Đảng phải vì Nhân dân, dựa vào Nhân dân và chịu sự giám sát của Nhân dân. Lấy chất lượng cuộc sống, sự đồng thuận và niềm tin của Nhân dân làm thước đo.","Đề cao sự đồng thuận của Nhân dân trong quá trình góp ý chủ trương, quyết sách; kết quả được đánh giá chủ yếu qua mức độ tham gia và ủng hộ.","Lấy sự hài lòng của Nhân dân làm thước đo; việc góp ý, giám sát và giải quyết kiến nghị trước hết do các cơ quan chuyên trách đảm nhận."],"e":"Quan điểm (4) khẳng định xây dựng Đảng phải vì Nhân dân, dựa vào Nhân dân và chịu sự giám sát của Nhân dân; lấy chất lượng cuộc sống, sự đồng thuận và niềm tin của Nhân dân làm thước đo quan trọng đối với uy tín của Đảng và hiệu quả xây dựng, chỉnh đốn Đảng. Mục III.7 cụ thể hóa bằng phương châm “Dân biết, dân bàn, dân làm, dân kiểm tra, dân giám sát, dân thụ hưởng”.\nVì sao các phương án còn lại chưa đúng: Phương án chỉ đề cao đồng thuận trong góp ý chủ trương đo bằng mức độ tham gia, ủng hộ mới là một phần: thiếu chịu sự giám sát và chất lượng cuộc sống; Nghị quyết còn dặn không vì cầu đồng thuận mà né tránh việc khó. Phương án giao việc góp ý, giám sát, giải quyết kiến nghị trước hết cho cơ quan chuyên trách đi ngược yêu cầu thực sự dựa vào Nhân dân, để Nhân dân và Mặt trận Tổ quốc trực tiếp tham gia giám sát, phản biện.","t":"“Dân là gốc”: vì Nhân dân, dựa vào Nhân dân, chịu sự giám sát của Nhân dân."},{"s":"A","y":"NH","r":"NQ 31-NQ/TW · Mục II.1, quan điểm (5); III.5","q":"Việc khuyến khích, bảo vệ cán bộ dám nghĩ, dám làm, dám chịu trách nhiệm vì lợi ích chung phải tuân theo nguyên tắc nào?","o":["Phân biệt sai phạm do vụ lợi, cố ý làm trái với rủi ro phát sinh trong đổi mới sáng tạo; việc bảo vệ phải căn cứ động cơ trong sáng, vì lợi ích chung, đúng thẩm quyền và có kiểm soát, không bao che hoặc miễn trừ trách nhiệm.","Ưu tiên bảo vệ người có sáng kiến và có động cơ tích cực; chỉ xem xét trách nhiệm khi chứng minh được mục đích vụ lợi.","Chỉ bảo vệ các quyết định sáng tạo đã đạt kết quả dự kiến; trường hợp chưa đạt kết quả phải xử lý trách nhiệm như các vi phạm thông thường."],"e":"Quan điểm (5) và mục III.5 yêu cầu bảo vệ, trọng dụng cán bộ dám đổi mới, dám nghĩ, dám làm, dám chịu trách nhiệm vì lợi ích chung, đồng thời kiên quyết xử lý hành vi lợi dụng đổi mới để vụ lợi. Phải phân biệt sai phạm do vụ lợi, cố ý làm trái với rủi ro phát sinh trong đổi mới sáng tạo; việc bảo vệ căn cứ động cơ trong sáng, vì lợi ích chung, đúng thẩm quyền, có kiểm soát, không bao che hoặc miễn trừ trách nhiệm.\nVì sao các phương án còn lại chưa đúng: Phương án chỉ xem xét trách nhiệm khi chứng minh được vụ lợi bỏ hai điều kiện còn lại là đúng thẩm quyền và có kiểm soát. Phương án chỉ bảo vệ quyết định đã đạt kết quả dự kiến lấy kết quả thay cho động cơ làm căn cứ, trong khi Nghị quyết tách rủi ro do đổi mới sáng tạo khỏi vi phạm nên không xử lý như vi phạm thông thường.","t":"Bảo vệ theo động cơ trong sáng, đúng thẩm quyền, có kiểm soát; không bao che."},{"s":"A","y":"NH","r":"NQ 31-NQ/TW · Mục III.3; III.7","q":"Vai trò của công nghệ số, dữ liệu và trí tuệ nhân tạo trong xây dựng Đảng văn minh thể hiện như thế nào?","o":["Là thành tố quan trọng trong “tổ chức bộ máy khoa học, tinh gọn, vận hành thông suốt”.","Chuẩn hóa các chỉ số và tự động hóa việc chấm điểm để hạn chế tối đa phán đoán, trách nhiệm của các chủ thể có thẩm quyền.","Ưu tiên hoàn thiện hồ sơ, dữ liệu điện tử và báo cáo định lượng; sử dụng kết quả trên nền tảng số làm căn cứ quyết định cuối cùng."],"e":"Mục III.3 yêu cầu xây dựng Đảng văn minh với tổ chức bộ máy khoa học, tinh gọn, vận hành thông suốt; hoạch định chủ trương dựa trên thực tiễn, khoa học, dữ liệu, dự báo; hiện đại hóa quản trị; làm chủ công nghệ số, dữ liệu, trí tuệ nhân tạo. Công nghệ số, dữ liệu và AI vì thế là một thành tố quan trọng của bộ máy vận hành thông suốt.\nMục III.7 đặt giới hạn: dùng dữ liệu, công nghệ để hỗ trợ lãnh đạo, kiểm tra, giám sát nhưng không thay thế thẩm quyền, trách nhiệm của tổ chức, cá nhân.\nVì sao các phương án còn lại chưa đúng: Phương án tự động hóa chấm điểm để hạn chế phán đoán và trách nhiệm của người có thẩm quyền đã để công nghệ thay con người. Phương án lấy kết quả trên nền tảng số làm căn cứ quyết định cuối cùng cũng vượt giới hạn “hỗ trợ”; dữ liệu giúp nhận diện, cảnh báo sớm, còn quyết định vẫn thuộc chủ thể có thẩm quyền.","t":"Công nghệ, dữ liệu hỗ trợ lãnh đạo, không thay thế thẩm quyền, trách nhiệm."},{"s":"A","y":"NH","r":"NQ 31-NQ/TW · Mục I; III.6","q":"Khi nhìn lại các nghị quyết Trung ương 4 khóa XI, khóa XII, Kết luận Trung ương 4 khóa XIII và định hướng của nghị quyết Trung ương 4 khóa XIV, cách khái quát nào phản ánh đúng nhất mạch kế thừa và phát triển?","o":["Yêu cầu xây dựng, chỉnh đốn nghiêm minh, kết hợp ngày càng chặt chẽ “xây” và “chống”; giữa giáo dục, rèn luyện với giữ nghiêm kỷ luật, kỷ cương và kiểm soát quyền lực; chuyển mạnh từ xử lý vi phạm sang chủ động phòng ngừa, cảnh báo từ sớm, từ xa.","Tiếp tục coi kiểm điểm, xem xét, xử lý vi phạm là nội dung bao trùm; nâng hiệu quả xây dựng Đảng chủ yếu bằng tăng cường kỷ luật và chế tài.","Chuyển trọng tâm từ xây dựng tổ chức đảng, đảng viên sang đổi mới quản lý nhà nước, coi cải cách hành chính là nội dung thay thế cơ bản cho xây dựng Đảng."],"e":"Mục I nêu: từ Đại hội XI đến nay, nhận thức và thực tiễn xây dựng, chỉnh đốn Đảng không ngừng phát triển, kết hợp ngày càng chặt chẽ giữa “xây” và “chống”, giữa giáo dục, rèn luyện với giữ nghiêm kỷ luật, kỷ cương và kiểm soát quyền lực, chuyển mạnh từ xử lý vi phạm sang chủ động phòng ngừa, cảnh báo từ sớm, từ xa. Mục III.6 tiếp tục thực hiện nghiêm nghị quyết Trung ương 4 khóa XI, khóa XII và kết luận Trung ương 4 khóa XIII.\nMạch chung là kế thừa, rồi nâng lên một bước: từ “chống” là chính sang “xây” và “chống” đi đôi, từ xử lý sang phòng ngừa.\nVì sao các phương án còn lại chưa đúng: Phương án coi kiểm điểm, xử lý vi phạm và tăng chế tài là nội dung bao trùm đi ngược hướng chuyển sang phòng ngừa. Phương án chuyển trọng tâm sang quản lý nhà nước, coi cải cách hành chính thay thế xây dựng Đảng là sai: Nghị quyết gắn xây dựng Đảng với xây dựng hệ thống chính trị chứ không thay cái này bằng cái kia.","t":"Xây và chống ngày càng chặt chẽ; chuyển từ xử lý vi phạm sang phòng ngừa, cảnh báo từ sớm, từ xa."},{"s":"A","y":"NH","r":"NQ 31-NQ/TW · Mục II.1, quan điểm (5); III.4","q":"Từ yêu cầu “cán bộ là nhân tố quyết định”, “công tác cán bộ là then chốt của then chốt”, trách nhiệm của người đứng đầu cần được hiểu thế nào?","o":["Chịu trách nhiệm cả về kết quả công tác và chất lượng tổ chức, đội ngũ, đoàn kết nội bộ và khả năng phát huy trí tuệ tập thể.","Tập trung chịu trách nhiệm về việc phân công, kiểm tra và hoàn thành nhiệm vụ; chất lượng đội ngũ và nguồn kế cận do cấp có thẩm quyền về công tác cán bộ quyết định.","Chịu trách nhiệm về chỉ tiêu của cơ quan, đơn vị; những quyết định đã được tập thể thông qua thì chỉ xem xét trách nhiệm chung của tập thể."],"e":"Quan điểm (5) khẳng định cán bộ là nhân tố quyết định, công tác cán bộ là “then chốt của then chốt”. Mục III.4 gắn với trách nhiệm người đứng đầu: chịu trách nhiệm cả về kết quả công tác và chất lượng tổ chức, đội ngũ, đoàn kết nội bộ và khả năng phát huy trí tuệ tập thể.\nCần nhớ hai vế: kết quả công việc và chất lượng tổ chức, đội ngũ; thiếu một vế là chưa đủ trách nhiệm.\nVì sao các phương án còn lại chưa đúng: Phương án chỉ chịu trách nhiệm về phân công, kiểm tra, hoàn thành nhiệm vụ rồi đẩy chất lượng đội ngũ, nguồn kế cận cho cấp có thẩm quyền là thu hẹp trách nhiệm. Phương án coi quyết định đã được tập thể thông qua thì chỉ xem xét trách nhiệm chung của tập thể trái mục III.5: không lợi dụng “tập thể lãnh đạo, cá nhân phụ trách” để làm mờ trách nhiệm cá nhân, mà xác định theo thẩm quyền, mức độ tham gia và hành vi cụ thể.","t":"Người đứng đầu chịu trách nhiệm cả kết quả công tác lẫn chất lượng tổ chức, đội ngũ."},{"s":"A","y":"NH","r":"NQ 31-NQ/TW · Mục III.4","q":"Một chi bộ sinh hoạt đủ kỳ, có đông đảng viên phát biểu nhưng ít vấn đề được giải quyết và khuyết điểm thường lặp lại. Theo Nghị quyết, tiêu chí nào cần được coi trọng để tạo chuyển biến thực chất?","o":["Sinh hoạt phải thiết thực, dân chủ, có trọng tâm, bám sát nhiệm vụ chính trị; mọi vấn đề phải được thảo luận và đi đến kết luận, phân công, thời hạn và kiểm tra kết quả.","Bảo đảm đủ nội dung, thời lượng, tỉ lệ tham gia và chất lượng biên bản sinh hoạt, coi đó là điều kiện tiên quyết đánh giá chi bộ.","Tăng thời gian trao đổi, giáo dục chính trị, tư tưởng để nâng cao đồng thuận; các vấn đề khó tiếp tục nghiên cứu, chưa cần xác định trách nhiệm ngay."],"e":"Mục III.4 coi đổi mới, nâng cao chất lượng sinh hoạt cấp ủy, sinh hoạt chi bộ là giải pháp nền tảng. Sinh hoạt phải thiết thực, dân chủ, có trọng tâm, bám sát nhiệm vụ chính trị; mọi vấn đề đều phải được thảo luận và đi đến kết luận, phân công, thời hạn và kiểm tra kết quả; lấy chất lượng sinh hoạt làm căn cứ quan trọng đánh giá tổ chức cơ sở đảng và đảng viên.\nTình huống trong câu thiếu đúng khâu cuối: có phát biểu nhưng không có kết luận, người phụ trách, thời hạn và kiểm tra.\nVì sao các phương án còn lại chưa đúng: Phương án lấy đủ kỳ, đủ thời lượng, tỉ lệ tham gia, biên bản đẹp làm điều kiện tiên quyết là đánh giá hình thức, đúng tình trạng chi bộ trong câu. Phương án để vấn đề khó tiếp tục nghiên cứu, chưa xác định trách nhiệm ngay trái yêu cầu mọi vấn đề phải có kết luận, phân công, thời hạn; thêm thời gian giáo dục chính trị cũng không giải quyết việc khuyết điểm lặp lại.","t":"Mọi vấn đề đều phải có kết luận, người phụ trách, thời hạn và kiểm tra kết quả."},{"s":"A","y":"NH","r":"NQ 31-NQ/TW · Mục III.5","q":"Điểm mới cần nhận thức đầy đủ về chế độ trách nhiệm thực chất là gì?","o":["Phân định rõ trách nhiệm của tập thể, cá nhân, người đứng đầu, cơ quan tham mưu, người đề xuất, người quyết định, người tổ chức thực hiện và người kiểm tra, giám sát, theo nguyên tắc quyền hạn đến đâu, trách nhiệm đến đó.","Tăng số đợt kiểm tra của cấp trên, tập trung vào các hành vi lạm quyền, vụ lợi và sử dụng sai nguồn lực đã được phát hiện.","Để hạn chế rủi ro, cấp trên giữ quyền quyết định cuối cùng đối với phần lớn vấn đề mới, khó; cấp dưới tập trung tổ chức thực hiện."],"e":"Mục III.5 yêu cầu hoàn thiện chế độ trách nhiệm: phân định rõ trách nhiệm của tập thể, cá nhân, người đứng đầu, cơ quan tham mưu, người đề xuất, người quyết định, người tổ chức thực hiện và người kiểm tra, giám sát; thực hiện nhất quán nguyên tắc quyền hạn đến đâu, trách nhiệm đến đó, quyền lực càng lớn, trách nhiệm càng cao.\nĐiểm mới là trách nhiệm được xác định theo từng khâu và từng chủ thể, chứ không chung chung.\nVì sao các phương án còn lại chưa đúng: Tăng số đợt kiểm tra tập trung vào hành vi sai phạm đã phát hiện là xử lý sau, chưa tạo ra chế độ trách nhiệm rõ ràng ngay từ đầu. Phương án cấp trên giữ quyền quyết định cuối cùng đối với phần lớn vấn đề mới, khó đi ngược phân cấp, phân quyền gắn với trách nhiệm giải trình và khuyến khích cấp dưới chủ động.","t":"Quyền hạn đến đâu, trách nhiệm đến đó; quyền lực càng lớn, trách nhiệm càng cao."},{"s":"A","y":"NH","r":"NQ 31-NQ/TW · Mục III.2; II.1, quan điểm (2)","q":"Một chủ trương được đánh giá là đúng nhưng triển khai chậm, không tạo chuyển biến rõ. Theo tinh thần đổi mới của Nghị quyết, khâu nào phải được thay đổi căn bản?","o":["Quản trị xuyên suốt từ xác định vấn đề, chuẩn bị quyết sách, thể chế hóa đến giao người, thẩm quyền, nguồn lực, tổ chức thực hiện, kiểm tra, phản hồi, điều chỉnh; đo kết quả và quy trách nhiệm đến cùng.","Tăng cường quán triệt, tuyên truyền và ban hành văn bản hướng dẫn kịp thời, đồng thời giao cấp dưới chủ động lựa chọn biện pháp thực hiện.","Tổ chức thêm các đợt kiểm tra cuối kỳ, tổng hợp kết quả và rút kinh nghiệm để hoàn thiện việc ban hành nghị quyết ở nhiệm kỳ sau."],"e":"Mục III.2 yêu cầu ngay từ khi đề xuất chủ trương phải xác định rõ vấn đề cần giải quyết, kết quả cần đạt, cơ quan chịu trách nhiệm chính, thẩm quyền, nguồn lực, thời hạn và cơ chế kiểm tra, giám sát, đánh giá; đồng thời hoàn thiện cả chu trình xây dựng, ban hành, thể chế hóa, tổ chức thực hiện, kiểm tra, phản hồi và điều chỉnh. Việc chậm trễ, né tránh phải giải trình và chịu trách nhiệm.\nChủ trương đúng mà triển khai chậm thì lỗi nằm ở cả chu trình thực hiện, không chỉ ở một khâu.\nVì sao các phương án còn lại chưa đúng: Chỉ tăng quán triệt, tuyên truyền, ban hành văn bản hướng dẫn rồi giao cấp dưới tự chọn biện pháp là mới thêm một khâu, chưa giao người, nguồn lực, thời hạn và kiểm tra. Phương án kiểm tra cuối kỳ để rút kinh nghiệm cho nhiệm kỳ sau trái yêu cầu khắc phục “tư duy nhiệm kỳ” (quan điểm (2)) và chậm so với yêu cầu điều chỉnh kịp thời.","t":"Quản trị xuyên suốt cả chu trình: từ xác định vấn đề đến kiểm tra, phản hồi, điều chỉnh."},{"s":"B","y":"NH","r":"NQ 29-NQ/TW · Mục II.1, quan điểm thứ hai; III.1","q":"Theo Nghị quyết, Đảng thực hiện phương thức lãnh đạo chủ yếu bằng những phương thức nào?","o":["Bằng Cương lĩnh, đường lối, chủ trương, định hướng chiến lược; công tác tư tưởng, tuyên truyền, vận động; công tác tổ chức, cán bộ; kiểm tra, giám sát, kiểm soát quyền lực; vai trò tiên phong, gương mẫu của cán bộ, đảng viên.","Bằng hoạt động quản lý hành chính, điều hành trực tiếp và quyết định thay các cơ quan nhà nước.","Chủ yếu bằng việc phân bổ nguồn lực, ban hành pháp luật và trực tiếp tổ chức thực hiện mọi nhiệm vụ phát triển kinh tế - xã hội."],"e":"Quan điểm thứ hai của mục II.1 nêu: Đảng lãnh đạo bằng Cương lĩnh, đường lối, chủ trương, định hướng chiến lược; công tác tư tưởng, tuyên truyền, vận động; công tác tổ chức, cán bộ; kiểm tra, giám sát, kiểm soát quyền lực; vai trò tiên phong, gương mẫu của cán bộ, đảng viên. Cũng đoạn này, Đảng cầm quyền thông qua lãnh đạo Nhà nước, để Nhà nước thể chế hóa, quản lý, điều hành, tổ chức thực hiện theo Hiến pháp và pháp luật.\nPhân biệt: “lãnh đạo” là xác định đường lối, mục tiêu, nguyên tắc, chủ trương và tổ chức lực lượng chính trị (mục III.1); còn quản lý, điều hành cụ thể là chức năng của Nhà nước.\nVì sao các phương án còn lại chưa đúng: Phương án quản lý hành chính, điều hành trực tiếp, quyết định thay cơ quan nhà nước chính là điều mục III.1 loại trừ: “không hành chính hóa sự lãnh đạo, không bao biện, làm thay”. Phương án phân bổ nguồn lực, ban hành pháp luật và trực tiếp tổ chức thực hiện mọi nhiệm vụ cũng nhập vai Nhà nước vào Đảng; những việc đó thuộc Nhà nước thực hiện theo Hiến pháp và pháp luật dưới sự lãnh đạo của Đảng.","t":"Đảng lãnh đạo bằng đường lối, tư tưởng, tổ chức, cán bộ, kiểm tra giám sát, gương mẫu; không bao biện, làm thay."},{"s":"B","y":"NH","r":"NQ 29-NQ/TW · Mục II.1, quan điểm thứ ba; III.2.3","q":"Quan điểm của Nghị quyết về mối quan hệ giữa quyền lãnh đạo và trách nhiệm chính trị được xác định như thế nào?","o":["Quyền lãnh đạo gắn với trách nhiệm chính trị; thẩm quyền đến đâu, trách nhiệm đến đó.","Quyền lãnh đạo thuộc về tập thể; cá nhân chỉ chịu trách nhiệm chính trị khi có vi phạm pháp luật.","Cấp trên chịu trách nhiệm thay cho cấp dưới đối với mọi nhiệm vụ đã phân cấp, phân quyền."],"e":"Quan điểm thứ ba của mục II.1 khẳng định: quyền lãnh đạo gắn với trách nhiệm chính trị; thẩm quyền đến đâu, trách nhiệm đến đó. Chủ trương, quyết sách phải rõ chủ thể quyết định, chủ thể tổ chức thực hiện và chủ thể chịu trách nhiệm về kết quả; cấp trên không làm thay cấp dưới, cấp dưới không đùn đẩy lên trên.\nCần nhớ cả hai chiều: không né trách nhiệm xuống dưới hay lên trên, và không dùng “tập thể” để làm mờ cá nhân (mục III.2.3: không cá nhân hóa thẩm quyền tập thể, đồng thời không viện dẫn trách nhiệm tập thể để né tránh trách nhiệm cá nhân).\nVì sao các phương án còn lại chưa đúng: Phương án cho rằng quyền thuộc tập thể, cá nhân chỉ chịu trách nhiệm khi vi phạm pháp luật trái mục III.2.3 và thu hẹp “trách nhiệm chính trị” thành trách nhiệm pháp lý. Phương án cấp trên chịu trách nhiệm thay cấp dưới đi ngược nguyên tắc “cấp trên không làm thay cấp dưới”; khi công việc ách tắc, mục III.4.2 yêu cầu xem xét trách nhiệm cả cấp thực hiện và cấp giao nhiệm vụ, không dồn về một phía.","t":"Thẩm quyền đến đâu, trách nhiệm đến đó."},{"s":"B","y":"NH","r":"NQ 29-NQ/TW · Mục II.1, quan điểm thứ năm","q":"Nội dung nào sau đây được Nghị quyết xác định là thước đo hiệu quả lãnh đạo, cầm quyền?","o":["Chất lượng quyết sách, kết quả thực hiện, sự phát triển của đất nước và sự hài lòng của Nhân dân.","Số lượng văn bản, nghị quyết được ban hành và số cuộc họp được tổ chức trong từng năm.","Mức độ phân cấp, phân quyền và số lượng nhiệm vụ được giao cho cấp dưới."],"e":"Quan điểm thứ năm của mục II.1 lấy chất lượng quyết sách, kết quả thực hiện, sự phát triển của đất nước và sự hài lòng của Nhân dân làm thước đo hiệu quả lãnh đạo, cầm quyền. Thước đo hướng vào chất lượng và kết quả thực chất, không đo bằng hoạt động bên ngoài.\nBốn vế của thước đo gồm: chất lượng quyết sách (đầu vào), kết quả thực hiện (quá trình), sự phát triển của đất nước và sự hài lòng của Nhân dân (đầu ra).\nVì sao các phương án còn lại chưa đúng: Số lượng văn bản, nghị quyết và số cuộc họp chỉ đo khối lượng hoạt động; mục III.2.1 chỉ cho ban hành văn bản mới khi thật sự cần thiết, mục III.7 yêu cầu giảm số lượng, nâng chất lượng hội họp. Mức độ phân cấp, phân quyền và số nhiệm vụ giao cho cấp dưới là phương tiện chứ không phải kết quả; mục III.4.2 còn yêu cầu phân cấp phải gắn với trách nhiệm, nguồn lực, hậu kiểm.","t":"Thước đo lãnh đạo, cầm quyền: chất lượng quyết sách, kết quả thực hiện, phát triển đất nước, sự hài lòng của Nhân dân."},{"s":"B","y":"NH","r":"NQ 29-NQ/TW · Mục II.2 (mục tiêu)","q":"Mục tiêu tổng quát về đổi mới phương thức lãnh đạo, cầm quyền của Đảng được Nghị quyết xác định theo hướng nào?","o":["Khoa học, dân chủ, pháp quyền, hiện đại, vì lợi ích quốc gia - dân tộc và vì Nhân dân.","Tập trung thống nhất mọi hoạt động quản lý, điều hành vào cấp ủy để bảo đảm sự lãnh đạo toàn diện.","Ưu tiên hoàn thiện tổ chức bộ máy trước, việc đổi mới phương thức lãnh đạo được thực hiện sau khi bộ máy ổn định."],"e":"Phần mục tiêu của Nghị quyết đặt yêu cầu đổi mới mạnh mẽ, đồng bộ, tạo chuyển biến căn bản về chất lượng, hiệu lực, hiệu quả phương thức lãnh đạo, cầm quyền của Đảng theo hướng khoa học, dân chủ, pháp quyền, hiện đại, vì lợi ích quốc gia - dân tộc và vì Nhân dân.\nBa đặc điểm cần nhớ: khoa học, dân chủ, pháp quyền, hiện đại; và đích đến vì lợi ích quốc gia - dân tộc, vì Nhân dân.\nVì sao các phương án còn lại chưa đúng: Phương án tập trung mọi hoạt động quản lý, điều hành vào cấp ủy đi ngược mục tiêu pháp quyền và yêu cầu phát huy chủ động, sáng tạo, trách nhiệm của Nhà nước (mục II.2), cũng như nguyên tắc “không bao biện, làm thay” (mục III.1). Phương án làm bộ máy trước, đổi mới phương thức sau tách rời hai việc: Nghị quyết yêu cầu đổi mới “mạnh mẽ, đồng bộ”, còn hoàn thiện tổ chức bộ máy (mục III.4.1) là một nhiệm vụ trong cùng hệ thống giải pháp, không được nêu như điều kiện phải xong trước.","t":"Khoa học, dân chủ, pháp quyền, hiện đại, vì lợi ích quốc gia - dân tộc và vì Nhân dân."},{"s":"B","y":"NH","r":"NQ 29-NQ/TW · Mục II.2 (mục tiêu đến năm 2030, 2045)","q":"Đến năm 2045, Nghị quyết đặt ra yêu cầu chủ yếu nào đối với phương thức lãnh đạo, cầm quyền của Đảng?","o":["Thực sự khoa học, dân chủ, pháp quyền, hiện đại, thích ứng cao, phù hợp với quản trị quốc gia hiện đại, gắn với mục tiêu trở thành nước phát triển, thu nhập cao theo định hướng xã hội chủ nghĩa.","Hoàn thành việc phân cấp toàn bộ thẩm quyền của Trung ương cho địa phương và cơ sở.","Tập trung chuẩn hóa quy trình nội bộ, lấy số lượng văn bản ban hành làm tiêu chí đánh giá chủ yếu."],"e":"Mục tiêu đến năm 2045: phương thức lãnh đạo, cầm quyền thực sự khoa học, dân chủ, pháp quyền, hiện đại, thích ứng cao, phù hợp với quản trị quốc gia hiện đại, gắn với mục tiêu trở thành nước phát triển, thu nhập cao theo định hướng xã hội chủ nghĩa.\nPhân biệt hai mốc: đến 2030 là hoàn thiện, vận hành nền nếp, hiệu quả, gắn với mục tiêu nước đang phát triển có công nghiệp hiện đại, thu nhập trung bình cao; đến 2045 nâng lên mức “thích ứng cao”, gắn với nước phát triển, thu nhập cao.\nVì sao các phương án còn lại chưa đúng: Phương án phân cấp toàn bộ thẩm quyền của Trung ương cho địa phương, cơ sở không có trong Nghị quyết; mục III.4.2 giao cơ quan Trung ương tập trung quản lý vĩ mô, xây dựng thể chế, chính sách lớn. Phương án lấy số lượng văn bản làm tiêu chí chủ yếu trái thước đo ở mục II.1 (chất lượng quyết sách, kết quả, phát triển, sự hài lòng của Nhân dân).","t":"Mốc 2030: nền nếp, hiệu quả; mốc 2045: thích ứng cao, gắn với nước phát triển thu nhập cao."},{"s":"B","y":"NH","r":"NQ 29-NQ/TW · Mục III.1","q":"Việc vận hành thực chất cơ chế “Đảng lãnh đạo, Nhà nước quản lý, Nhân dân làm chủ” đòi hỏi điều gì?","o":["Đảng xác định đường lối, định hướng chiến lược, quyết định vấn đề lớn theo thẩm quyền; Nhà nước kịp thời thể chế hóa, quản lý, điều hành, kiến tạo phát triển; Nhân dân thực hiện quyền làm chủ, tham gia xây dựng Đảng, xây dựng Nhà nước, giám sát hoạt động của hệ thống chính trị và thụ hưởng thành quả phát triển.","Đảng trực tiếp thực hiện các công việc quản lý, điều hành; Nhà nước chủ yếu làm nhiệm vụ tham mưu và báo cáo.","Mặt trận Tổ quốc Việt Nam thay cơ quan nhà nước tổ chức thực hiện chính sách và giải quyết công việc hành chính cho Nhân dân."],"e":"Mục III.1 nêu rõ ba chủ thể gắn với nhau trong cơ chế “Đảng lãnh đạo, Nhà nước quản lý, Nhân dân làm chủ”: Đảng xác định đường lối, định hướng chiến lược, quyết định vấn đề lớn theo thẩm quyền; Nhà nước kịp thời thể chế hóa, quản lý, điều hành, kiến tạo phát triển, chịu trách nhiệm về quyết định, kết quả trong phạm vi thẩm quyền; Nhân dân thực hiện quyền làm chủ, tham gia xây dựng Đảng, xây dựng Nhà nước, giám sát hoạt động của hệ thống chính trị và thụ hưởng thành quả. Mặt trận Tổ quốc và các tổ chức chính trị-xã hội thực hiện chức năng đại diện, vận động, giám sát, phản biện xã hội.\nVì sao các phương án còn lại chưa đúng: Phương án Đảng trực tiếp quản lý, điều hành còn Nhà nước chỉ tham mưu, báo cáo trái yêu cầu “không bao biện, làm thay hoặc can thiệp trái quy định vào quản lý, điều hành của cơ quan nhà nước”; Nghị quyết giao Nhà nước chịu trách nhiệm về quyết định và kết quả. Phương án Mặt trận Tổ quốc thay cơ quan nhà nước tổ chức thực hiện chính sách là sai chức năng: Mặt trận và các tổ chức chính trị-xã hội đại diện, vận động, giám sát, phản biện xã hội.","t":"Đảng lãnh đạo, Nhà nước quản lý, Nhân dân làm chủ: ba chủ thể gắn kết, mỗi bên đúng vai trò."},{"s":"B","y":"NH","r":"NQ 29-NQ/TW · Mục III.1; III.2.1","q":"Theo Nghị quyết, mỗi quyết sách phải xác định rõ những nội dung chủ yếu nào?","o":["Mục tiêu cuối cùng, chủ thể thực hiện, trách nhiệm, nguồn lực, thời hạn, sản phẩm.","Chủ yếu xác định cơ quan chủ trì và thời điểm báo cáo; các nội dung còn lại được bổ sung trong quá trình thực hiện.","Chỉ cần xác định mục tiêu và tiến độ; chủ thể thực hiện được lựa chọn sau khi quyết sách được ban hành."],"e":"Mục III.1 yêu cầu mỗi quyết sách phải rõ mục tiêu cuối cùng, chủ thể thực hiện, trách nhiệm, nguồn lực, thời hạn, sản phẩm. Mục III.2.1 bổ sung: chương trình, kế hoạch hành động phải rõ người, rõ việc, rõ thời hạn, rõ sản phẩm và được xây dựng đồng thời với dự thảo nghị quyết.\nCần nhớ đủ sáu yếu tố, và thời điểm xác định là ngay khi chuẩn bị quyết sách chứ không phải sau khi ban hành.\nVì sao các phương án còn lại chưa đúng: Phương án chỉ xác định cơ quan chủ trì và thời điểm báo cáo, còn lại bổ sung dần trái yêu cầu xây dựng chương trình, kế hoạch đồng thời với dự thảo nghị quyết; phần I cũng nêu hạn chế “một số nhiệm vụ chưa xác định rõ mục tiêu, sản phẩm, thời hạn, nguồn lực, trách nhiệm”. Phương án chỉ cần mục tiêu và tiến độ, chọn chủ thể thực hiện sau thì bỏ sót chủ thể, trách nhiệm, nguồn lực, sản phẩm, trong khi quan điểm thứ ba (mục II.1) đòi chủ trương phải rõ chủ thể quyết định, thực hiện và chịu trách nhiệm.","t":"Rõ mục tiêu, chủ thể, trách nhiệm, nguồn lực, thời hạn, sản phẩm ngay từ đầu."},{"s":"B","y":"NH","r":"NQ 29-NQ/TW · Mục I; III.4.2","q":"Nguyên tắc phân cấp, phân quyền được Nghị quyết xác định như thế nào?","o":["Phân cấp, phân quyền phải bảo đảm rõ ràng, thực chất, gắn với trách nhiệm, nguồn lực, hậu kiểm và kiểm soát quyền lực.","Phân cấp càng nhiều càng tốt, không cần gắn với điều kiện nguồn lực và cơ chế kiểm soát.","Cấp dưới thực hiện nhiệm vụ nhưng phải xin ý kiến cấp trên trước khi quyết định mọi vấn đề đã được phân cấp."],"e":"Mục III.4.2 yêu cầu phân cấp, phân quyền rõ ràng, thực chất, gắn với trách nhiệm, nguồn lực, hậu kiểm và kiểm soát quyền lực. Việc cấp dưới có điều kiện thực hiện tốt hơn thì giao cấp dưới quyết định, chịu trách nhiệm; cấp trên tập trung định hướng, kiểm tra, giám sát, không thêm tầng nấc xử lý.\nMục I đã chỉ ra hạn chế cần khắc phục: phân cấp, phân quyền chưa gắn với nguồn lực và kiểm soát quyền lực, và còn tình trạng xin ý kiến cấp trên về việc thuộc thẩm quyền.\nVì sao các phương án còn lại chưa đúng: Phương án phân cấp càng nhiều càng tốt, không cần nguồn lực và kiểm soát, chính là hạn chế mà mục I nêu. Phương án cấp dưới phải xin ý kiến cấp trên trước mọi quyết định đã phân cấp trái mục III.4.2: “Không xin ý kiến cấp trên để né tránh việc thuộc thẩm quyền”, và khiến thêm tầng nấc xử lý.","t":"Phân cấp, phân quyền = rõ ràng, thực chất + trách nhiệm + nguồn lực + hậu kiểm + kiểm soát quyền lực."},{"s":"B","y":"NH","r":"NQ 29-NQ/TW · Mục III.5","q":"Nghị quyết yêu cầu kiểm soát quyền lực được giao bằng những phương thức nào?","o":["Bằng thể chế, quy chế, quy trình, dữ liệu, công khai, minh bạch và trách nhiệm giải trình; kiểm soát cả hành vi lạm quyền, vượt quyền và tình trạng né tránh, không thực hiện đầy đủ thẩm quyền, trách nhiệm.","Chủ yếu bằng kiểm tra định kỳ sau khi nhiệm vụ đã kết thúc, hạn chế kiểm tra trong quá trình thực hiện.","Tập trung kiểm soát cán bộ cấp dưới, không đặt ra yêu cầu kiểm soát đối với cơ quan tham mưu và người đứng đầu."],"e":"Mục III.5 yêu cầu mọi quyền lực được giao phải được kiểm soát bằng thể chế, quy chế, quy trình, dữ liệu, công khai, minh bạch, trách nhiệm giải trình; kiểm soát cả hành vi lạm quyền, vượt quyền và tình trạng né tránh, không thực hiện đầy đủ thẩm quyền, trách nhiệm. Kiểm tra, giám sát đồng hành với tổ chức thực hiện, kịp thời uốn nắn lệch lạc, xử lý sai phạm, chủ động phòng ngừa, cảnh báo từ sớm, từ xa.\nHai chiều cần nhớ: kiểm soát quá tay (lạm quyền, vượt quyền) và kiểm soát việc không làm hết thẩm quyền (né tránh).\nVì sao các phương án còn lại chưa đúng: Phương án chỉ kiểm tra sau khi nhiệm vụ kết thúc, hạn chế kiểm tra trong quá trình thực hiện trái yêu cầu kiểm tra, giám sát “đồng hành với tổ chức thực hiện”. Phương án chỉ kiểm soát cán bộ cấp dưới, không kiểm soát cơ quan tham mưu và người đứng đầu trái nguyên tắc “mọi quyền lực được giao phải được kiểm soát”; mục III.1 cũng yêu cầu khi không đạt mục tiêu phải xem xét trách nhiệm của các chủ thể liên quan.","t":"Kiểm soát cả lạm quyền, vượt quyền lẫn né tránh, không làm hết thẩm quyền."},{"s":"B","y":"NH","r":"NQ 29-NQ/TW · Mục III.7; III.3; III.5","q":"Nghị quyết xác định vai trò của trí tuệ nhân tạo, công nghệ mới trong lãnh đạo, chỉ đạo như thế nào?","o":["Hỗ trợ tham mưu, phân tích, dự báo, theo dõi tiến độ; không thay thế thẩm quyền, trách nhiệm quyết định của tổ chức, cá nhân.","Có thể thay thế quyết định chính trị khi hệ thống dữ liệu đã đầy đủ và được liên thông.","Chỉ sử dụng trong công tác thống kê, lưu trữ; không áp dụng cho kiểm tra, giám sát và cảnh báo sớm."],"e":"Mục III.7 xác định: ứng dụng trí tuệ nhân tạo, công nghệ mới để hỗ trợ tham mưu, phân tích, dự báo, theo dõi tiến độ; dữ liệu, công nghệ hỗ trợ, không thay thế thẩm quyền, trách nhiệm quyết định của tổ chức, cá nhân.\nGiới hạn mấu chốt là chữ “hỗ trợ”: máy móc giúp nhìn rõ, dự báo, theo dõi; quyết định và trách nhiệm vẫn thuộc con người có thẩm quyền.\nVì sao các phương án còn lại chưa đúng: Phương án để công nghệ thay quyết định chính trị khi dữ liệu đầy đủ, liên thông vượt giới hạn “không thay thế”. Phương án chỉ dùng cho thống kê, lưu trữ, không dùng cho kiểm tra, giám sát, cảnh báo sớm trái mục III.5: đẩy mạnh kiểm tra, giám sát dựa trên dữ liệu, nền tảng số và xây dựng hệ thống cảnh báo dựa trên dữ liệu; mục III.3 còn cho ứng dụng dữ liệu, trí tuệ nhân tạo có kiểm soát để nắm bắt tâm tư, nguyện vọng của cán bộ, đảng viên, Nhân dân.","t":"Công nghệ, dữ liệu hỗ trợ; không thay thế thẩm quyền, trách nhiệm quyết định."},{"s":"C","y":"NH","r":"NQ 30-NQ/TW · Mục IV.3 (đổi mới nội dung đánh giá)","q":"Theo Nghị quyết, việc đổi mới nội dung đánh giá cán bộ phải bảo đảm nguyên tắc nào?","o":["Bảo đảm toàn diện, thực chất về phẩm chất chính trị, tư tưởng, đạo đức, liêm chính, kỷ luật; năng lực thực tiễn, sản phẩm, kết quả, hiệu quả, mức độ cống hiến, uy tín trong tổ chức và trước Nhân dân.","Phẩm chất chính trị, tư tưởng, đạo đức, liêm chính, kỷ luật.","Năng lực thực tiễn, sản phẩm, kết quả, hiệu quả, mức độ cống hiến."],"e":"Mục IV.3 yêu cầu đổi mới nội dung đánh giá bảo đảm toàn diện, thực chất về: phẩm chất chính trị, tư tưởng, đạo đức, liêm chính, kỷ luật; năng lực thực tiễn; sản phẩm, kết quả, hiệu quả; mức độ cống hiến, uy tín trong tổ chức và trước Nhân dân.\nĐây là cụ thể hóa quan điểm “đức là gốc, thực tài là trọng, sản phẩm, kết quả, hiệu quả và cống hiến là thước đo” (mục II.2): đánh giá phải có đủ cả hai mặt, không chỉ một mặt.\nVì sao các phương án còn lại chưa đúng: Phương án chỉ nêu phẩm chất chính trị, tư tưởng, đạo đức, liêm chính, kỷ luật thiếu năng lực thực tiễn, sản phẩm, kết quả, uy tín; đó chính là kiểu đánh giá nặng về hồ sơ mà đột phá thứ nhất (mục III.2) muốn chuyển khỏi. Phương án chỉ nêu năng lực thực tiễn, sản phẩm, kết quả, cống hiến lại thiếu mặt phẩm chất chính trị, đạo đức, liêm chính, kỷ luật; Nghị quyết coi đạo đức là gốc, không bỏ qua.","t":"Đánh giá toàn diện: phẩm chất + năng lực + kết quả + cống hiến + uy tín."},{"s":"C","y":"NH","r":"NQ 30-NQ/TW · Mục IV.3 (đổi mới phương thức đánh giá)","q":"Hai cán bộ cùng nhóm chức danh, cùng được giao một loại nhiệm vụ, nhưng một người công tác ở địa bàn thuận lợi, nguồn lực dồi dào; một người ở địa bàn khó khăn, nguồn lực hạn chế. Theo Nghị quyết, phương thức đánh giá phải:","o":["Đặt kết quả trong tương quan với thẩm quyền, nguồn lực, điều kiện, hoàn cảnh và độ khó của nhiệm vụ.","Áp dụng thống nhất một bộ tiêu chí và một thang điểm chung để bảo đảm công bằng, khách quan.","Lấy mức độ hoàn thành chỉ tiêu đã đăng ký từ đầu năm làm căn cứ chủ yếu."],"e":"Mục IV.3 yêu cầu đổi mới phương thức đánh giá công tâm, khách quan, xuyên suốt, đa chiều, có phân hóa và kiểm chứng; đồng thời đặt kết quả đánh giá trong tương quan với thẩm quyền, nguồn lực, điều kiện, hoàn cảnh và độ khó của nhiệm vụ, không tuyệt đối hóa chỉ số hoặc thành tích nhất thời.\nTình huống trong câu chính là trường hợp này: cùng một kết quả nhưng điều kiện khác nhau thì mức đóng góp không như nhau. Công bằng ở đây là công bằng có xét điều kiện thực tế.\nVì sao các phương án còn lại chưa đúng: Phương án áp dụng một bộ tiêu chí và một thang điểm chung cho mọi người trái yêu cầu “có phân hóa” và việc đặt kết quả trong tương quan với điều kiện, hoàn cảnh, độ khó. Phương án lấy mức hoàn thành chỉ tiêu đăng ký từ đầu năm làm căn cứ chủ yếu là tuyệt đối hóa chỉ số, không xét nguồn lực, điều kiện và độ khó thực tế của nhiệm vụ.","t":"Kết quả đánh giá luôn đặt trong tương quan với thẩm quyền, nguồn lực, điều kiện, hoàn cảnh, độ khó."},{"s":"C","y":"NH","r":"NQ 30-NQ/TW · Mục IV.2","q":"Về hoàn thiện đồng bộ chức danh, nhiệm vụ, vị trí việc làm, Nghị quyết yêu cầu phải bảo đảm đồng thời hai mặt nào?","o":["Cơ cấu chức danh và tiêu chuẩn cán bộ. Không vì cơ cấu mà hạ thấp tiêu chuẩn; không đặt ra tiêu chuẩn hình thức làm thu hẹp nguồn cán bộ.","Không hạ thấp tiêu chuẩn về bằng cấp, đồng thời nâng cao tiêu chuẩn về kinh nghiệm thực tiễn.","Bảo đảm tiêu chuẩn chung của Đảng, đồng thời cho phép mỗi cấp ủy quy định thêm tiêu chuẩn riêng phù hợp đặc thù."],"e":"Mục IV.2 yêu cầu hoàn thiện đồng bộ chức năng, nhiệm vụ, vị trí việc làm, cơ cấu chức danh, tiêu chuẩn và yêu cầu năng lực; tiêu chuẩn phải rõ, thực chất, có khả năng kiểm chứng. Hai mặt phải bảo đảm đồng thời: cơ cấu và tiêu chuẩn, trong đó không vì cơ cấu mà hạ thấp tiêu chuẩn, và không đặt ra tiêu chuẩn hình thức làm thu hẹp nguồn cán bộ.\nTóm lại: không hạ thấp tiêu chuẩn và cũng không siết hình thức; hai nguy cơ ở hai đầu đều phải tránh.\nVì sao các phương án còn lại chưa đúng: Phương án “không hạ thấp tiêu chuẩn về bằng cấp, nâng cao tiêu chuẩn về kinh nghiệm” không phải hai mặt mà Nghị quyết nêu; hơn nữa mục IV.2 yêu cầu không nặng về bằng cấp, thâm niên, hồ sơ, coi trọng năng lực thực tiễn, kết quả, uy tín. Phương án cho mỗi cấp ủy quy định thêm tiêu chuẩn riêng trái nguyên tắc thống nhất, liên thông của thể chế về công tác cán bộ và dễ tạo tiêu chuẩn hình thức làm thu hẹp nguồn.","t":"Không vì cơ cấu mà hạ thấp tiêu chuẩn; không đặt tiêu chuẩn hình thức làm thu hẹp nguồn."},{"s":"C","y":"NH","r":"NQ 30-NQ/TW · Mục IV.2","q":"Nghị quyết xác định quan hệ giữa tiêu chuẩn chức danh với năng lực thực tiễn, kết quả thực hiện nhiệm vụ trong việc đánh giá mức độ phù hợp của cán bộ với vị trí như thế nào?","o":["Tiêu chuẩn là điều kiện cần; năng lực thực tiễn, kết quả thực hiện nhiệm vụ, khả năng đáp ứng yêu cầu vị trí là căn cứ quan trọng để đánh giá mức độ phù hợp.","Tiêu chuẩn chức danh và năng lực thực tiễn là hai căn cứ ngang nhau, bổ sung cho nhau.","Năng lực thực tiễn là điều kiện cần; tiêu chuẩn chức danh là căn cứ quyết định khi lựa chọn nhân sự."],"e":"Mục IV.2 xác định: tiêu chuẩn là điều kiện cần; năng lực thực tiễn, kết quả thực hiện nhiệm vụ, khả năng đáp ứng yêu cầu vị trí, uy tín của cán bộ là căn cứ quan trọng để đánh giá mức độ phù hợp của cán bộ với vị trí. Cùng đoạn, Nghị quyết đổi mới căn bản tiêu chuẩn theo hướng coi trọng phẩm chất, năng lực thực tiễn, kết quả, sản phẩm, uy tín, không nặng về bằng cấp, thâm niên, hồ sơ.\nCách nhớ: tiêu chuẩn là “cửa vào” (điều kiện cần), không đủ để quyết định; mức độ phù hợp được xác định bằng năng lực thực tiễn và kết quả.\nVì sao các phương án còn lại chưa đúng: Phương án coi hai căn cứ ngang nhau không đúng vai trò mà Nghị quyết giao cho từng căn cứ: một bên là điều kiện cần, một bên là căn cứ quan trọng để xác định mức độ phù hợp. Phương án nói năng lực thực tiễn là điều kiện cần còn tiêu chuẩn chức danh là căn cứ quyết định đảo ngược quan hệ này, và nghiêng về hồ sơ, tiêu chuẩn mà Nghị quyết muốn giảm nặng.","t":"Tiêu chuẩn = điều kiện cần; năng lực thực tiễn, kết quả = căn cứ quan trọng đánh giá mức độ phù hợp."},{"s":"C","y":"NH","r":"NQ 30-NQ/TW · Phụ lục, mục 1 (chỉ tiêu đến năm 2030)","q":"Nghị quyết xác định chỉ tiêu đến năm 2030, việc xây dựng đội ngũ cán bộ cần đạt là gì?","o":["Bảo đảm cơ cấu cán bộ hợp lý; tiếp tục nâng tỷ lệ cán bộ trẻ, cán bộ nữ, cán bộ là người dân tộc thiểu số, chuyên gia, nhà khoa học, nhân tài phù hợp với mô hình tổ chức chính quyền địa phương 2 cấp.","Tỷ lệ cán bộ hoàn thành xuất sắc nhiệm vụ và tỷ lệ cán bộ đạt chuẩn chức danh.","Mức độ hoàn thành các chỉ tiêu về cơ cấu cán bộ trẻ, cán bộ nữ, cán bộ là người dân tộc thiểu số."],"e":"Phụ lục nêu chỉ tiêu: bảo đảm cơ cấu cán bộ hợp lý, đáp ứng yêu cầu nhiệm vụ; tiếp tục nâng tỉ lệ cán bộ trẻ, cán bộ nữ, cán bộ là người dân tộc thiểu số, chuyên gia, nhà khoa học, nhân tài phù hợp với mô hình tổ chức, bộ máy mới của hệ thống chính trị và chính quyền địa phương 2 cấp. Cùng đoạn có các mức cụ thể: ít nhất 15% cấp ủy viên là nữ và có cán bộ nữ trong ban thường vụ; ít nhất 10% cán bộ trẻ tham gia cấp ủy; ít nhất 10% và hướng tới 15% cán bộ có trình độ về khoa học, công nghệ trong cấp ủy; tỉ lệ cấp ủy viên là người dân tộc thiểu số phù hợp với đặc điểm, cơ cấu dân tộc và điều kiện cụ thể của từng địa phương, cơ quan, đơn vị.\nCần nhớ: đây là chỉ tiêu về cơ cấu hợp lý, gắn với mô hình tổ chức mới (chính quyền địa phương 2 cấp); riêng dân tộc thiểu số không đặt một tỉ lệ chung mà tùy từng nơi.\nVì sao các phương án còn lại chưa đúng: Phương án tỉ lệ cán bộ hoàn thành xuất sắc nhiệm vụ và tỉ lệ cán bộ đạt chuẩn chức danh không phải chỉ tiêu về xây dựng đội ngũ nêu trong mục này của Phụ lục; Nghị quyết còn không muốn nặng về hồ sơ, tiêu chuẩn hình thức (mục IV.2). Phương án chỉ nói “mức độ hoàn thành các chỉ tiêu” về cán bộ trẻ, cán bộ nữ, cán bộ dân tộc thiểu số thì thiếu chuyên gia, nhà khoa học, nhân tài và yêu cầu phù hợp với mô hình chính quyền địa phương 2 cấp, đồng thời bỏ việc “tiếp tục nâng tỉ lệ” và cơ cấu hợp lý là nội dung chính của chỉ tiêu.","t":"Cơ cấu hợp lý; nâng tỉ lệ cán bộ trẻ, nữ, dân tộc thiểu số, chuyên gia, nhà khoa học, nhân tài; phù hợp chính quyền địa phương 2 cấp."},{"s":"C","y":"NH","r":"NQ 30-NQ/TW · Mục IV.5; IV.4","q":"Điểm mới của Nghị quyết về phương thức huy động, sử dụng nhân tài là gì?","o":["Xuất phát từ yêu cầu nhiệm vụ, những vấn đề lớn, khó, chiến lược của đất nước; gắn việc sử dụng người tài với nhiệm vụ xứng tầm, thẩm quyền, nguồn lực, sản phẩm và giá trị cống hiến.","Cho phép tuyển dụng không qua thi tuyển đối với người có học vị tiến sĩ và chuyên gia đầu ngành.","Mở rộng chỉ tiêu biên chế cho các lĩnh vực khoa học, công nghệ, đổi mới sáng tạo và chuyển đổi số."],"e":"Mục IV.5 nêu: việc phát hiện, thu hút, trọng dụng, sử dụng và phát triển nhân tài phải xuất phát từ yêu cầu nhiệm vụ, những vấn đề lớn, khó, chiến lược của đất nước; gắn việc sử dụng người tài với nhiệm vụ xứng tầm, thẩm quyền, nguồn lực và sản phẩm, kết quả cần đạt; căn cứ vào phẩm chất, năng lực thực chất, tài năng, sản phẩm và giá trị cống hiến.\nĐiểm mới là “đặt hàng” theo nhiệm vụ trước, rồi mới tìm và giao người, kèm thẩm quyền, nguồn lực và sản phẩm cần đạt.\nVì sao các phương án còn lại chưa đúng: Phương án tuyển dụng không qua thi tuyển với người có học vị tiến sĩ, chuyên gia đầu ngành lấy học vị làm căn cứ, trong khi Nghị quyết yêu cầu căn cứ phẩm chất, năng lực thực chất, sản phẩm, giá trị cống hiến và không nặng về bằng cấp (mục IV.2); điều khoản trong văn bản chỉ nói cơ chế “vượt trội” trong tuyển dụng, bổ nhiệm cho người có năng lực nổi trội (mục IV.4). Phương án mở rộng chỉ tiêu biên chế đi ngược mục IV.4: huy động, sử dụng theo nhiệm vụ, chương trình, đề án, dự án, không nhất thiết gắn với biên chế, chức vụ hoặc làm việc toàn thời gian.","t":"Từ nhiệm vụ lớn, khó, chiến lược → người tài + nhiệm vụ xứng tầm, thẩm quyền, nguồn lực, sản phẩm."},{"s":"C","y":"NH","r":"NQ 30-NQ/TW · Mục IV.4; II.4","q":"Việc bố trí cán bộ phải bảo đảm yêu cầu gì?","o":["Bảo đảm cơ cấu hợp lý, năng lực và sở trường, đúng người, đúng việc.","Căn cứ yêu cầu thực tế để xác định.","Thực hiện theo quy trình và báo cáo cấp có thẩm quyền."],"e":"Mục IV.4 yêu cầu bố trí cán bộ phải bảo đảm cơ cấu hợp lý, năng lực và sở trường, đúng người, đúng việc; đồng thời xây dựng tập thể lãnh đạo đoàn kết, thống nhất, bổ sung cho nhau. Quan điểm 4 (mục II) thêm “đúng thời điểm” và gắn việc lựa chọn đúng cán bộ với xây dựng tập thể lãnh đạo mạnh.\nTrọng tâm là bố trí theo năng lực, sở trường và nhu cầu công việc, đúng người, đúng việc; không bố trí công việc theo con người hiện có.\nVì sao các phương án còn lại chưa đúng: Phương án chung chung “căn cứ yêu cầu thực tế để xác định” không nêu tiêu chí nào của Nghị quyết (cơ cấu, năng lực, sở trường, đúng người đúng việc). Phương án chỉ “thực hiện theo quy trình và báo cáo cấp có thẩm quyền” coi quy trình là mục đích; Nghị quyết yêu cầu tinh gọn quy trình, bãi bỏ khâu trung gian, hình thức và đặt chất lượng, kết quả, hệ quả của quyết định cán bộ lên trên.","t":"Bố trí cán bộ: cơ cấu hợp lý, đúng năng lực, sở trường, đúng người, đúng việc."},{"s":"C","y":"NH","r":"NQ 30-NQ/TW · Mục IV.6","q":"Nghị quyết yêu cầu phân định rõ hai loại chính sách nào đối với cán bộ?","o":["Chính sách đãi ngộ theo kết quả, cống hiến với chính sách hỗ trợ do điều kiện công tác khó khăn, nguy hiểm, rủi ro.","Chính sách tiền lương theo ngạch, bậc với chính sách tiền thưởng theo kết quả công việc.","Chính sách đối với cán bộ lãnh đạo, quản lý với chính sách đối với chuyên gia, cán bộ chuyên môn sâu."],"e":"Mục IV.6 yêu cầu đổi mới đồng bộ chính sách cán bộ theo vị trí việc làm, trách nhiệm, kết quả và mức độ cống hiến; trong đó phân định rõ chính sách đãi ngộ theo kết quả, cống hiến với chính sách hỗ trợ do điều kiện công tác khó khăn, nguy hiểm, rủi ro.\nHai loại chính sách có căn cứ khác nhau: một loại trả theo kết quả, đóng góp; loại kia bù cho điều kiện công tác (khó khăn, nguy hiểm, rủi ro). Không gộp lẫn.\nVì sao các phương án còn lại chưa đúng: Phương án lương theo ngạch, bậc với thưởng theo kết quả không phải cách phân loại của Nghị quyết, vốn gắn chính sách với vị trí việc làm, trách nhiệm, kết quả và mức độ cống hiến (cải cách tiền lương, thu nhập, tiền thưởng là một nội dung trong cùng mục). Phương án chính sách cho cán bộ lãnh đạo, quản lý với chuyên gia là nội dung “hai hướng phát triển” (mục IV.5), nói về con đường phát triển và đãi ngộ tương xứng, không phải hai loại chính sách mà mục IV.6 yêu cầu phân định.","t":"Đãi ngộ theo kết quả, cống hiến ≠ hỗ trợ do điều kiện khó khăn, nguy hiểm, rủi ro."},{"s":"C","y":"NH","r":"NQ 30-NQ/TW · Mục IV.7","q":"Theo Nghị quyết, thước đo chất lượng tham mưu của cơ quan làm công tác tổ chức, cán bộ là gì?","o":["Chất lượng đội ngũ và chất lượng quyết định cán bộ.","Số lượng và tiến độ các đề án, văn bản được tham mưu ban hành đúng hạn.","Mức độ chặt chẽ, chính xác của hồ sơ và quy trình nhân sự do cơ quan thẩm định."],"e":"Mục IV.7 yêu cầu xây dựng cơ quan tham mưu và đội ngũ làm công tác tổ chức, cán bộ, nhất là cán bộ tham mưu chiến lược “trung thành, trung thực, gương mẫu, trong sáng, tinh thông”, và lấy chất lượng đội ngũ và chất lượng quyết định cán bộ làm thước đo chất lượng tham mưu.\nThước đo nằm ở kết quả của công tác cán bộ (đội ngũ và quyết định có tốt không), không nằm ở khối lượng việc cơ quan làm.\nVì sao các phương án còn lại chưa đúng: Số lượng và tiến độ đề án, văn bản được tham mưu đúng hạn chỉ đo khối lượng và thời gian, không đo chất lượng. Mức độ chặt chẽ, chính xác của hồ sơ và quy trình nhân sự đo khâu thủ tục; Nghị quyết yêu cầu tinh gọn quy trình, hồ sơ, bãi bỏ khâu hình thức (mục IV.2) và chuyển từ đánh giá nặng về hồ sơ, quy trình sang chất lượng thực chất (mục III.2).","t":"Thước đo tham mưu: chất lượng đội ngũ và chất lượng quyết định cán bộ."},{"s":"C","y":"NH","r":"NQ 30-NQ/TW · Mục IV.2","q":"Sau khi đã phân cấp, phân quyền trong công tác cán bộ, trách nhiệm của cấp trên được Nghị quyết xác định là gì?","o":["Không làm thay việc đã phân cấp; tập trung kiểm tra, giám sát, hậu kiểm và cảnh báo rủi ro.","Thẩm định lại hồ sơ nhân sự trước khi cấp dưới ban hành quyết định.","Cho ý kiến bằng văn bản đối với những trường hợp nhân sự quan trọng thuộc thẩm quyền cấp dưới."],"e":"Mục IV.2 yêu cầu phân cấp, phân quyền trong công tác cán bộ phù hợp với năng lực từng cấp, ngành, lĩnh vực, địa bàn, gắn với nguồn lực, trách nhiệm giải trình và kiểm soát quyền lực. Sau khi phân cấp, cấp trên không làm thay việc đã phân cấp; tập trung kiểm tra, giám sát, hậu kiểm và cảnh báo rủi ro.\nVai trò cấp trên chuyển từ quyết định thay sang kiểm tra sau và cảnh báo rủi ro; cấp dưới quyết định và chịu trách nhiệm trong phạm vi được phân cấp.\nVì sao các phương án còn lại chưa đúng: Phương án thẩm định lại hồ sơ nhân sự trước khi cấp dưới ban hành quyết định biến cấp trên thành khâu duyệt trước, thực chất là làm thay việc đã phân cấp và thêm khâu trung gian mà mục IV.2 yêu cầu bãi bỏ. Phương án cho ý kiến bằng văn bản đối với trường hợp nhân sự quan trọng thuộc thẩm quyền cấp dưới cũng can thiệp vào quyết định đã phân cấp thay vì kiểm tra, hậu kiểm.","t":"Đã phân cấp thì cấp trên không làm thay; tập trung kiểm tra, giám sát, hậu kiểm, cảnh báo rủi ro."},{"s":"C","y":"NH","r":"NQ 30-NQ/TW · Mục III.2 (đột phá thứ hai); IV.4","q":"Đột phá về tạo nguồn của Nghị quyết chuyển công tác quy hoạch cán bộ theo hướng nào?","o":["Từ quy hoạch khép kín theo chức danh sang chủ động chuẩn bị đội ngũ cho các nhiệm vụ và năng lực chiến lược của tương lai.","Từ quy hoạch theo nhiệm kỳ sang quy hoạch dài hạn 10 năm cho từng chức danh lãnh đạo, quản lý.","Từ quy hoạch do tập thể cấp ủy quyết định sang quy hoạch do người đứng đầu giới thiệu và chịu trách nhiệm."],"e":"Đột phá thứ hai (mục III.2) chuyển từ nguồn khép kín, chuẩn bị nhân sự theo từng chức danh sang phát hiện, tạo nguồn mở, chủ động đào tạo, bồi dưỡng đội ngũ kế cận nhiều thế hệ, nhiều phương án. Mục IV.4 áp vào quy hoạch: quy hoạch phải mở, động, tinh, thực chất; chuyển từ quy hoạch khép kín theo chức danh sang chủ động chuẩn bị đội ngũ cho các nhiệm vụ và năng lực chiến lược của tương lai.\nTừ khóa: khép kín → mở; theo chức danh → theo nhiệm vụ và năng lực chiến lược của tương lai.\nVì sao các phương án còn lại chưa đúng: Phương án quy hoạch dài hạn 10 năm cho từng chức danh vẫn gắn với từng chức danh, tức là giữ cách làm mà Nghị quyết muốn chuyển khỏi; văn bản cũng không nêu thời hạn 10 năm. Phương án chuyển quyền quyết định sang người đứng đầu giới thiệu và chịu trách nhiệm đặt thêm một cách làm không có trong Nghị quyết: văn bản yêu cầu quy trình dân chủ, khách quan, rõ trách nhiệm của từng chủ thể (nhận xét, giới thiệu, thẩm định, người đứng đầu, cấp có thẩm quyền), chứ không dồn vào một chủ thể.","t":"Quy hoạch mở, động, tinh; từ chức danh sang nhiệm vụ và năng lực chiến lược của tương lai."},{"s":"C","y":"NH","r":"NQ 30-NQ/TW · Phụ lục, mục 1 (chỉ tiêu đến năm 2030); IV.4","q":"Chỉ tiêu đến năm 2030 về nguồn kế cận đối với vị trí lãnh đạo, quản lý cấp chiến lược và người đứng đầu các cấp là gì?","o":["100% vị trí có nguồn kế cận được chuẩn bị nhiều lớp, có ít nhất 2 phương án gắn với kế hoạch phát hiện, đào tạo, bồi dưỡng, rèn luyện, thử thách và kiểm chứng qua thực tiễn.","100% vị trí có nguồn quy hoạch với hệ số từ 1,5 đến 2 lần số lượng cấp ủy viên đương nhiệm.","Ít nhất 80% vị trí có nguồn kế cận tại chỗ, 20% còn lại chuẩn bị nguồn từ nơi khác điều động đến."],"e":"Phụ lục nêu: phấn đấu 100% vị trí lãnh đạo, quản lý cấp chiến lược và người đứng đầu các cấp có nguồn kế cận được chuẩn bị nhiều lớp; có ít nhất 2 phương án gắn với kế hoạch phát hiện, đào tạo, bồi dưỡng, rèn luyện, thử thách và kiểm chứng qua thực tiễn. Chỉ tiêu này cụ thể hóa yêu cầu ở mục IV.5: các vị trí lãnh đạo, quản lý trọng yếu phải có nguồn kế cận nhiều độ tuổi, nhiều phương án thay thế.\nGhi nhớ ba ý: 100% vị trí; nhiều lớp và ít nhất 2 phương án; gắn với kế hoạch phát hiện, đào tạo, rèn luyện, thử thách, kiểm chứng qua thực tiễn.\nVì sao các phương án còn lại chưa đúng: Phương án quy hoạch với “hệ số từ 1,5 đến 2 lần số lượng cấp ủy viên đương nhiệm” là kiểu chỉ tiêu theo hệ số số lượng, không có trong Phụ lục; chỉ tiêu ở đây tính theo vị trí, theo số phương án và theo quá trình rèn luyện, kiểm chứng. Phương án ít nhất 80% nguồn tại chỗ, 20% điều động từ nơi khác sai cả mức (Phụ lục nêu 100% vị trí) lẫn cách chia tỉ lệ, trái hướng nguồn mở, động, không khép kín và mở rộng phát hiện cả trong và ngoài khu vực công (mục IV.4).","t":"100% vị trí cấp chiến lược và người đứng đầu có nguồn kế cận nhiều lớp, ít nhất 2 phương án."},{"s":"D","y":"NH","r":"QĐ 224-QĐ/TW · Điều 1; Điều 2","q":"Nhận định nào dưới đây phản ánh đúng phạm vi điều chỉnh của Quy định số 224-QĐ/TW về đảng viên tham gia hoạt động đầu tư kinh doanh?","o":["Quy định về chủ trương, nguyên tắc, giới hạn, quyền, trách nhiệm và kiểm soát xung đột lợi ích đối với đảng viên tham gia hoạt động đầu tư kinh doanh.","Chỉ quy định quyền sở hữu tài sản của đảng viên ngoài khu vực công.","Chỉ quy định thủ tục kê khai và xin chấp thuận trước khi đảng viên đầu tư kinh doanh."],"e":"Điều 1 xác định Quy định này điều chỉnh về chủ trương, nguyên tắc, giới hạn, quyền, trách nhiệm và kiểm soát xung đột lợi ích đối với đảng viên tham gia hoạt động đầu tư kinh doanh.\nGhi nhớ sáu nội dung: chủ trương, nguyên tắc, giới hạn, quyền, trách nhiệm, kiểm soát xung đột lợi ích. Quy định vừa mở quyền (Điều 2.2: bảo vệ quyền sở hữu, quyền tài sản; cấp ủy không đặt thêm điều kiện, thủ tục hạn chế) vừa đặt giới hạn và kiểm soát.\nVì sao các phương án còn lại chưa đúng: Phương án chỉ quy định quyền sở hữu tài sản của đảng viên ngoài khu vực công thu hẹp quá mức: Quy định áp dụng cả đảng viên trong khu vực công (Điều 6–10) và quyền sở hữu chỉ là một nội dung bảo vệ ở Điều 2.2. Phương án chỉ gồm thủ tục xin chấp thuận cũng sai: chấp thuận chỉ áp dụng ở những trường hợp Quy định nêu (Điều 2.5, Điều 7–10), còn đảng viên ngoài khu vực công không phải xin chấp thuận (Điều 5.1).","t":"Phạm vi: chủ trương, nguyên tắc, giới hạn, quyền, trách nhiệm, kiểm soát xung đột lợi ích."},{"s":"D","y":"NH","r":"QĐ 224-QĐ/TW · Điều 2.3; Điều 5–11","q":"Quy định số 224-QĐ/TW điều chỉnh việc tham gia hoạt động đầu tư kinh doanh đối với nhóm đảng viên nào?","o":["Đảng viên trong và ngoài khu vực công, với quyền và giới hạn tương ứng theo chức danh, vị trí, nhiệm vụ.","Chỉ đảng viên là viên chức.","Chỉ đảng viên ngoài khu vực công."],"e":"Quy định điều chỉnh đảng viên cả trong và ngoài khu vực công, với quyền và giới hạn xác định theo chức danh, vị trí công tác, chức trách, nhiệm vụ được giao (Điều 2.3). Các điều 5 đến 11 lần lượt quy định cho: đảng viên ngoài khu vực công; cán bộ thuộc diện Bộ Chính trị, Ban Bí thư quản lý; cán bộ, công chức khác; viên chức; đảng viên trong Quân đội, Công an; người quản lý doanh nghiệp nhà nước, người đại diện phần vốn nhà nước; đảng viên sau khi thôi giữ chức vụ, thôi công tác, nghỉ hưu.\nVì sao các phương án còn lại chưa đúng: Phương án chỉ gồm đảng viên là viên chức bỏ sót sáu nhóm còn lại (viên chức là một nhóm riêng ở Điều 8). Phương án chỉ gồm đảng viên ngoài khu vực công (Điều 5) bỏ sót toàn bộ các nhóm trong khu vực công; Điều 2.4 còn đặt riêng ràng buộc cho đảng viên trong khu vực công.","t":"Áp dụng cả trong và ngoài khu vực công; quyền, giới hạn theo chức danh, vị trí, nhiệm vụ."},{"s":"D","y":"NH","r":"QĐ 224-QĐ/TW · Điều 4","q":"Theo Quy định số 224-QĐ/TW, hoạt động đầu tư kinh doanh của đảng viên được phân thành những nhóm nào?","o":["Bốn nhóm: hoạt động chuyê
